<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI가 하는 말을 믿을 수 있을까요? 환각 찾기 | xueai.app</title>
<link rel="stylesheet" href="lesson.css">
<style>
@keyframes _si{to{opacity:1}}
body{opacity:0;animation:_si .15s ease .08s forwards}

:root{
  --red:var(--danger);
  --green:var(--success);
  --surface:var(--card);
  --muted:var(--sub);
  --tips-accent:#0891b2;
}

.lesson-header h1 em{font-style:normal;color:var(--danger)}

/* 상단 컨트롤 바 */
.ctrl-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.score-badge{padding:8px 16px;border-radius:20px;font-size:14px;font-weight:800}
.btn-reveal{background:var(--tips-accent);color:white;border:none;padding:10px 20px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;transition:all .15s;font-family:inherit}
.btn-reveal:hover{filter:brightness(1.1)}
.btn-reveal:disabled{background:#ccc;cursor:not-allowed}
.round-tabs{display:flex;gap:6px}
.round-tab{padding:8px 14px;border-radius:8px;border:1.5px solid var(--border);background:var(--surface);font-size:13px;font-weight:700;cursor:pointer;color:var(--sub);transition:all .15s;font-family:inherit}
.round-tab.active{background:var(--tips-accent);border-color:var(--tips-accent);color:white}

/* 두 열 레이아웃 */
.verify-layout{display:grid;grid-template-columns:1.15fr 1fr;gap:20px;align-items:start}
.claim-list{display:flex;flex-direction:column;gap:10px}
.right-panel{display:flex;flex-direction:column;gap:10px}

.scenario-label{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.4px;text-transform:uppercase}
.scenario-q{font-size:14px;font-weight:700;color:var(--tips-accent);padding:10px 12px;background:rgba(8,145,178,.06);border:1px solid rgba(8,145,178,.2);border-radius:8px}

.claim{background:var(--surface);border:2px solid var(--border);border-radius:12px;padding:13px 14px;cursor:pointer;transition:all .2s;position:relative}
.claim:hover{border-color:rgba(8,145,178,.3)}
.claim.selected{border-color:var(--red);background:rgba(220,38,38,.04)}
.claim.revealed-true{border-color:var(--green);background:rgba(22,163,74,.04);cursor:default}
.claim.revealed-false{border-color:var(--red);background:rgba(220,38,38,.04);cursor:default}
.claim-num{position:absolute;top:10px;right:12px;font-size:11px;font-weight:800;color:var(--muted)}
.claim-text{font-size:14px;line-height:1.65;color:var(--text);padding-right:24px}
.claim-verdict{display:none;margin-top:8px;padding:8px 10px;border-radius:8px;font-size:13px;line-height:1.6}
.revealed-true .claim-verdict{display:block;background:rgba(22,163,74,.08);color:#14532d}
.revealed-false .claim-verdict{display:block;background:rgba(220,38,38,.08);color:#7c2d12}

.inst-box{padding:12px 14px;border-radius:10px;font-size:14px;line-height:1.7}
.stat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center}
.stat-num{font-size:22px;font-weight:900}
.stat-lbl{font-size:11px;color:var(--muted);margin-top:2px}

.lesson-box{background:rgba(8,145,178,.06);border:1.5px solid rgba(8,145,178,.2);border-radius:12px;padding:14px;font-size:14px;color:var(--sub);line-height:1.7}
.lesson-box strong{color:var(--text)}
.lesson-box em{font-style:normal;color:var(--tips-accent);font-weight:700}

.pattern-list{display:flex;flex-direction:column;gap:6px}
.pattern-item{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--sub);line-height:1.5}
.pattern-icon{flex-shrink:0;width:20px;height:20px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;margin-top:1px}
.pattern-item strong{color:var(--text)}

@media (max-width:768px){
  .verify-layout{grid-template-columns:1fr}
}
</style>

<body>
<article class="lesson wide">

    <h1>AI의 말을 <em>믿을 수 있을까요?</em></h1>
    <p class="subtitle">AI가 만들어낸 내용을 찾아보세요. 문제가 있다고 생각하는 항목을 클릭한 후 답을 확인합니다.</p>

  <div class="sec-label">도전</div>

<script>
const ROUNDS = [
  {
    question: '사용자가 AI에게 물었습니다: "양자 컴퓨팅의 발전 역사를 알려주세요"',
    claims: [
      {text:'양자 컴퓨팅의 이론적 기반은 1981년으로 거슬러 올라갑니다. 물리학자 리처드 파인만이 양자 시스템으로 물리 문제를 시뮬레이션하자고 제안했습니다.', truth:true, explain:'✅ 정확합니다. 파인만은 실제로 1981년에 이 개념을 제시했으며 양자 컴퓨팅의 출발점 중 하나로 인정받습니다.'},
      {text:'1994년 Peter Shor가 Shor 알고리즘을 발명하여 양자 컴퓨터가 다항 시간에 큰 정수를 인수분해할 수 있음을 증명하고 암호학계를 충격에 빠뜨렸습니다.', truth:true, explain:'✅ 정확합니다. Shor 알고리즘은 양자 컴퓨팅의 이정표 사건으로, 날짜·인물·내용 모두 정확합니다.'},
      {text:'2001년 IBM 팀이 7큐비트 양자 컴퓨터로 숫자 15를 성공적으로 인수분해했습니다. 이것이 Shor 알고리즘의 첫 번째 실험적 검증입니다.', truth:true, explain:'✅ 정확합니다. IBM은 실제로 2001년에 이 실험을 수행하여 15를 3×5로 인수분해했습니다.'},
      {text:'2019년 구글의 Sycamore 양자 프로세서가 53큐비트로 기존 슈퍼컴퓨터가 1만 년 걸릴 계산을 200초 만에 완료하여 "양자 우월성"을 선언했습니다.', truth:true, explain:'✅ 정확합니다. 2019년 구글이 Nature에 발표한 연구 결과로, 데이터와 날짜 모두 정확합니다.'},
      {text:'2023년 MIT 장리밍 교수 팀이 "QubitNet" 프레임워크를 발표하여 1,000개의 논리 큐비트의 안정적 얽힘을 처음으로 구현했고 Nature가 올해의 10대 혁신 중 하나로 선정했습니다.', truth:false, explain:'❌ 완전히 조작된 내용입니다. "장리밍 교수"와 "QubitNet" 프레임워크는 존재하지 않으며 1,000개의 논리 큐비트 안정 얽힘 실험도 없습니다. AI가 이름, 프로젝트명, 성과를 지어냈으며 매우 실제처럼 만들었습니다.'},
      {text:'2024년 말 기준 IBM의 Condor 프로세서는 1,121큐비트에 도달하여 현재 공개 발표된 가장 큰 초전도 양자 프로세서입니다.', truth:true, explain:'✅ 기본적으로 정확합니다. IBM은 실제로 Condor 프로세서를 발표했으며 1,121큐비트는 정확한 수치입니다.'},
    ],
    lesson:'이 6개 항목 중 <em>조작된 것은 1개뿐</em>(5번)이지만 형식과 인용 방식이 나머지 5개의 실제 정보와 완전히 동일합니다. <strong>이것이 환각의 위험입니다: 실제 정보 사이에 섞여 있으면 전혀 구분할 수 없습니다.</strong>',
    patterns:[
      {icon:'🎭',color:'var(--red)',bg:'rgba(220,38,38,.1)',text:'<strong>이름 조작</strong> — AI는 존재하지 않는 연구자를 만들어내고 실제 기관과 결합해 신뢰도를 높입니다'},
      {icon:'📰',color:'var(--red)',bg:'rgba(220,38,38,.1)',text:'<strong>프로젝트 조작</strong> — "QubitNet"은 그럴듯하게 들리지만 완전히 허구입니다'},
      {icon:'🏆',color:'var(--red)',bg:'rgba(220,38,38,.1)',text:'<strong>영예 조작</strong> — "Nature 올해의 10대"는 AI가 가장 좋아하는 조작 수법입니다'},
    ]
  },
  {
    question: '사용자가 AI에게 물었습니다: "제품 관리에 관한 고전 도서를 추천해 주세요"',
    claims: [
      {text:'Inspired — Marty Cagan 저. 사용자가 사랑하는 제품을 만드는 방법을 다루며 PM 필독서로 불립니다.', truth:true, explain:'✅ 정확합니다. Inspired는 Marty Cagan의 저작이며 제품 관리 분야의 고전입니다.'},
      {text:'User Story Mapping — Jeff Patton 저. 팀이 제품 전체 그림을 이해하는 데 도움이 되는 사용자 스토리 맵 방법론을 제시합니다.', truth:true, explain:'✅ 정확합니다. 저자, 제목, 내용 모두 정확합니다.'},
      {text:'제품 사고의 삼중문 — 천밍위안 저, 2022년 CITIC Press 출판. 인지 과학 관점에서 제품 설계 방법론을 재정의했으며 더우반 평점 8.9점.', truth:false, explain:'❌ 완전히 조작되었습니다. 이 책은 존재하지 않으며 "천밍위안"은 가상의 이름이고 더우반 8.9점도 꾸며낸 것입니다. AI가 출판사, 연도, 평점을 추가하여 더 믿기 쉽게 만들었습니다.'},
      {text:'The Lean Startup — Eric Ries 저. MVP(최소 기능 제품) 개념과 "구축-측정-학습" 루프를 제시합니다.', truth:true, explain:'✅ 정확합니다. 스타트업과 제품 분야의 고전이며 저자와 핵심 개념 모두 정확합니다.'},
      {text:'Hacking Growth — Sean Ellis & Morgan Brown 공저. 데이터 주도 성장 방법론을 체계적으로 소개합니다.', truth:true, explain:'✅ 정확합니다. 저자와 내용 소개가 정확합니다.'},
    ],
    lesson:'3번 항목이 조작되었지만 실제 추천보다 <em>더 "정성스러워" 보입니다</em> — 출판사, 연도, 더우반 평점이 있습니다. <strong>AI가 "자세한 인용"을 더 많이 줄수록 더 의심해야 합니다</strong>: 진짜 인용은 검색하면 찾을 수 있고, 찾을 수 없는 것은 조작된 것입니다.',
    patterns:[
      {icon:'📚',color:'var(--amber)',bg:'rgba(217,119,6,.1)',text:'<strong>도서명 조작</strong> — 형식은 완벽하지만 책이 전혀 존재하지 않습니다'},
      {icon:'👤',color:'var(--amber)',bg:'rgba(217,119,6,.1)',text:'<strong>저자 조작</strong> — 중국어 이름은 특히 쉽게 조작됩니다'},
      {icon:'⭐',color:'var(--amber)',bg:'rgba(217,119,6,.1)',text:'<strong>평점 조작</strong> — 더우반/Goodreads 평점은 AI가 가장 좋아하는 신뢰도 부풀리기 도구입니다'},
    ]
  },
  {
    question: '사용자가 AI에게 물었습니다: "중국에는 AI에 관한 어떤 법률과 규정이 있나요?"',
    claims: [
      {text:'생성형 인공지능 서비스 관리 임시 방법은 2023년 8월 15일부터 시행되었으며 국가 사이버공간 관리국 등 7개 부처가 공동으로 발표했습니다.', truth:true, explain:'✅ 정확합니다. 이것은 실제 법규이며 날짜와 발표 기관 모두 정확합니다.'},
      {text:'인터넷 정보 서비스 알고리즘 추천 관리 규정은 2022년 3월 1일부터 시행되었으며 알고리즘 추천 행위를 규범화했습니다.', truth:true, explain:'✅ 정확합니다. 이 법규는 국가 사이버공간 관리국 등 4개 부처가 발표했으며 2022년 3월 1일부터 정식 시행되었습니다.'},
      {text:'인공지능 산업 발전 촉진 조례는 2024년 1월부터 시행되었으며 과학기술부가 주도하여 제정한 중국 최초의 AI 전문 법률로 8장 64조로 구성되어 있습니다.', truth:false, explain:'❌ 조작되었습니다. 훈련 데이터 기준으로 이러한 전국적 법규는 존재하지 않습니다. AI가 발표 기관, 장절 수, "최초" 타이틀을 꾸며냈으며 실제 법규와 형식이 동일합니다.'},
      {text:'인터넷 정보 서비스 딥 합성 관리 규정은 2023년 1월 10일부터 시행되었으며 AI 생성 콘텐츠 표시 요건을 제시했습니다.', truth:true, explain:'✅ 정확합니다. 이것은 실제 법규로 딥 합성 콘텐츠 표시를 요구합니다.'},
    ],
    lesson:'법규 분야는 <em>환각의 온상</em>입니다. 3번 항목은 형식과 장절 수가 실제처럼 보이는 "최초 AI 전문 입법"을 조작했습니다. <strong>법률 조문은 반드시 공식 웹사이트(예: 국가법률법규 데이터베이스)에서 확인해야 합니다</strong> — AI 출력을 그대로 옮겨서는 절대 안 됩니다.',
    patterns:[
      {icon:'⚖️',color:'var(--red)',bg:'rgba(220,38,38,.1)',text:'<strong>법규 조작</strong> — 공식적인 이름, 완벽한 형식이지만 법규가 존재하지 않습니다'},
      {icon:'📋',color:'var(--red)',bg:'rgba(220,38,38,.1)',text:'<strong>세부사항 조작</strong> — "8장 64조"로 실제로 원문을 읽은 것처럼 느끼게 합니다'},
      {icon:'🏛️',color:'var(--red)',bg:'rgba(220,38,38,.1)',text:'<strong>권위 조작</strong> — "과학기술부 주도" "최초"는 신뢰도를 높이는 수법입니다'},
    ]
  }
];

let curRound = 0;
let revealed = false;
let userSelections = new Set();

function renderRound(r) {
  curRound = r; revealed = false; userSelections.clear();
  document.querySelectorAll('.round-tab').forEach((t,i) => t.classList.toggle('active', i===r));
  document.getElementById('scoreBadge').textContent = '문제가 있다고 생각하는 항목을 클릭하세요';
  document.getElementById('scoreBadge').style.background = 'rgba(8,145,178,.1)';
  document.getElementById('scoreBadge').style.color = 'var(--accent)';
  document.getElementById('revealBtn').disabled = false;

  const rd = ROUNDS[r];
  const list = document.getElementById('claimList');
  list.innerHTML = `<div class="scenario-label">AI에게 전달된 질문</div><div class="scenario-q">${rd.question}</div>`;
  rd.claims.forEach((c,i) => {
    const div = document.createElement('div');
    div.className = 'claim';
    div.innerHTML = `<div class="claim-num">#${i+1}</div><div class="claim-text">${c.text}</div><div class="claim-verdict">${c.explain}</div>`;
    div.onclick = () => toggleClaim(div, i);
    list.appendChild(div);
  });

  const right = document.getElementById('rightPanel');
  right.innerHTML = `
    <div class="inst-box" style="background:rgba(220,38,38,.06);border:1.5px solid rgba(220,38,38,.2);color:#991b1b">
      <strong>도전:</strong> 다음은 AI의 답변이며, 그 중에 조작된 내용이 섞여 있습니다. 문제라고 생각하는 항목을 클릭하고 "정답 공개"를 누르세요.
    </div>
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-num" style="color:var(--accent)" id="totalStat">${rd.claims.length}</div><div class="stat-lbl">总条目</div></div>
      <div class="stat-card"><div class="stat-num" style="color:var(--red)" id="fakeStat">?</div><div class="stat-lbl">조작된 수</div></div>
      <div class="stat-card"><div class="stat-num" style="color:var(--green)" id="yourStat">0</div><div class="stat-lbl">내가 표시한</div></div>
    </div>
    <div class="lesson-box" id="lessonBox" style="display:none"></div>
    <div class="pattern-list" id="patternList" style="display:none"></div>
    <div class="lesson-box" style="background:rgba(217,119,6,.06);border-color:rgba(217,119,6,.2)">
      <strong>힌트:</strong> <em>특별히 많은 세부 사항</em>(인명, 숫자, 평점, 챕터 수)을 제공하는 항목에 주의하세요 — 세부 사항이 많을수록 더 의심스럽습니다.
    </div>
  `;
}

function toggleClaim(el, idx) {
  if (revealed) return;
  el.classList.toggle('selected');
  if (userSelections.has(idx)) userSelections.delete(idx); else userSelections.add(idx);
  document.getElementById('yourStat').textContent = userSelections.size;
}

function revealAll() {
  if (revealed) return;
  revealed = true;
  const rd = ROUNDS[curRound];
  const fakeCount = rd.claims.filter(c => !c.truth).length;
  let correct = 0;
  document.querySelectorAll('.claim').forEach((el,i) => {
    if (i < 2) return; // skip scenario label and question
  });
  const claims = document.querySelectorAll('.claim');
  claims.forEach((el,i) => {
    const c = rd.claims[i];
    el.classList.remove('selected');
    el.classList.add(c.truth ? 'revealed-true' : 'revealed-false');
    el.onclick = null;
    if (!c.truth && userSelections.has(i)) correct++;
  });

  const allFakes = rd.claims.reduce((acc,c,i) => !c.truth ? acc.concat(i) : acc, []);
  const falsePositives = [...userSelections].filter(i => rd.claims[i].truth).length;
  document.getElementById('fakeStat').textContent = fakeCount;

  let msg, bg, color;
  if (correct === fakeCount && falsePositives === 0) {
    msg = '만점! 모든 조작 내용을 정확히 찾아냈습니다';
    bg = 'rgba(22,163,74,.1)'; color = 'var(--green)';
  } else if (correct === fakeCount) {
    msg = `모든 조작 항목을 찾았지만 실제 내용 ${falsePositives}개를 잘못 표시했습니다`;
    bg = 'rgba(217,119,6,.1)'; color = 'var(--amber)';
  } else if (correct > 0) {
    msg = `${correct}/${fakeCount}개의 조작 항목을 찾았으며 일부를 놓쳤습니다`;
    bg = 'rgba(217,119,6,.1)'; color = 'var(--amber)';
  } else {
    msg = '조작 내용을 찾지 못했습니다 — 환각은 정말 발견하기 어렵습니다';
    bg = 'rgba(220,38,38,.1)'; color = 'var(--red)';
  }
  const badge = document.getElementById('scoreBadge');
  badge.textContent = msg; badge.style.background = bg; badge.style.color = color;
  document.getElementById('revealBtn').disabled = true;

  document.getElementById('lessonBox').style.display = 'block';
  document.getElementById('lessonBox').innerHTML = rd.lesson;
  const pl = document.getElementById('patternList');
  pl.style.display = 'flex';
  pl.innerHTML = '<div style="font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.4px">AI 조작의 일반적인 패턴</div>' +
    rd.patterns.map(p => `<div class="pattern-item"><div class="pattern-icon" style="background:${p.bg};color:${p.color}">${p.icon}</div><span>${p.text}</span></div>`).join('');
}

const tabs = document.getElementById('roundTabs');
ROUNDS.forEach((r,i) => {
  const btn = document.createElement('button');
  btn.className = 'round-tab' + (i===0?' active':'');
  btn.textContent = '문제 ' + (i + 1);
  btn.onclick = () => renderRound(i);
  tabs.appendChild(btn);
});
renderRound(0);
</script>
