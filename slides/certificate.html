<style>
:root{
  --accent:#4f7bff;
  --accent-hover:#3d6bff;
}
:root,[data-theme="light"]{
  --bg:#f4f4f6;
  --panel:#ffffff;
  --border:rgba(0,0,0,0.07);
  --text-m:#111827;
  --text-sub:#4b5563;
  --text-faint:#9ca3af;
}
[data-theme="dark"]{
  --bg:#0d0d14;
  --panel:#16161f;
  --border:rgba(255,255,255,0.09);
  --text-m:#f3f4f6;
  --text-sub:#9ca3af;
  --text-faint:#6b7280;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text-m);
  font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:32px 16px 64px;
}
.top-nav{
  width:100%;
  max-width:960px;
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:28px;
}
.top-nav a{
  color:var(--text-sub);
  text-decoration:none;
  font-size:14px;
  display:inline-flex;
  align-items:center;
  gap:6px;
}
.top-nav a:hover{color:var(--accent);}
.stage{
  width:100%;
  max-width:960px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:16px;
}
.state-card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:16px;
  padding:48px 36px;
  max-width:560px;
  width:100%;
  text-align:center;
}
.state-card h1{font-size:22px;margin-bottom:12px;}
.state-card p{color:var(--text-sub);font-size:14px;line-height:1.8;}
.prog-line{
  margin:24px auto 8px;
  max-width:360px;
  height:8px;
  border-radius:4px;
  background:rgba(127,127,127,0.18);
  overflow:hidden;
}
.prog-line i{
  display:block;
  height:100%;
  background:linear-gradient(90deg,var(--accent),#a78bfa);
  border-radius:4px;
  transition:width .4s;
}
.prog-num{font-size:13px;color:var(--text-faint);margin-bottom:24px;}
.btn{
  display:inline-flex;
  align-items:center;
  gap:8px;
  border:none;
  cursor:pointer;
  border-radius:10px;
  padding:12px 24px;
  font-size:14px;
  font-weight:600;
  text-decoration:none;
  transition:all .15s;
}
.btn-primary{
  background:var(--accent);
  color:#fff;
}
.btn-primary:hover{background:var(--accent-hover);transform:translateY(-1px);}
.btn-primary:disabled{opacity:.6;cursor:default;transform:none;}
.btn-gold{
  background:linear-gradient(135deg,#5b7fff,#4f46e5);
  color:#fff;
  padding:13px 28px;
  font-size:15px;
  box-shadow:0 6px 24px rgba(79,123,255,0.35);
}
.btn-gold:hover{filter:brightness(1.08);transform:translateY(-1px);}
.btn-ghost{
  background:transparent;
  color:var(--text-sub);
  border:1px solid var(--border);
}
.btn-ghost:hover{color:var(--accent);border-color:var(--accent);}
.cert-wrap{
  width:100%;
  border:1px solid #e0e4ec;
  box-shadow:0 8px 32px rgba(0,0,0,0.10),0 2px 8px rgba(0,0,0,0.06);
  line-height:0;
  background:#fff;
}
#certCanvas{width:100%;height:auto;display:block;}
.action-bar{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:12px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:14px;
  padding:14px 18px;
}
.action-links{display:flex;gap:16px;font-size:12px;}
.action-links a{color:var(--text-faint);text-decoration:none;}
.action-links a:hover{color:var(--accent);}
.name-note{
  font-size:12.5px;
  color:var(--text-faint);
  line-height:1.8;
  text-align:center;
}
.name-note a{color:var(--accent);text-decoration:none;}
.name-note a:hover{text-decoration:underline;}
.hidden{display:none !important;}

<body>

<div class="top-nav">

<div class="stage">

  <!-- 加载中 -->
  <div class="state-card" id="stLoading">
    <h1>正在查询证书状态…</h1>
    <p>稍等一下</p>
  </div>

  <!-- 未登录 -->
  <div class="state-card hidden" id="stLogin">
    <h1>登录后查看结业证书</h1>
    <p>结业证书记录在你的米羊账号下，请先用米羊账号登录。</p>
    <div style="margin-top:28px;">
      <a class="btn btn-primary" href="/auth/login?next=%2Fslides%2Fcertificate.html">用米羊账号登录</a>
    </div>
  </div>

  <!-- 未学完 -->
  <div class="state-card hidden" id="stIncomplete">
    <h1>还差一点点！</h1>
    <p>学完《学 AI 产品，从入门到精通》全部课程，即可领取专属结业证书。<br>每节课点「学会了！」就算学完这一节。</p>
    <div class="prog-line"><i id="progFill"></i></div>
    <div class="prog-num" id="progNum"></div>
    <a class="btn btn-primary" href="learn.html">继续学习</a>
  </div>

  <!-- 可领取 -->
  <div class="state-card hidden" id="stClaim">
    <h1>🎓 恭喜你学完了全部课程！</h1>
    <p>全部 <b id="claimTotal"></b> 节课都已完成。<br>现在就领取你的结业证书吧，证书会同步到你的米羊账号。</p>
    <div style="margin-top:28px;">
      <button class="btn btn-gold" id="claimBtn">领取结业证书</button>
    </div>
  </div>

  <!-- 证书展示 -->
  <div class="hidden" id="stCert" style="width:100%;display:flex;flex-direction:column;align-items:center;gap:16px;">
    <div class="cert-wrap">
      <canvas id="certCanvas" width="3200" height="2260"></canvas>
    </div>
    <div class="action-bar">
      <button class="btn btn-primary" id="dlBtn" style="padding:9px 18px;font-size:13px;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        下载 PNG
      </button>
      <div class="action-links">
        <span id="certSeqWrap" style="color:var(--text-faint);" hidden>这是全球第 <b id="certSeqTxt" style="color:#a97b1f;"></b> 张结业证书</span>
        <span style="color:var(--text-faint);">证书编号 <b id="certNoTxt" style="color:var(--text-sub);"></b></span>
        <a href="https://miyang.cn/profile/ai-learn" target="_blank" rel="noopener">→ 在米羊账号中查看</a>
      </div>
    </div>
    <div class="name-note">
      证书上的姓名取自你的米羊账号昵称。需要改名请
      <a href="https://miyang.cn/profile" target="_blank" rel="noopener">前往米羊修改昵称</a>，
      几分钟后回到本页刷新即可生效。
    </div>
  </div>

</div>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var states = ['stLoading','stLogin','stIncomplete','stClaim','stCert'];
  function show(id){
    states.forEach(function(s){ $(s).classList.toggle('hidden', s !== id); });
    if(id === 'stCert') $('stCert').style.display = 'flex';
  }

  var CERT = null;
  var ACCENT = '#4f7bff';
  var INDIGO = '#6366f1';

  /* 米羊科技官方组合标（透明底 PNG，1400×322），加载完成后重绘补上 */
  var MARK = new Image();
  MARK.src = 'assets/miyang-logo.png';
  MARK.onload = function(){ if(CERT) drawCert(CERT); };

  function fmtDateEn(ts){
    return new Date(ts * 1000).toLocaleDateString('en-US', {day:'numeric', month:'short', year:'numeric'});
  }

  /* ── 证书绘制：与 XSCT 数字证书同一套版式语言 ──
     canvas 单一渲染路径，页面展示与下载的 PNG 完全一致。
     逻辑坐标系 1600×1130（与 XSCT cert-container 等比），2x 输出。 */

  /* layers 图标（同 XSCT logo），(x,y) 为图标左上角，s 为 24 栅格的缩放 */
  function drawLayers(ctx, x, y, s, color, lw){
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s/24, s/24);
    ctx.strokeStyle = color;
    ctx.lineWidth = lw * 24 / s;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(12,2); ctx.lineTo(2,7); ctx.lineTo(12,12); ctx.lineTo(22,7); ctx.closePath();
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(2,17); ctx.lineTo(12,22); ctx.lineTo(22,17);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(2,12); ctx.lineTo(12,17); ctx.lineTo(22,12);
    ctx.stroke();
    ctx.restore();
  }

  function hexA(hex, a){
    var r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
  }

  function drawCert(cert){
    var cv = $('certCanvas');
    var ctx = cv.getContext('2d');
    ctx.setTransform(2, 0, 0, 2, 0, 0);
    var W = 1600, H = 1130;
    var SANS = '-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif';

    /* 白底 */
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, W, H);

    /* 斜线格底纹（±45°） */
    ctx.strokeStyle = hexA(ACCENT, 0.07);
    ctx.lineWidth = 1.8;
    var gap = 39;
    ctx.save();
    ctx.beginPath();
    for(var d = -H; d < W + H; d += gap){
      ctx.moveTo(d, 0); ctx.lineTo(d + H, H);       /* 45° */
      ctx.moveTo(d + H, 0); ctx.lineTo(d, H);       /* -45° */
    }
    ctx.stroke();
    ctx.restore();

    /* 中心光晕：让中部文字区干净 */
    var glow = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, W*0.55);
    glow.addColorStop(0, 'rgba(255,255,255,0.96)');
    glow.addColorStop(0.45, 'rgba(255,255,255,0.75)');
    glow.addColorStop(1, 'rgba(255,255,255,0.1)');
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, W, H);

    /* 内框线 */
    ctx.strokeStyle = hexA(ACCENT, 0.35);
    ctx.lineWidth = 1.5;
    ctx.strokeRect(32, 24, W-64, H-48);

    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';

    /* 顶部品牌视觉：米羊科技官方组合标（M 标 + 米羊科技 / Miyang.AI） */
    if(MARK.complete && MARK.naturalWidth){
      var logoH = 44, logoW = logoH * MARK.naturalWidth / MARK.naturalHeight;
      ctx.drawImage(MARK, W/2 - logoW/2, 80, logoW, logoH);
    }

    /* 主体：与 XSCT 证书同构，纯英文 */
    ctx.fillStyle = '#6b7280';
    ctx.font = '400 21px ' + SANS;
    ctx.fillText('This acknowledges that', W/2, 310);

    var name = cert.nick || 'Miyang User';
    var hasCJK = /[\u4e00-\u9fff]/.test(name);
    var nameFont = hasCJK
      ? '700 ' + (name.length > 10 ? 54 : 68) + 'px "Songti SC","STSong",serif'
      : '700 ' + (name.length > 16 ? 56 : 71) + 'px "Playfair Display",serif';
    ctx.fillStyle = '#111827';
    ctx.font = nameFont;
    ctx.fillText(name, W/2, 402);

    ctx.fillStyle = '#6b7280';
    ctx.font = '400 21px ' + SANS;
    ctx.fillText('has successfully completed all ' + cert.total + ' lessons of', W/2, 468);

    ctx.fillStyle = '#111827';
    ctx.font = '700 52px ' + SANS;
    ctx.fillText('AI from Fundamentals to Mastery', W/2, 556);

    /* 药丸徽章：COMPLETED（金色，同 XSCT 高等级徽章配色） */
    var badgeTxt = 'C O M P L E T E D';
    ctx.font = '700 20px ' + SANS;
    var btw = ctx.measureText(badgeTxt).width;
    var bw = btw + 52, bh = 44, bx = W/2 - bw/2, by = 606;
    var bg = ctx.createLinearGradient(bx, by, bx + bw, by + bh);
    bg.addColorStop(0, '#fef3c7');
    bg.addColorStop(1, '#fde68a');
    ctx.fillStyle = bg;
    ctx.strokeStyle = '#d97706';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.roundRect(bx, by, bw, bh, bh/2);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#92400e';
    ctx.fillText(badgeTxt, W/2, by + 29);

    /* 页脚分隔线 */
    ctx.strokeStyle = hexA(ACCENT, 0.12);
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(112, 852);
    ctx.lineTo(W - 112, 852);
    ctx.stroke();

    /* 左：元数据 */
    /* Series ID 用全球序号（第几张）；老证书没有 seq 时回退编号后缀 */
    var metaRows = [
      ['Series ID:', cert.seq ? 'No. ' + cert.seq : cert.no.split('-').pop()],
      ['Issue Date:', fmtDateEn(cert.ts)],
      ['Expiration Date:', 'Permanent'],
      ['Certification ID:', cert.no],
      ['Certified As:', name],
    ];
    ctx.textAlign = 'left';
    var my = 906, step = 33;
    metaRows.forEach(function(row){
      ctx.fillStyle = '#9ca3af';
      ctx.font = '400 19px ' + SANS;
      ctx.fillText(row[0], 112, my);
      ctx.fillStyle = '#374151';
      ctx.font = '500 19px ' + SANS;
      ctx.fillText(row[1], 292, my);
      my += step;
    });

    /* 中：签名（Caveat 手写体 + 中文名 + 头衔） */
    ctx.textAlign = 'center';
    ctx.fillStyle = '#111827';
    ctx.font = '600 56px Caveat,cursive';
    var sig = 'Luo Xiaoshan';
    ctx.fillText(sig, W/2, 980);
    var sw = ctx.measureText(sig).width;
    ctx.strokeStyle = '#d1d5db';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(W/2 - sw/2 - 14, 996);
    ctx.lineTo(W/2 + sw/2 + 14, 996);
    ctx.stroke();
    ctx.fillStyle = '#374151';
    ctx.font = '600 21px ' + SANS;
    ctx.fillText('Luo Xiaoshan', W/2, 1030);
    ctx.fillStyle = '#9ca3af';
    ctx.font = '400 17px ' + SANS;
    ctx.fillText('Instructor, Xiaoshan Academy', W/2, 1058);

    /* 右：圆形徽章印 */
    drawSeal(ctx, W - 216, 972, 96, SANS);
  }

  /* 圆形徽章：浅底 + 蓝外环 + 金内环 + 环绕文字 + 中心 layers 图标 */
  function drawSeal(ctx, cx, cy, r, SANS){
    ctx.save();

    var base = ctx.createRadialGradient(cx, cy, r*0.4, cx, cy, r);
    base.addColorStop(0, '#f9fafb');
    base.addColorStop(1, '#ffffff');
    ctx.fillStyle = base;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#e5e7eb';
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.strokeStyle = hexA(ACCENT, 0.6);
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(cx, cy, r - 6, 0, Math.PI*2);
    ctx.stroke();

    ctx.strokeStyle = 'rgba(245,158,11,0.7)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(cx, cy, r - 15, 0, Math.PI*2);
    ctx.stroke();

    /* 环绕文字 */
    ctx.fillStyle = '#312e81';
    ctx.font = '700 15px ' + SANS;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    function arcText(text, a0, a1, radius, flip){
      var chars = text.split('');
      chars.forEach(function(ch, i){
        var t = chars.length === 1 ? 0.5 : i/(chars.length-1);
        var a = a0 + (a1 - a0) * t;
        ctx.save();
        ctx.translate(cx + Math.cos(a)*radius, cy + Math.sin(a)*radius);
        ctx.rotate(a + (flip ? -Math.PI/2 : Math.PI/2));
        ctx.fillText(ch, 0, 0);
        ctx.restore();
      });
    }
    arcText('X U E A I . A P P', -Math.PI/2 - 1.05, -Math.PI/2 + 1.05, r - 30, false);
    arcText('· C E R T I F I E D ·', Math.PI/2 + 0.95, Math.PI/2 - 0.95, r - 30, true);

    /* 中心图标 */
    drawLayers(ctx, cx - 26, cy - 26, 52, ACCENT, 2.4);

    ctx.restore();
    ctx.textBaseline = 'alphabetic';
  }

  function renderCert(cert){
    CERT = cert;
    $('certNoTxt').textContent = cert.no;
    if(cert.seq){
      $('certSeqTxt').textContent = cert.seq;
      $('certSeqWrap').hidden = false;
    }
    show('stCert');
    var doDraw = function(){ drawCert(cert); };
    doDraw();  /* 先画一遍防白屏，字体到位后重画 */
    if(document.fonts && document.fonts.load){
      Promise.all([
        document.fonts.load('600 56px Caveat'),
        document.fonts.load('700 71px "Playfair Display"'),
      ]).then(doDraw).catch(doDraw);
      document.fonts.ready.then(doDraw);
    }
  }

  $('dlBtn').addEventListener('click', function(){
    if(!CERT) return;
    $('certCanvas').toBlob(function(blob){
      if(!blob) return;
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'xueai-certificate-' + CERT.no + '.png';
      document.body.appendChild(a);
      a.click();
      setTimeout(function(){
        URL.revokeObjectURL(a.href);
        a.remove();
      }, 1000);
    }, 'image/png');
  });

  $('claimBtn').addEventListener('click', function(){
    var btn = $('claimBtn');
    btn.disabled = true;
    btn.textContent = '正在领取…';
    fetch('/auth/certificate/claim', {method:'POST', credentials:'same-origin'})
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(d && d.ok && d.cert){
          renderCert(d.cert);
        }else{
          btn.disabled = false;
          btn.textContent = '领取结业证书';
          alert((d && d.error === 'course not completed')
            ? '还有课程未学完（' + d.done + '/' + d.total + '），学完后再来领取。'
            : '领取失败，请稍后重试。');
        }
      })
      .catch(function(){
        btn.disabled = false;
        btn.textContent = '领取结业证书';
        alert('网络异常，请稍后重试。');
      });
  });

  fetch('/auth/certificate', {credentials:'same-origin'})
    .then(function(r){
      if(r.status === 401){ show('stLogin'); return null; }
      return r.json();
    })
    .then(function(d){
      if(!d) return;
      if(!d.ok){ show('stLogin'); return; }
      if(d.cert){
        renderCert(d.cert);
      }else if(d.eligible || (d.total > 0 && d.done >= d.total)){
        /* eligible 是服务端的资格闩：达成过 100% 就永久可领，
           课程后来扩容也不影响；数字用达成时的课程总数 */
        $('claimTotal').textContent = d.eligible_total || d.total;
        show('stClaim');
      }else{
        $('progFill').style.width = (d.percent || 0) + '%';
        $('progNum').textContent = '已学 ' + d.done + ' / ' + d.total + ' 节 · ' + (d.percent || 0) + '%';
        show('stIncomplete');
      }
    })
    .catch(function(){ show('stLogin'); });
})();
</script>
