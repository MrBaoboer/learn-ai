<style>
:root{--green:var(--success);--orange:var(--amber);--red:var(--danger);--muted:var(--sub);--surface:var(--card);--surface2:rgba(0,0,0,.04)}

/* 护栏列表 */
.g-list{display:flex;flex-direction:column;gap:6px}
.g-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;cursor:pointer;transition:all .2s;border:1.5px solid var(--border);background:var(--card);min-height:44px}
.g-item:hover{background:rgba(217,119,6,.03);border-color:rgba(217,119,6,.2)}
.g-item.active{background:rgba(217,119,6,.06);border-color:var(--orange)}
.g-item-num{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:var(--muted);background:var(--surface2);flex-shrink:0;transition:all .2s}
.g-item.active .g-item-num{background:var(--orange);color:white}
.g-item-info{flex:1;min-width:0}
.g-item-name{font-size:15px;font-weight:700;color:var(--text);margin-bottom:2px}
.g-item-desc{font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-item-val{font-size:12px;font-weight:700;color:var(--muted);background:var(--surface2);padding:2px 8px;border-radius:4px;flex-shrink:0;font-family:'SF Mono','Fira Code',monospace}
.g-item.active .g-item-val{background:rgba(217,119,6,.1);color:var(--orange)}

/* 详情区 */
.detail-wrap{display:grid;grid-template-columns:300px 1fr;gap:18px;align-items:start}
.right-col{min-width:0}
.r-bar{padding:10px 16px;border:1.5px solid var(--border);border-radius:10px;display:flex;align-items:center;gap:12px;background:var(--card);margin-bottom:12px;flex-wrap:wrap}
.r-bar-name{font-size:16px;font-weight:800;color:var(--text)}
.r-hint{margin-left:auto;font-size:13px;color:var(--muted)}
.detail-area{display:flex;flex-direction:column;gap:14px}

.d-section{border:1.5px solid var(--border);border-radius:12px;background:var(--card);overflow:hidden;opacity:0;transform:translateY(8px);animation:fadeUp .35s ease forwards}
@keyframes fadeUp{to{opacity:1;transform:translateY(0)}}
.d-head{padding:10px 16px;font-size:14px;font-weight:700;color:var(--text);border-bottom:1px solid var(--border);background:rgba(0,0,0,.015);display:flex;align-items:center;gap:8px}
.d-body{padding:12px 16px;font-size:14px;line-height:1.7;color:var(--text)}

/* 场景对比 */
.d-compare{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px 16px}
.d-cmp{border-radius:10px;padding:14px 16px;font-size:14px;line-height:1.65}
.d-cmp-bad{background:rgba(220,38,38,.04);border:1.5px solid rgba(220,38,38,.15)}
.d-cmp-good{background:rgba(22,163,74,.04);border:1.5px solid rgba(22,163,74,.15)}
.d-cmp-label{font-size:13px;font-weight:800;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.d-cmp-bad .d-cmp-label{color:var(--red)}
.d-cmp-good .d-cmp-label{color:var(--green)}
.d-cmp-text{color:var(--text)}

/* 设计决策 */
.d-decision{background:rgba(217,119,6,.05);border:1.5px solid rgba(217,119,6,.18);border-radius:10px;padding:12px 16px;font-size:14px;color:var(--text);line-height:1.6}
.d-decision b{color:var(--orange)}

/* 空状态 */
.empty{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:var(--muted);font-size:15px;padding:60px 20px;border:1.5px dashed var(--border);border-radius:12px}
.empty-arrow{font-size:24px}

@media (max-width:768px){
  .detail-wrap{grid-template-columns:1fr}
  .d-compare{grid-template-columns:1fr}
}
</style>

    <p class="subtitle">沒有護欄的 Agent = 沒有剎車的跑車。點選左側每道護欄，查看場景還原與有無護欄的對比。</p>
  </header><!--seo:begin--><aside class="xa-tldr"><span class="xa-tldr-tag">一句話速覽</span><p>迭代上限、輸出截斷、超時控制、中斷恢復、上下文急救</p></aside><!--seo:end-->  <div class="detail-wrap paywall-locked xa-peek">
    <div>
      <div class="sec-label" style="margin-top:0">點選查看每道護欄</div>

        <span class="r-bar-name" id="rName">選擇一道護欄</span>
        <span class="r-hint" id="rHint">← 點選左邊任意一項</span>
      </div>

  <div class="sec-label paywall-locked">Takeaway</div>
  <div class="l-callout paywall-locked">
    <b>Takeaway</b>　Agent 的核心能力來自 LLM，但穩定性來自工程護欄。這 5 道防線決定了你的 Agent 是「能用」還是「好用」：迭代上限防死迴圈、輸出截斷防撐爆、超時控制防卡死、中斷恢復防損壞、上下文急救防崩潰。
  </div>
</article>

<script>
var GUARDS = [
  {
    name: '迭代上限', val: '50 輪', desc: '防止無限 ReAct 迴圈',
    scenario: '使用者讓 Agent 刪除專案中所有 console.log 並跑測試。Agent 進入 ReAct 迴圈：搜尋→編輯→測試→發現新問題→再搜尋…',
    bad: 'Agent 陷入「修了 A 壞了 B，修了 B 壞了 C」的迴圈，反覆呼叫同一工具數百次。一次任務消耗 10 萬 Token（約 ¥0.6），使用者等了 5 分鐘還沒結束，只能強制關閉。',
    good: '到第 50 輪自動停止，返回已完成的部分：「已處理 12 個檔案中的 47 個 console.log，但有 2 個測試仍未透過。是否繼續？」使用者可以選擇繼續或手動處理。',
    decision: '<b>📌 設計決策：</b>50 輪是實踐中的平衡點：能覆蓋 95% 的複雜任務，又不會讓單次任務失控。你的產品要根據場景調整：客服 Bot 可能只需 10 輪，程式碼助手可能需要 80 輪。'
  },
  {
    name: '輸出截斷', val: '20 萬字', desc: '防止單個工具吃滿上下文',
    scenario: 'Agent 需要分析一個日誌檔案，呼叫 read_file 讀取了一個 5MB 的 error.log。',
    bad: '5MB 文字 ≈ 500 萬字元 ≈ 250 萬 Token。直接塞進上下文後，128K 的視窗瞬間爆滿，後續對話全部報錯 context_length_exceeded。整個會話作廢。',
    good: '輸出被截斷到 20 萬字元（保留頭尾各 10 萬字），並附註「[已截斷，原文 500 萬字元]」。Agent 看到足夠多的資訊來分析問題，上下文還有大量空間繼續工作。',
    decision: '<b>📌 設計決策：</b>截斷是在保護工作空間，資料沒有丟。類比：你不會把整個圖書館搬到辦公桌上，你只拿需要的那幾本。產品可以配置截斷策略：保留頭尾、保留關鍵行、或先摘要再截斷。'
  },
  {
    name: '超時控制', val: '5s + 重試', desc: '防止卡死的呼叫阻塞全域',
    scenario: 'Agent 呼叫外部天氣 API，但該 API 伺服器今天響應特別慢。',
    bad: 'Agent 發出請求後無限等待。使用者看到「思考中…」轉了 60 秒還沒反應。整個會話被一個掛起的 HTTP 請求阻塞，其他工具也無法執行。',
    good: '5 秒後超時，自動重試一次。仍然超時後，返回錯誤給模型：「天氣 API 超時，請換一種方式獲取資訊。」模型自動切換到 web_search 工具搜尋天氣。總耗時 12 秒，任務完成。',
    decision: '<b>📌 設計決策：</b>外部 API 不可靠是常態，不是例外。「5 秒超時 + 2 次重試」的總等待是 15 秒，遠優於「60 秒超時 + 不重試」。更重要的是，超時後把控制權交回模型，讓它自己想備選方案。'
  },
  {
    name: '中斷恢復', val: 'AbortSignal', desc: '使用者隨時可以按停止',
    scenario: 'Agent 正在批次編輯 20 個檔案，已經改了 8 個。使用者發現方向不對，按下「停止」按鈕。',
    bad: '中斷後，訊息列表裡有 8 個 tool_call 但只有 5 個 tool_result（3 個正在執行的被殺掉了）。訊息格式不合法，下次發給模型 API 直接返回 400 錯誤。整個會話報廢，使用者被迫新建對話。',
    good: '中斷訊號透過 AbortSignal 逐層傳播：正在執行的 3 個工具被安全終止，框架自動為它們補充 "[Interrupted by user]" 結果。訊息格式完整，使用者可以繼續對話：「好，不改了，幫我把改過的 8 個檔案恢復。」',
    decision: '<b>📌 設計決策：</b>「停止」是使用者最高頻的操作之一。框架必須保證：中斷後訊息鏈完整（每個 tool_call 都有對應的 tool result），否則後續所有對話都會報錯。這是工程細節，但影響巨大。'
  },
  {
    name: '上下文急救', val: '緊急壓縮', desc: '最後一道防線',
    scenario: '經過 30 輪深度對話，上下文已經 95% 滿了。四層常規壓縮（裁剪/微壓縮/摺疊/自動壓縮）都已觸發。模型再調一次工具，API 返回 context_length_exceeded。',
    bad: '會話直接崩潰，彈出使用者看不懂的錯誤資訊「Error: context_length_exceeded」。30 輪對話的所有進度丟失，使用者只能從頭開始。',
    good: '框架捕獲錯誤，觸發緊急壓縮：丟棄所有中間輪次的工具原始輸出，只保留關鍵結論和最近 3 輪對話。上下文佔用從 95% 降到 40%，會話繼續存活。可能丟失一些歷史細節，但遠好於全部丟失。',
    decision: '<b>📌 設計決策：</b>這是最後的防線：前 4 層壓縮全部失敗後的兜底方案。設計原則：<b>殘缺的記憶好過完全失憶</b>。保留最近的對話和關鍵結論，犧牲中間過程的細節。'
  }
];

var activeIdx = -1;
var listEl = document.getElementById('gList');

function renderList() {
  listEl.innerHTML = '';
  GUARDS.forEach(function(g, i) {
    var el = document.createElement('div');
    el.className = 'g-item' + (i === activeIdx ? ' active' : '');
    el.innerHTML =
      '<div class="g-item-num">' + (i + 1) + '</div>' +
      '<div class="g-item-info">' +
        '<div class="g-item-name">' + g.name + '</div>' +
        '<div class="g-item-desc">' + g.desc + '</div>' +
      '</div>' +
      '<span class="g-item-val">' + g.val + '</span>';
    el.onclick = function() { selectGuard(i); };
    listEl.appendChild(el);
  });
}

function selectGuard(i) {
  activeIdx = i;
  renderList();
  var g = GUARDS[i];
  document.getElementById('rName').textContent = '護欄 ' + (i + 1) + '：' + g.name;
  document.getElementById('rHint').textContent = g.val;
  var da = document.getElementById('detailArea');
  da.innerHTML =
    '<div class="d-section" style="animation-delay:0s">' +
      '<div class="d-head">場景還原</div>' +
      '<div class="d-body">' + g.scenario + '</div>' +
    '</div>' +
    '<div class="d-section" style="animation-delay:.1s">' +
      '<div class="d-head">對比：有護欄 vs 沒有護欄</div>' +
      '<div class="d-compare">' +
        '<div class="d-cmp d-cmp-bad">' +
          '<div class="d-cmp-label">沒有這道護欄</div>' +
          '<div class="d-cmp-text">' + g.bad + '</div>' +
        '</div>' +
        '<div class="d-cmp d-cmp-good">' +
          '<div class="d-cmp-label">有這道護欄</div>' +
          '<div class="d-cmp-text">' + g.good + '</div>' +
        '</div>' +
      '</div>' +
    '</div>' +
    '<div class="d-decision d-section" style="animation-delay:.2s">' + g.decision + '</div>';
  setTimeout(function() {
    document.getElementById('rBar').scrollIntoView({behavior:'smooth', block:'nearest'});
  }, 60);
}

renderList();
</script>
