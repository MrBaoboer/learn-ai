<style>
.desc{font-size:16px;color:var(--sub);line-height:1.8}

.strat-list{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:12px}
.strat-btn{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:12px;border:1.5px solid var(--border);background:var(--card);cursor:pointer;transition:all .2s;font-family:inherit;text-align:left;width:100%;min-height:44px}
.strat-btn:hover{border-color:rgba(0,0,0,.15)}
.strat-btn.active{box-shadow:0 2px 12px rgba(0,0,0,.08)}
.strat-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.sb{flex:1;min-width:0}
.sb h4{font-size:16px;font-weight:800;color:var(--text);margin-bottom:2px}
.sb p{font-size:13px;color:var(--sub)}
.strat-verdict{font-size:12px;font-weight:800;padding:3px 9px;border-radius:5px;flex-shrink:0}

/* pros/cons */
.pros-box{display:flex;flex-direction:column;gap:6px;margin-top:16px}
.pros-title{font-size:13px;font-weight:800;color:var(--sub);letter-spacing:.4px;text-transform:uppercase}
.pros-items{display:flex;flex-direction:column;gap:5px}
.pi{display:flex;gap:8px;align-items:flex-start;font-size:15px;line-height:1.6;padding:4px 0}
.pi.pro{color:var(--success)}.pi.con{color:var(--danger)}
.pi-icon{flex-shrink:0;margin-top:1px;font-size:15px}

.scene-box{background:rgba(0,102,255,.05);border:1px solid rgba(0,102,255,.15);border-radius:10px;padding:12px 15px;font-size:15px;color:var(--text);line-height:1.7;margin-top:14px}
.scene-box b{color:var(--accent)}

/* 演示区 */
.demo-hd{font-size:13px;font-weight:800;color:var(--sub);letter-spacing:.4px;text-transform:uppercase;margin-bottom:10px}

.vis-wrap{background:var(--card);border:1.5px solid var(--border);border-radius:14px;display:flex;flex-direction:column;overflow:hidden}
.vis-bar{padding:10px 16px;border-bottom:1px solid var(--border);background:rgba(0,0,0,0.02);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.vis-bar-title{font-size:14px;font-weight:700;color:var(--sub)}
.vis-body{min-height:280px;max-height:420px;padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}

/* 消息气泡 */
.msg{padding:10px 14px;border-radius:10px;font-size:15px;line-height:1.6;opacity:0;transform:translateY(8px);transition:all .35s ease;flex-shrink:0}
.msg.show{opacity:1;transform:translateY(0)}
.msg.sys{background:rgba(91,79,207,.1);color:#5b4fcf;font-weight:600}
.msg.user{background:rgba(8,145,178,.1);color:var(--cyan)}
.msg.ai{background:rgba(22,163,74,.1);color:var(--success)}
.msg.summary{background:rgba(215,119,6,.1);color:var(--amber);font-weight:600}
.msg.dropped{background:rgba(0,0,0,0.05);color:var(--sub);text-decoration:line-through;opacity:0}
.msg.dropped.show{opacity:.4}
.msg.rag{background:rgba(91,79,207,.08);color:#5b4fcf}
.msg.warning{background:rgba(220,38,38,.07);color:var(--danger);font-size:14px;font-weight:600;border-radius:8px}
.msg.ok{background:rgba(22,163,74,.07);color:var(--success);font-size:14px;font-weight:600;border-radius:8px}

.ctrl-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.btn{padding:11px 22px;border-radius:9px;font-size:15px;font-weight:700;border:none;cursor:pointer;font-family:inherit;transition:all .2s;min-height:44px}
.btn-p{background:var(--amber);color:white}
.btn-p:hover{filter:brightness(1.1)}
.btn-p:disabled{opacity:.35;cursor:not-allowed}
.btn-r{background:rgba(0,0,0,0.05);color:var(--sub);border:1px solid var(--border)}
.hint{font-size:13px;color:var(--sub)}

@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.05)}100%{transform:scale(1)}}

@media (max-width:768px){
  .strat-list{grid-template-columns:1fr}
}

<article class="lesson">
  <header class="lesson-header">
    <div class="kicker">上下文工程</div>

    <p class="subtitle">模塊五 · 上下文工程 · 第 2 頁。點擊策略，下方逐步演示效果。</p>
  </header><!--seo:begin--><aside class="xa-tldr"><span class="xa-tldr-tag">一句話速覽</span><p>直接截斷 / 摘要壓縮 / 選擇性保留，可視化對比每種策略的利弊</p></aside><!--seo:end-->  <section>
    <div class="sec-label">三種主流策略</div>
    <p class="desc">對話越來越長超出窗口時，工程上有三種主流處理方式，各有利弊。</p>

    <div class="strat-list">
      <button class="strat-btn active" onclick="pickStrat(this,0)" id="sb0">
        <div class="strat-icon" style="background:rgba(220,38,38,.1)">✂️</div>
        <div class="sb"><h4>直接截斷</h4><p>丟掉最早的對話輪次</p></div>
        <span class="strat-verdict" style="background:rgba(220,38,38,.1);color:var(--danger)">簡單粗暴</span>
      </button>
      <button class="strat-btn" onclick="pickStrat(this,1)" id="sb1">
        <div class="strat-icon" style="background:rgba(215,119,6,.1)">📝</div>
        <div class="sb"><h4>摘要壓縮</h4><p>歷史先總結再存，保留要點</p></div>
        <span class="strat-verdict" style="background:rgba(215,119,6,.1);color:var(--amber)">平衡之選</span>
      </button>
      <button class="strat-btn" onclick="pickStrat(this,2)" id="sb2">
        <div class="strat-icon" style="background:rgba(91,79,207,.1)">🎯</div>
        <div class="sb"><h4>選擇性保留</h4><p>語義檢索，只注入相關歷史</p></div>
        <span class="strat-verdict" style="background:rgba(91,79,207,.1);color:var(--purple)">最精準</span>
      </button>
    </div>

    <div class="pros-box">
      <div class="pros-title" id="prosTitle">優缺點分析</div>
      <div class="pros-items" id="prosItems"></div>
    </div>

    <div class="scene-box" id="sceneBox"></div>
  </section>

  <section>
    <div class="sec-label">交互演示</div>
    <div class="demo-hd" id="demoHd">演示：直接截斷效果</div>
    <div class="vis-wrap">
      <div class="vis-bar">
        <span class="vis-bar-title" id="visTitle">用戶在第 1 輪説了自己的名字…</span>
        <span style="font-size:13px;color:var(--sub)" id="stepHint"></span>
      </div>
      <div class="vis-body" id="visBody"></div>
    </div>
    <div class="ctrl-row">
      <button class="btn btn-r" onclick="startPlay()">↺ 重播</button>
      <span class="hint" id="ctrlHint"></span>
    </div>
  </section>

<script>
const STRATS = [
  {
    color: 'var(--danger)',
    demoHd: '演示：直接截斷的代價',
    pros: [
      {text:'實現簡單，零額外成本', pro:true},
      {text:'適合短對話、單次任務場景', pro:true},
      {text:'早期資訊完全丟失，對話不連貫', pro:false},
      {text:'可能截掉第 1 輪説的重要資訊', pro:false},
    ],
    scene: '<b>適用：</b>查天氣/翻譯等單次工具型對話，對話歷史不重要的場景。',
    steps: [
      { cls:'user', text:'第 1 輪 用戶：你好，我叫小明，在上海工作，想學 Python', title:'用戶第 1 輪説了名字…' },
      { cls:'ai',   text:'第 1 輪 AI：你好小明！Python 很適合入門，推薦從基礎語法開始。', title:'AI 正常回覆…' },
      { cls:'user', text:'第 2 輪 用戶：上海有好的綫下課嗎？', title:'第 2 輪繼續…' },
      { cls:'ai',   text:'第 2 輪 AI：上海有幾家不錯的機構，如…', title:'對話越來越長…' },
      { cls:'user', text:'第 3 輪 用戶：哪裏學函式比較好？', title:'窗口快滿了…' },
      { cls:'dropped', text:'✂️ 第 1-2 輪已被截斷丟棄（窗口已滿）', title:'⚠️ 窗口溢出，截斷第 1-2 輪！', warn:true },
      { cls:'user', text:'第 4 輪 用戶：我之前説我叫什麼？', title:'用戶問起名字…' },
      { cls:'warning', text:'❌ AI：對不起，我沒有找到你的姓名資訊…（「小明」已永久消失）', title:'糟糕！資訊已丟失！', warn:true },
    ]
  },
  {
    color: 'var(--amber)',
    demoHd: '演示：摘要壓縮保留關鍵資訊',
    pros: [
      {text:'大幅壓縮歷史 Token，顯著節省成本', pro:true},
      {text:'保留了關鍵資訊（人名、背景、偏好）', pro:true},
      {text:'需要額外 LLM 調用生成摘要（有成本）', pro:false},
      {text:'摘要本身可能有資訊損耗（細節丟失）', pro:false},
    ],
    scene: '<b>適用：</b>長期學習對話、客服系統，需要記住用戶身份的場景，對話超過 20 輪時效果明顯。',
    steps: [
      { cls:'user',    text:'第 1-5 輪：用戶小明與 AI 深入討論 Python 基礎、函式、閉包…', title:'對話積累了 5 輪…' },
      { cls:'ai',      text:'檢測到歷史超過閾值，觸發摘要壓縮…', title:'觸發自動摘要…' },
      { cls:'summary', text:'📝 [歷史摘要 · 約 200T] 用戶叫小明，上海，目標學 Python。已完成基礎語法，正學函式/閉包，對綫下課有興趣。', title:'摘要生成完成（200 Token 替代 2000 Token）' },
      { cls:'user',    text:'第 6 輪 用戶：閉包是什麼意思？', title:'用戶繼續提問…' },
      { cls:'ai',      text:'根據你的學習進度（你之前學過函式），閉包就是函式記住了定義時的變數環境…', title:'AI 記住了上下文！' },
      { cls:'ok',      text:'✅ 摘要保留了「小明、上海、Python、函式」，對話連貫，成本降低 90%', title:'摘要策略成功！' },
    ]
  },
  {
    color: 'var(--purple)',
    demoHd: '演示：語義檢索只注入相關歷史',
    pros: [
      {text:'Token 使用最優，精準注入相關歷史', pro:true},
      {text:'回答質素高，模型不被無關歷史干擾', pro:true},
      {text:'實現複雜，需要 Memory 向量檢索系統', pro:false},
      {text:'可能漏掉關聯不強但重要的隱性上下文', pro:false},
    ],
    scene: '<b>適用：</b>複雜 Agent 系統、超長對話（>100 輪）、需要精準記憶的垂直應用。',
    steps: [
      { cls:'dropped', text:'第 1-5 輪：關於 Python 基礎的討論（已向量化存入 Memory）', title:'歷史對話全部向量化存儲…' },
      { cls:'dropped', text:'第 6-9 輪：關於列表、字典的討論（已存入 Memory）', title:'更多歷史向量化…' },
      { cls:'user',    text:'第 N 輪 用戶：閉包和裝飾器有什麼區別？', title:'用戶提出新問題…' },
      { cls:'rag',     text:'🔍 Memory 檢索中… 語義最相關：第6輪（函式作用域）、第8輪（裝飾器）', title:'語義檢索找到相關歷史！' },
      { cls:'ai',      text:'根據我們之前關於閉包（第6輪）和裝飾器（第8輪）的討論…（95 輪歷史，只注入 2 輪）', title:'只注入最相關的 2 輪！' },
      { cls:'ok',      text:'🎯 100 輪對話中只取 2 輪注入，Token 消耗降低 98%，回答更精準', title:'選擇性保留大獲全勝！' },
    ]
  }
];

let curStrat = 0, curStep = 0, stepTimer = null;
let demoSeen = false; // 演示區進入過視野後，切換策略才自動播放
const colors = ['var(--danger)', 'var(--amber)', 'var(--purple)'];

function pickStrat(btn, idx) {
  document.querySelectorAll('.strat-btn').forEach((b,i) => {
    b.classList.toggle('active', i === idx);
    b.style.borderColor = i === idx ? colors[idx] : '';
    b.style.background = i === idx ? '' : '';
  });
  curStrat = idx;
  resetDemo();
  renderPros();
  if (demoSeen) startPlay();
}

function renderPros() {
  const s = STRATS[curStrat];
  document.getElementById('prosTitle').textContent = '優缺點分析';
  document.getElementById('prosItems').innerHTML = s.pros.map(p =>
    `<div class="pi ${p.pro?'pro':'con'}"><span class="pi-icon">${p.pro?'✅':'❌'}</span><span>${p.text}</span></div>`
  ).join('');
  document.getElementById('sceneBox').innerHTML = s.scene;
  document.getElementById('demoHd').textContent = s.demoHd;
}

function nextStep() {
  const s = STRATS[curStrat];
  if (curStep >= s.steps.length) return;
  const step = s.steps[curStep];
  const body = document.getElementById('visBody');

  const el = document.createElement('div');
  el.className = 'msg ' + step.cls;
  el.textContent = step.text;
  body.appendChild(el);
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('show')));
  body.scrollTop = body.scrollHeight;

  document.getElementById('visTitle').textContent = step.title;
  curStep++;

  document.getElementById('stepHint').textContent = `${curStep} / ${s.steps.length}`;
  document.getElementById('ctrlHint').textContent = curStep >= s.steps.length ? '演示完成' : '';
}

function resetDemo() {
  clearInterval(stepTimer);
  stepTimer = null;
  curStep = 0;
  document.getElementById('visBody').innerHTML = '';
  document.getElementById('visTitle').textContent = '自動演示中…';
  document.getElementById('stepHint').textContent = '';
  document.getElementById('ctrlHint').textContent = '';
}

/* 自动逐条播放（进入视野或切换策略时触发） */
function startPlay() {
  resetDemo();
  stepTimer = setInterval(function(){
    const s = STRATS[curStrat];
    if (curStep >= s.steps.length) { clearInterval(stepTimer); stepTimer = null; return; }
    nextStep();
  }, 800);
}

// 初始化
pickStrat(document.getElementById('sb0'), 0);
lessonOnView(document.getElementById('visBody'), function(){
  demoSeen = true;
  startPlay();
});
</script>
