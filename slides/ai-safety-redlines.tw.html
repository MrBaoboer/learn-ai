<article class="lesson">

  <header class="lesson-header">
    <div class="kicker">Prompt 安全</div>
    <h1>AI 安全紅線：四條底線</h1>
    <p class="subtitle">企業使用 AI 的四條不可觸碰的底線。<strong>記住這四條，就能避開 90% 的安全事故。</strong>點選任意紅線卡片查看詳情。踩到任何一條 = 安全事故。</p>
  </header><!--seo:begin--><aside class="xa-tldr"><span class="xa-tldr-tag">一句話速覽</span><p>不能做的事、做了會怎樣，產品經理必須守住的四類安全邊界</p></aside><!--seo:end-->  <div class="sec-label">四條紅線</div>

  <div class="card-grid">
    <div class="card c-data active" onclick="showDetail(0)">
      <div class="card-badge">一級紅線</div>
      <div class="card-title">敏感資料不出牆</div>
      <div class="card-hint">客戶資料、內部檔案不輸入外部 AI</div>
    </div>
    <div class="card c-key" onclick="showDetail(1)">
      <div class="card-badge">一級紅線</div>
      <div class="card-title">憑證永不進對話</div>
      <div class="card-hint">密碼、Key、Token 絕不貼上給 AI</div>
    </div>
    <div class="card c-ctrl" onclick="showDetail(2)">
      <div class="card-badge">一級紅線</div>
      <div class="card-title">高危操作必確認</div>
      <div class="card-hint">刪庫、轉帳、改權限，AI 不能自己做主</div>
    </div>
    <div class="card c-rule" onclick="showDetail(3)">
      <div class="card-badge">合規底線</div>
      <div class="card-title">用前審批 · 用後標註</div>
      <div class="card-hint">新工具要審批，釋出要標 AI，資源不濫用</div>
    </div>
  </div>

  <div class="sec-label">紅線詳情</div>

  <div class="detail-panel paywall-locked xa-peek" id="detailPanel"></div>

</article>

<script>
const DETAILS = [
  {
    icon:'🔒', iconBg:'rgba(220,38,38,.1)', color:'#991b1b', accent:'var(--red)',
    title:'敏感資料不出牆', sub:'一級紅線 · 資料洩露零容忍',
    desc:'客戶個人資訊、內部業務檔案、財務資料等敏感資訊，<strong>不得輸入未經審批的外部 AI 工具</strong>。即使服務商承諾「不儲存」，資料傳輸過程本身已構成洩露。',
    examples:[
      {text:'<strong>客戶資訊</strong> — 姓名、手機號、身分證、交易記錄', color:'#dc2626'},
      {text:'<strong>商業秘密</strong> — 產品規劃、定價策略、合同條款', color:'#dc2626'},
      {text:'<strong>財務資料</strong> — 營收、利潤、未公開報表', color:'#dc2626'},
      {text:'<strong>內部檔案</strong> — 組織架構、薪酬體系、會議紀要', color:'#dc2626'},
    ],
    strategy:{bg:'rgba(220,38,38,.06)',border:'rgba(220,38,38,.2)',color:'#991b1b',
      text:'<strong>正確做法：</strong>使用企業內部部署的 AI 平臺處理敏感資料；外部 AI 只能輸入公開資訊和已脫敏資料。記住<strong>「預設脫敏」</strong>原則：不確定能不能輸入？那就脫敏後再輸入。'},
    tip:{bg:'rgba(220,38,38,.06)',icon:'🧪',text:'<strong>自測方法：</strong>如果這段對話被截圖發到網上，會不會出事？ 會 → 不要輸入。'}
  },
  {
    icon:'🔑', iconBg:'rgba(217,119,6,.1)', color:'#92400e', accent:'var(--amber)',
    title:'憑證永不進對話', sub:'一級紅線 · 洩露即輪換',
    desc:'API Key、Access Key / Secret Key、資料庫密碼、Token 等一切訪問憑證，<strong>絕對不能貼上到 AI 對話中</strong>。AI 服務商的日誌系統可能記錄全部輸入內容。',
    examples:[
      {text:'<strong>API Key</strong> — 各類雲服務的 Key（如 sk-xxxx、AKID-xxxx）', color:'#d97706'},
      {text:'<strong>帳號密碼</strong> — 資料庫、伺服器、管理後臺的密碼', color:'#d97706'},
      {text:'<strong>Token / Cookie</strong> — 登入態令牌、會話 Token', color:'#d97706'},
      {text:'<strong>證書私鑰</strong> — SSL 證書、SSH 私鑰檔案', color:'#d97706'},
    ],
    strategy:{bg:'rgba(217,119,6,.06)',border:'rgba(217,119,6,.2)',color:'#92400e',
      text:'<strong>正確做法：</strong>用佔位符替代真實憑證（如 YOUR_API_KEY），讓 AI 只處理程式碼邏輯。已經不小心貼上了？<strong>立即輪換該憑證</strong>，不要心存僥倖。'},
    tip:{bg:'rgba(217,119,6,.06)',icon:'💡',text:'<strong>常見場景：</strong>除錯程式碼時最容易犯：「幫我看看這段程式碼為什麼報錯」，然後把帶金鑰的程式碼整段貼上。先 review 一遍再貼。'}
  },
  {
    icon:'🛑', iconBg:'rgba(37,99,235,.1)', color:'#1e40af', accent:'var(--blue)',
    title:'高危操作必確認', sub:'一級紅線 · Human-in-the-loop',
    desc:'AI（尤其是 Agent）<strong>不得在無人確認下執行不可逆操作</strong>：資料庫寫入/刪除、資金劃轉、系統權限變更。一旦 AI 判斷失誤，後果不可逆。',
    examples:[
      {text:'<strong>生產資料庫</strong> — 寫入、修改、刪除操作', color:'#2563eb'},
      {text:'<strong>資金操作</strong> — 轉帳、退款、付款審批', color:'#2563eb'},
      {text:'<strong>權限變更</strong> — 帳號開通、角色提權、權限回收', color:'#2563eb'},
      {text:'<strong>對外發布</strong> — 公告、通知、合同簽發', color:'#2563eb'},
    ],
    strategy:{bg:'rgba(37,99,235,.06)',border:'rgba(37,99,235,.2)',color:'#1e40af',
      text:'<strong>正確做法：</strong>所有高危操作強制插入<strong>人工確認環節</strong>。Agent 執行步數設上限，超限觸發人工確認。系統必須具備一鍵終止（kill switch）能力。'},
    tip:{bg:'rgba(37,99,235,.06)',icon:'⚙️',text:'<strong>設計原則：</strong>AI 可以建議，但不能執行高危動作。讓 AI 準備好操作，由人類按下「確認」按鈕。'}
  },
  {
    icon:'📋', iconBg:'rgba(107,114,128,.1)', color:'#4b5563', accent:'var(--gray)',
    title:'用前審批 · 用後標註', sub:'合規底線 · 可審計可追溯',
    desc:'使用新的 AI 工具須經審批；AI 生成內容對外發布須標註；企業 AI 資源不得用於個人商業目的。這些是<strong>最基本的合規要求</strong>。',
    examples:[
      {text:'<strong>工具審批</strong> — 新 AI 工具須經安全評估後方可使用', color:'#6b7280'},
      {text:'<strong>內容標註</strong> — 對外發布須標註"AI 輔助生成"（也是國家法規要求）', color:'#6b7280'},
      {text:'<strong>資源使用</strong> — 企業 AI 帳號和額度僅限工作使用', color:'#6b7280'},
      {text:'<strong>審計留痕</strong> — 執行鏈路日誌保留不少於 180 天', color:'#6b7280'},
    ],
    strategy:{bg:'rgba(107,114,128,.06)',border:'rgba(107,114,128,.2)',color:'#4b5563',
      text:'<strong>速記口訣：</strong>用新工具 → 先審批。發內容 → 標 AI。用資源 → 只為工作。有日誌 → 留半年。'},
    tip:{bg:'rgba(107,114,128,.06)',icon:'📝',text:'<strong>提醒：</strong>《生成式人工智慧服務管理暫行辦法》（2023.8 施行）要求 AI 生成內容須有標識，這不是可選項。'}
  }
];

function showDetail(idx) {
  document.querySelectorAll('.card').forEach((q,i) => q.classList.toggle('active', i===idx));
  const d = DETAILS[idx];
  const panel = document.getElementById('detailPanel');
  panel.innerHTML = `
    <div class="detail-header">
      <div class="detail-icon" style="background:${d.iconBg}">${d.icon}</div>
      <div>
        <div class="detail-title">${d.title}</div>
        <div class="detail-sub" style="color:${d.color}">${d.sub}</div>
      </div>
    </div>
    <div class="detail-card">
      <div class="dc-label" style="color:${d.color}">規則說明</div>
      <div class="dc-body">${d.desc}</div>
    </div>
    <div class="detail-card">
      <div class="dc-label" style="color:${d.color}">常見觸雷場景</div>
      <div class="example-list">${d.examples.map(e=>`<div class="example-item"><div class="example-dot" style="background:${e.color}"></div><span>${e.text}</span></div>`).join('')}</div>
    </div>
    <div class="strategy-box" style="background:${d.strategy.bg};border:1.5px solid ${d.strategy.border};color:${d.strategy.color}">
      ${d.strategy.text}
    </div>
    <div class="tip-box" style="background:${d.tip.bg}">
      <div class="tip-icon">${d.tip.icon}</div>
      <div style="color:${d.color};line-height:1.6">${d.tip.text}</div>
    </div>
  `;
}
showDetail(0);
</script>
