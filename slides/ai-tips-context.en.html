<body>
<article class="lesson wide">
  <header class="lesson-header">
    <div class="kicker">Practical Tips</div>
    <h1>Good vs Bad Prompts: <em>Context Is Everything</em></h1>
    <p class="subtitle">Same AI, different ways of prompting—completely different outputs. Click a scenario to compare.</p>
  </header>

  <div class="sec-label">Select a Scenario</div>
  <div class="scene-row" id="sceneRow"></div>

  <div class="sec-label">Side-by-Side Comparison</div>
  <div class="compare">
    <div class="cmp-col cmp-bad" id="colBad"></div>
    <div class="cmp-col cmp-good" id="colGood"></div>
  </div>
  <div class="insight" id="insightBar"></div>
</article>
<script>
const SCENES = [
  {
    name: 'Weekly Report',
    bad: {
      prompt: 'Write a weekly report for me',
      response: 'This week I completed work-related tasks, participated in the advancement of multiple projects, and effectively communicated with the team. Next week I will continue to push forward various tasks to ensure goals are met on time…',
      tags: ['No specific content', 'All filler template', 'Could be anyone\'s'],
    },
    good: {
      prompt: 'I\'m a product manager. This week: 1) Completed a user research report (interviewed 8 people); 2) Reviewed v2.3 requirements and cut 3 low-priority features; 3) Aligned on schedule with engineering—delayed by 2 days.\n\nPlease write a concise weekly report. Emphasize decisions and progress. Keep the tone practical, no fluff. 3 paragraphs max.',
      response: 'This week focused on driving v2.3 forward. <span class="highlight">Completed user research with 8 participants</span>—core pain points concentrated in the onboarding flow; report shared with design team. In the requirements review, <span class="highlight">proactively cut 3 low-priority features</span> to keep resources focused on the critical path. After aligning with engineering, <span class="highlight">the release is projected to slip by 2 days</span>; PMO has been notified and the milestone adjusted.',
      tags: ['Concrete content', 'Decisions + data', 'Tone on-target'],
    },
    insight: 'What\'s the difference? The good prompt supplied <em>role + facts + style requirements</em>. The AI isn\'t incapable of writing—it just <strong>didn\'t know what to write about</strong>. The more context you give, the more precise the output.'
  },
  {
    name: 'Analyze Data',
    bad: {
      prompt: 'Help me analyze this data',
      response: 'Data analysis needs to be approached from multiple dimensions. First, clarify the purpose of the analysis. Then collect relevant data. Next, choose an appropriate analytical method… It is recommended to use Excel or Python for data processing.',
      tags: ['Saying nothing', 'Zero actual analysis', 'Textbook-level dodge'],
    },
    good: {
      prompt: 'Here is our app\'s data for the past 7 days:\n- DAU: 12k→15k→14k→13k→18k→16k→15k\n- New registrations: 800→1200→950→900→1500→1100→980\n- Day-1 retention: 35%→32%→33%→31%→28%→30%→29%\n\nPlease identify anomalies, analyze possible causes, and give 3 actionable recommendations.',
      response: '<strong>Anomaly:</strong> On Day 5, DAU and registrations spiked simultaneously (<span class="highlight">DAU +38%, registrations +67%</span>). Likely a burst of external traffic (paid ads / referral / viral moment).\n\n<strong>Concern:</strong> Day-1 retention has <span class="highlight">been declining steadily since Day 5, now at 28–29%</span>, suggesting the new users are lower quality and not being properly onboarded.\n\n<strong>Recommendations:</strong> ① Identify the Day-5 traffic source and evaluate ROI; ② Optimize the new-user Day-1 onboarding flow; ③ Reduce spend on channels with low retention.',
      tags: ['Pinpoints anomaly', 'Root-cause analysis', 'Actionable suggestions'],
    },
    insight: 'What\'s the difference? The bad prompt provided no data, so the AI could only talk methodology. The good prompt <em>pasted the data directly in</em>—instantly turning the AI into an analyst. <strong>AI needs raw material to do real work.</strong>'
  },
  {
    name: 'Draft an Email',
    bad: {
      prompt: 'Write an email to a client for me',
      response: 'Dear Valued Customer,\n\nGreetings! Thank you for your continued support and trust. I am writing to communicate with you regarding relevant matters…\n\nLooking forward to your reply.\n\nBest regards',
      tags: ['No subject', 'Empty pleasantries', 'Completely unusable'],
    },
    good: {
      prompt: 'Context: A client (Mr. Zhang, manufacturing sector, 2-year partnership) had a system bug last week that halted their production line for 4 hours. We\'ve fixed it, but he\'s unhappy.\n\nPlease write an apology + post-mortem email: sincere but not groveling, explain the root cause and corrective actions, formal but not stiff, under 200 words.',
      response: 'Hi Mr. Zhang,\n\nWe sincerely apologize for the disruption last week\'s system outage caused to your production operations.\n\n<span class="highlight">Root cause:</span> Database connection pool overflow under high concurrency triggered a service interruption. <span class="highlight">Corrective actions:</span> Connection pool capacity has been expanded, a circuit breaker deployed, and 24h monitoring alerts added.\n\nTo prevent recurrence, we will provide a <span class="highlight">complimentary system health check</span> this week, handled directly by our technical lead.\n\nPlease don\'t hesitate to reach out with any questions.',
      tags: ['Appropriate tone', 'Root cause + actions', 'Offers remedy'],
    },
    insight: 'What\'s the difference? The good prompt provided a <em>complete scenario (people, event, emotions, constraints)</em>. Writing an email isn\'t typing—it\'s <strong>communicating in a specific context</strong>. The clearer the context, the more appropriate the email.'
  },
  {
    name: 'Learn a Concept',
    bad: {
      prompt: 'What is RAG?',
      response: 'RAG (Retrieval-Augmented Generation) is a method that combines retrieval and generation. It retrieves relevant information from an external knowledge base and provides it as context to the language model, thereby improving generation quality and accuracy…',
      tags: ['Encyclopedia answer', 'Still unclear after reading', 'No intuition built'],
    },
    good: {
      prompt: 'I\'m a product manager with no technical background. Please explain what RAG is and what problem it solves using an everyday analogy.\n\nRequirements: Start with a one-sentence conclusion, then expand with the analogy, then tell me the one thing a product manager needs to care about with RAG.',
      response: '<strong>In one sentence:</strong> RAG makes the AI look something up before answering, instead of relying purely on memory.\n\n<span class="highlight">Analogy:</span> Imagine asking a top student "what\'s the expense reimbursement process at your company?" Even the smartest person can only guess if they\'ve never read your company policy. But if you hand them the policy document first and they answer while reading it—that\'s RAG.\n\n<strong>What PMs need to care about:</strong> ① The quality of the retrieved documents determines the quality of the answers (is retrieval accurate?); ② Too many documents can overflow the context window and get truncated; ③ RAG isn\'t magic—if the knowledge isn\'t in the documents, the AI will still hallucinate.',
      tags: ['Analogical intuition', 'Clear structure', 'Role-specific advice'],
    },
    insight: 'What\'s the difference? The good prompt specified <em>who I am, what format I want, and what angle I care about</em>. When learning, <strong>"how to teach me" matters more than "what to teach me."</strong>'
  },
  {
    name: 'Creative Copywriting',
    bad: {
      prompt: 'Write me a tagline',
      response: 'Making life better!\nQuality choice, trust assured.\nWalking with you, building the future together.',
      tags: ['Generic filler', 'Zero differentiation', 'Fits any brand'],
    },
    good: {
      prompt: 'Product: A smart aroma diffuser for solo-living young adults aged 25–35, centered on the feeling of "coming home feels special."\n\nBrand tone: Warm but not sappy, with a touch of quiet humor.\n\nPlease give 5 candidate taglines, each under 15 words, avoiding overused words like "quality," "smart," and "tech."',
      response: '1. <span class="highlight">The moment you open the door, home is already waiting.</span>\n2. Living alone doesn\'t mean going unwelcomed.\n3. <span class="highlight">Others leave the office burned out. You walk in to lavender.</span>\n4. Ritual doesn\'t have to be expensive. Just plug it in.\n5. The apartment is rented. The scent is yours.',
      tags: ['Precise audience', 'Tone-matched', 'Ready to use'],
    },
    insight: 'What\'s the difference? The good prompt supplied <em>product, audience, tone, banned words, and format constraints</em>. Creativity isn\'t chaos—it\'s <strong>freedom within a clear framework</strong>. The clearer the framework, the more precise the creative output.'
  }
];

function renderScene(idx) {
  document.querySelectorAll('.scene-chip').forEach((c,i) => c.classList.toggle('active', i===idx));
  const s = SCENES[idx];

  document.getElementById('colBad').innerHTML = `
    <div class="cmp-label">❌ Bad Prompt</div>
    <div class="msg-bubble msg-user-bad"><div class="msg-lbl">YOU</div>${s.bad.prompt.replace(/\n/g,'<br>')}</div>
    <div class="msg-bubble msg-ai"><div class="msg-lbl">AI RESPONSE</div>${s.bad.response.replace(/\n/g,'<br>')}</div>
    <div style="display:flex;gap:5px;flex-wrap:wrap">${s.bad.tags.map(t=>`<span class="diff-tag diff-bad">${t}</span>`).join('')}</div>
  `;
  document.getElementById('colGood').innerHTML = `
    <div class="cmp-label">✅ Good Prompt</div>
    <div class="msg-bubble msg-user-good"><div class="msg-lbl">YOU</div>${s.good.prompt.replace(/\n/g,'<br>')}</div>
    <div class="msg-bubble msg-ai"><div class="msg-lbl">AI RESPONSE</div>${s.good.response.replace(/\n/g,'<br>')}</div>
    <div style="display:flex;gap:5px;flex-wrap:wrap">${s.good.tags.map(t=>`<span class="diff-tag diff-good">${t}</span>`).join('')}</div>
  `;
  document.getElementById('insightBar').innerHTML = `
    <div class="insight-icon">💡</div>
    <div class="insight-text">${s.insight}</div>
  `;
}

const row = document.getElementById('sceneRow');
SCENES.forEach((s,i) => {
  const btn = document.createElement('button');
  btn.className = 'scene-chip' + (i===0?' active':'');
  btn.textContent = s.name;
  btn.onclick = () => renderScene(i);
  row.appendChild(btn);
});
renderScene(0);
</script>
