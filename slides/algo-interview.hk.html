<script>
const QUESTIONS = [
  // ── Big-O 直覺（4 題）──
  {who:'hr',
   q:'「Big-O 到底在衡量什麼？為什麼工程師從不説『這段程式碼跑 3 秒』，而説『它是 O(n²) 的』？」',
   intent:'開場題，考你對複雜度的理解<strong>是不是停在符號層面</strong>。背名詞的人會背「時間複雜度的漸進上界」；真懂的人知道 Big-O 衡量的是增長趨勢——數據量翻倍時耗時怎麼變——這比某台機器上的絕對秒數有用得多。',
   frame:['<strong>先給本質：</strong>Big-O 衡量的不是快慢，是「數據變多時會惡化多快」。3 秒這個數換台機器就作廢，但 O(n²) 意味着數據翻十倍慢一百倍——這條規律在哪都成立。',
     '<strong>給一組對照：</strong>O(1) 數據再多都一樣快；O(log n) 十億條也就三十步；O(n) 同比例變慢；O(n²) 數據翻十倍耗時翻百倍——四條曲綫在小數據時擠在一起，大數據時分道揚鑣。',
     '<strong>點出實用價值：</strong>它是預測工具：今天一千條數據沒問題的程式碼，能不能撐到明年的一百萬條，看一眼複雜度就有答案，不用等上綫爆炸。',
     '<strong>落到 AI 時代：</strong>AI 寫的程式碼能跑通不等於能扛量，讓它自報複雜度、再問「數據量翻十倍會怎樣」，是最便宜的驗收動作。'],
   bonus:'補一句「Big-O 只看最高次項：O(n² + n) 就寫 O(n²)，因為 n 一大低次項無關緊要」——順手説清這個約定，考官知道你不是只背了符號表。',
   refs:[{href:'algo-1.html',label:'Big-O 複雜度直覺'},{href:'algo-build.html',label:'實戰：複雜度體檢'}]},

  {who:'boss',
   q:'「演示的時候絲般順滑，怎麼一上綫用戶多了就卡成幻燈片？當初驗收不是通過了嗎？這種事以後怎麼杜絕？」',
   intent:'老闆要的是<strong>事故解釋加預防機制</strong>。答「用戶太多了」是把鍋甩給成功；真懂的人能講出 Demo 和生產的本質差異——複雜度差的程式碼在小數據量下毫無症狀——並給出「按目標量級壓測」的預防制度。',
   frame:['<strong>先給根因：</strong>Demo 用幾十條測試數據，上綫是幾十萬條真實數據。有些程式碼的耗時隨數據量平方增長：一百條時 0.01 秒，十萬條時就是幾分鐘——它在演示環境裏根本不可能暴露。',
     '<strong>打個比方：</strong>這就像試駕時在小區裏開不出發動機的毛病，上了高速才知道跑不動。問題不是驗收造假，是驗收的路況不對。',
     '<strong>給預防機制：</strong>兩條制度：所有功能用目標量級的十倍數據做壓測才算驗收通過；讓 AI 或開發自報每個關鍵接口的複雜度，寫進技術評審清單。',
     '<strong>給當前行動：</strong>這次的卡點已定位，是一段平方級的查重邏輯，改成哈希方案後耗時回到毫秒級，本週上綫。'],
   bonus:'補一個數字錨點：「數據量翻 10 倍，O(n) 的程式碼慢 10 倍，O(n²) 的慢 100 倍——我們要求核心鏈路必須在 O(n log n) 以內」。給老闆一個能複述的驗收標準，他以後開會都會引用。',
   refs:[{href:'algo-1.html',label:'為什麼 Demo 不卡上綫卡'},{href:'algo-build.html',label:'壓測驗收'}]},

  {who:'dev',
   q:'「AI 給你寫的這個『找重複客户』功能你驗收過了？我看了眼程式碼，雙重循環兩兩對比。現在客户表 50 萬行，你猜要對比多少次？」',
   intent:'技術同事在敲打你<strong>驗收有沒有走心</strong>。背名詞的人聽到雙重循環沒有生理反應；真懂的人心裏立刻響警報：50 萬的平方是 2500 億次對比，必掛，而且知道正解是用哈希把 O(n²) 打回 O(n)。',
   frame:['<strong>先算給他看：</strong>兩兩對比是 n²/2，50 萬行就是一千多億次對比——就算每秒一億次也要跑二十多分鐘，這個實現等於不可用。',
     '<strong>給出正解：</strong>用哈希表：掃一遍數據，每個客户的關鍵字段（手機號碼、郵箱）進哈希表，撞上的就是重複——一遍掃完，O(n)，秒級出結果。',
     '<strong>承認並修補流程：</strong>這次驗收我只測了功能對不對，沒測量級扛不扛。以後我給 AI 的提示詞裏預設加一句「説明複雜度，按 50 萬行數據設計」。',
     '<strong>反問補細節：</strong>順便確認下：判重的口徑是完全一致還是模糊匹配？模糊匹配是另一檔複雜度，需求上我先把口徑釘死。'],
   bonus:'能主動説出「AI 特別愛寫雙重循環，因為它最直白、最不容易出邏輯錯——所以複雜度恰恰是驗收 AI 程式碼時最該盯的一項」，説明你已經摸清了 AI 的脾氣。',
   refs:[{href:'algo-1.html',label:'O(n²) 的爆炸'},{href:'ds-5.html',label:'哈希表查重'},{href:'algo-build.html',label:'實戰：複雜度體檢'}]},

  {who:'hr',
   q:'「排序至少要 O(n log n)、哈希查找是 O(1)、遍歷是 O(n)。就算記不住任何公式，怎麼快速看出一段程式碼大概是什麼複雜度？」',
   intent:'考你有沒有<strong>不依賴背誦的估算直覺</strong>。背名詞的人離開公式就失明；真懂的人有個簡單的透視法：數循環嵌套層數——一層 n、兩層 n²，再看有沒有「每次砍一半」的 log 特徵，幾秒鐘就能給出量級。',
   frame:['<strong>先給透視法：</strong>看循環嵌套：對全量數據的一層循環是 O(n)，循環裏再套一層全量循環就是 O(n²)——層數就是指數。',
     '<strong>識別 log 特徵：</strong>看到「每輪把範圍砍一半」（二分、平衡樹）就有 log n；「外層遍歷、內層砍半」就是 n log n——好排序都長這樣。',
     '<strong>識別 O(1) 特徵：</strong>不碰數據規模的操作：哈希取值、陣列按下標訪問、棧頂彈出，做一次是一次。',
     '<strong>補上陷阱：</strong>小心隱藏循環：語言內置的 includes、in、切片拷貝，看着一行程式碼，內部可能是一次全量遍歷——嵌套在循環裏就悄悄變成 O(n²)。'],
   bonus:'舉一個隱藏循環的真實案例：循環裏寫 list.includes(x) 查重，表面一層循環實際 O(n²)——這個坑連 AI 都經常寫出來。能説出具體 API 名字，直覺才算真的長在身上。',
   refs:[{href:'algo-1.html',label:'複雜度速查'},{href:'algo-4.html',label:'排序的 n log n'}]},

  // ── 注意力 O(n²)（3 題）──
  {who:'hr',
   q:'「Transformer 的注意力機制為什麼是 O(n²)？這個平方到底是誰乘誰？」',
   intent:'考你能不能把大模型最重要的複雜度<strong>講出物理含義</strong>。背名詞的人只會説「注意力是平方複雜度」；真懂的人能説清那個乘法：每個 Token 都要和所有 Token 計算相關性，n 個 Token 各算 n 次，就是 n×n。',
   frame:['<strong>先給機制：</strong>注意力的本職是讓每個 Token 知道該「關注」上下文裏的誰：生成或理解每個 Token 時，要拿它和序列裏所有 Token 逐個算一遍相關性分數。',
     '<strong>點破平方：</strong>n 個 Token，每個都要和 n 個 Token 算一次——n × n 次計算。上下文 1 萬 Token 是 1 億次，10 萬 Token 就是 100 億次，長十倍貴百倍。',
     '<strong>連到 KV Cache：</strong>生成階段靠 KV Cache 把已算的中間結果存下來，新 Token 只算自己對全文的注意力——省掉重算，但每一步仍要面對越來越長的歷史。',
     '<strong>給出後果鏈：</strong>這個平方是長上下文又貴又慢的數學根源，也是各家拼命研究稀疏注意力、綫性注意力的原因。'],

   frame:['<strong>先算賬認帳：</strong>算過之後我改主意了：百萬 Token 按當前價格一次請求就是幾美元，每天幾千次調用月帳單直接爆炸；首 Token 延遲幾十秒，用戶早跑了。',
     '<strong>給出正解：</strong>該用 RAG：文檔切塊建向量庫，每次只檢索最相關的幾千 Token 進上下文——成本降兩個數量級，還更準，因為模型對超長上下文裏中段的內容會「看丟」。',

  // ── 二分查找（3 題）──
  {who:'hr',
   q:'「1 到 100 猜數字，只告訴你大了還是小了，最笨的方法要猜 100 次。最優策略是什麼？換成十億個數呢？」',
   intent:'考你對<strong>對數級增長的體感</strong>。背名詞的人知道「二分查找」這個詞但報不出步數；真懂的人脱口而出：每次猜中間、範圍砍半，100 個數 7 次封頂，十億個數也只要 30 次——log n 的魔力就是數據爆炸步數幾乎不動。',
   frame:['<strong>先給策略：</strong>每次猜剩餘範圍的正中間：猜 50，大了就去 1-49，小了去 51-100——每猜一次，可能性直接砍掉一半。',
     '<strong>報出步數：</strong>100 個數最多 7 次（2 的 7 次方是 128）；十億個數最多 30 次——數據翻了一千萬倍，步數只從 7 漲到 30，這就是 O(log n)。',
     '<strong>點出對比：</strong>逐個猜是 O(n)，十億次；二分是 O(log n)，30 次。算法的差距不是快一點，是完全不同的物種。',
     '<strong>落到工程：</strong>數據庫索引查詢、版本回歸定位（git bisect）、有序日誌找時間點，全是這個「砍一半」思想的變體。'],
   bonus:'補一個震撼數字：「全宇宙原子數大約 10 的 80 次方，二分也只要 266 次」——用一個誇張但準確的例子給 log n 定錨，考官會記住這個回答。',
   refs:[{href:'algo-3.html',label:'二分查找'},{href:'algo-1.html',label:'log n 有多快'}]},

  {who:'hr',
   q:'「二分查找這麼快，為什麼不是所有查找都用它？它有一個必須滿足的前提，是什麼？維護這個前提的代價呢？」',
   intent:'考你知不知道<strong>快是有條件的</strong>。背名詞的人只記得二分快，忘了它挑食；真懂的人知道前提是有序——「大了往左小了往右」的判斷只在有序數據上成立——而排序本身 O(n log n)，數據頻繁變動時維護有序可能比查找本身更貴。',
   frame:['<strong>先給前提：</strong>數據必須有序。二分的每一步靠「中間值比目標大還是小」來決定丟左半還是右半——數據亂序時這個判斷毫無意義，砍掉的那半可能正藏着目標。',
     '<strong>算維護成本：</strong>有序不是免費的：先排序要 O(n log n)；之後每插入一條新數據都要挪位置保序，寫入頻繁的場景，省下的查找時間全賠在維護上。',
     '<strong>給選型邏輯：</strong>靜態或讀多寫少的數據（配置表、歸檔日誌）排一次序用二分很划算；寫入頻繁的用哈希表（O(1) 且不要求有序）或平衡樹（讀寫都 O(log n)）。',
     '<strong>總結成原則：</strong>快的算法都在吃某個前提的紅利，選型時先問「這個前提我維護得起嗎」。'],
   bonus:'補一句「哈希比二分還快，但哈希只能答『等於』，二分能答『大於小於、範圍、最接近』——有序結構的範圍查詢能力是哈希永遠給不了的」，把三種查找的分工一句話説清。',
   refs:[{href:'algo-3.html',label:'二分的有序前提'},{href:'ds-5.html',label:'哈希 O(1) 查找'}]},

  {who:'dev',
   q:'「你説綫上問題是最近兩週某個版本引入的，兩週 80 多個提交，你打算讓我一個個回滾排查？還是有更聰明的辦法？」',
   intent:'技術同事在考你<strong>能不能把二分思想用出課本</strong>。背名詞的人想不到二分能用在排障上；真懂的人立刻反應：提交歷史按時間有序、bug 的出現是單調的（某個點之前好之後壞），完美滿足二分條件——git bisect 七步定位。',

     '<strong>説出工具名：</strong>git 內置的 bisect 就是幹這個的，標記 good 和 bad 後它自動幫你跳中點，甚至能掛上自動化測試腳本無人值守跑完。',
     '<strong>點出前提意識：</strong>這麼幹有個前提：bug 是持續存在的（引入後每個版本都能復現）。偶發型 bug 不滿足單調性，二分會被假陰性帶偏，那得換思路加日誌。',
     '<strong>給產品側配合：</strong>我來提供準確的「最後一個正常版本」和最小復現步驟，縮小初始範圍、加快每輪驗證。'],
   bonus:'能主動説出「每輪驗證成本高時（構建 20 分鐘），二分的價值最大化——7 次對 80 次差的是一下午和兩星期」，説明你算的是工程賬，不是在背算法名。',
   refs:[{href:'algo-3.html',label:'二分思想'},{href:'algo-build.html',label:'驗證與排查'}]},

  // ── 排序（3 題）──
  {who:'hr',
   q:'「冒泡排序和快速排序，一個 O(n²) 一個 O(n log n)。不寫程式碼，説説它們的思路差在哪，為什麼差距會這麼大？」',
   intent:'考你能不能<strong>用思想解釋性能</strong>而不是背結論。背名詞的人只會報兩個複雜度數字；真懂的人能説出關鍵差異：冒泡每輪只把一個元素挪到位、大量比較被浪費；快排每次分區讓所有元素同時向正確的大區間歸位——一次操作的信息利用率完全不同。',
   frame:['<strong>先講冒泡：</strong>相鄰兩兩比較，大的往後冒，一整輪下來只保證一個元素到位——n 個元素要 n 輪，每輪 n 次比較，n² 就是這麼來的。',
     '<strong>再講快排：</strong>選個基準值，一輪分區讓所有元素各歸左右兩大陣營（小於基準的、大於基準的），再對兩邊遞歸——每輪 n 次比較讓全體元素都朝終點前進了一大步。',
     '<strong>點破差距來源：</strong>同樣比較一次，冒泡只換相鄰兩個的位置，快排把元素直接送進正確的半區——信息利用率的差距積累成 n 和 log n 輪數的差距。',
     '<strong>給量級體感：</strong>一百萬條數據：n² 是萬億次操作、分鐘到小時級；n log n 是兩千萬次、亞秒級——這就是為什麼沒有生產系統用冒泡。'],
   bonus:'補一句「快排是分治思想的代表作：拆成子問題、各自解決、天然還能並行」——把排序和分治章節串起來，展示的是知識網絡而不是孤立知識點。',
   refs:[{href:'algo-4.html',label:'排序算法賽跑'},{href:'algo-7.html',label:'分治思想'}]},

  {who:'dev',
   q:'「需求要展示『積分最高的 10 個用戶』，AI 給你的實現是把一千萬用戶全量排序再取前十。功能沒錯，你看出問題了嗎？」',
   intent:'技術同事在測你<strong>能不能識別「正確但浪費」的程式碼</strong>。背名詞的人看到結果對就放行；真懂的人會皺眉：要前 10 名卻把一千萬人排得整整齊齊，付了 O(n log n) 的全排代價，其實維護一個大小為 10 的候選池掃一遍就夠了。',
   frame:['<strong>先點出浪費：</strong>問題不在對錯在開銷：我們只要前 10 名，它卻把剩下 999 萬多人的相對順序也排清楚了——那些順序算完就扔，純浪費。',
     '<strong>給出正解：</strong>Top-K 問題標準解法：維護一個只裝 10 人的候選池（小頂堆），全量掃一遍，比池底高的擠進去——O(n log k)，k 是 10，約等於綫性掃一遍。',
     '<strong>再進一層：</strong>如果這個榜單高頻訪問，連掃都不該每次掃：用有序結構（如 Redis 的 sorted set）即時維護排名，查詢直接 O(1) 取頭部。',
     '<strong>轉成驗收習慣：</strong>這類題我以後驗收時加一問：「輸出只要一小部分時，你有沒有在為不需要的部分付費？」'],
   bonus:'能順口説出「推薦系統、搜索排序全是 Top-K 場景，沒人做全量排序——這是工程和課本差別最大的地方之一」，技術同事會確認你真的能對話。',
   refs:[{href:'algo-4.html',label:'排序的代價'},{href:'algo-5.html',label:'Top-K 與精排'}]},

  {who:'boss',
   q:'「用戶回饋搜索結果的排序『很隨機』，想要的永遠在第三頁。運營天天來催，這個排序到底怎麼治？」',
   intent:'老闆轉述的是模糊的體驗投訴，考你<strong>能不能把「排序很爛」拆成可動手的問題</strong>。背名詞的人只會説「優化排序算法」；真懂的人知道搜索排序壞在排序依據（相關性分數）而不是排序算法本身，要拆信號、調權重、建評測。',
   frame:['<strong>先糾正問題定位：</strong>排序算法本身不會錯——排出來不對，是「打分」不對：每條結果的相關性分數沒算好，按錯誤的分數排得再快也是錯的。',
     '<strong>拆出打分信號：</strong>好的排序分數是多路信號加權：文本相關性、點擊率、時效性、質素分。先查現在各信號的權重，很大機會是某路信號（比如時效）權重失衡把相關性淹沒了。',
     '<strong>給治理路徑：</strong>三步：建評測集（運營標註一批「查詢-期望結果」對）、離綫調權重看指標、上綫 AB 驗證——每一步都有數字，不靠感覺。',
     '<strong>給預期管理：</strong>兩週出第一輪評測基綫和調權結果；「想要的在第三頁」這類高頻壞案例先手工加規則止血，長期靠模型化排序。'],
   bonus:'補一句「必要時在排序後段加一層 Rerank 模型精排頭部幾十條——AI 搜索都在這麼做，成本只加在最後一小段上」，給老闆一個「我們的方案和最先進做法同源」的信心。',
   refs:[{href:'algo-5.html',label:'排序在 AI 裏的真身'},{href:'algo-4.html',label:'排序思想'}]},

  // ── Rerank（3 題）──
  {who:'hr',
   q:'「RAG 檢索明明已經按相似度排好序了，為什麼還要再加一層 Rerank 重排？兩次排序不重複嗎？」',
   intent:'考你懂不懂<strong>粗排和精排的分工</strong>。背名詞的人覺得排序就是排序，排兩次是浪費；真懂的人知道兩次排序用的模型完全不同：向量檢索是各算各的粗篩（快而糙），Rerank 是問題和文檔逐對細看（準而貴），漏斗結構讓快和準兼得。',
   frame:['<strong>先點破不同：</strong>兩次排序的依據不同。向量檢索裏問題和文檔是分別編碼再算距離，像憑簡歷初篩；Rerank 模型把問題和每篇文檔拼在一起逐對精讀打分，像當面面試。',
     '<strong>解釋為什麼不能只用準的：</strong>Rerank 又慢又貴，拿它掃全庫等於給一百萬人挨個面試——所以先用便宜的向量檢索從百萬裏粗篩出前 50，再用 Rerank 精排出前 5。',
     '<strong>給出漏斗本質：</strong>這是兩階段漏斗：每一層用更貴的模型處理更少的候選，總成本可控、最終質素接近全量精排。',
     '<strong>推廣到通用模式：</strong>推薦系統的召回-粗排-精排、簡歷的機篩-人面，全是同一個漏斗思想——計算預算有限時的標準結構。'],
   bonus:'補一個具體感受：「向量粗篩能把正確文檔帶進前 50，但經常排在十幾名；Rerank 一推就進前 3——而進不進前 3 決定它能不能被塞進上下文」。能説出這個細節的人顯然真調過 RAG。',
   refs:[{href:'algo-5.html',label:'Rerank 重排序'},{href:'ds-10.html',label:'向量粗篩'}]},

  {who:'dev',
   q:'「你 PRD 裏寫『所有檢索結果都過一遍 Rerank 保證質素』。知識庫 200 萬條，你算過這一遍的延遲和費用嗎？」',
   intent:'技術同事在攔一個<strong>把精排當免費魔法</strong>的方案。背名詞的人以為 Rerank 是開關，打開就變準；真懂的人知道 Rerank 是逐對推理，每條候選都是一次模型調用級的開銷，全量過就是把漏斗倒過來用，延遲和帳單都會爆。',
   frame:['<strong>先認錯並算賬：</strong>沒算，現在算：Rerank 對每條候選都要跑一次交叉編碼推理，200 萬條全過一遍是分鐘級延遲加一次幾十美元——用戶等不起，帳單更扛不住。',
     '<strong>給出正確寫法：</strong>PRD 改成漏斗：向量檢索先取 Top 50 到 100，Rerank 只精排這一小撮，延遲控制在幾百毫秒內，成本只增加百分之幾。',
     '<strong>定候選數的邏輯：</strong>粗排取多少條給 Rerank，拿評測集調：召回率曲綫拐點通常在幾十條——再多隻漲成本不漲質素。',
     '<strong>補一條監控：</strong>上綫後盯兩個數：正確文檔進入粗排 Top 50 的比例（漏斗上游健康度）和 Rerank 後進 Top 5 的比例（下游健康度），壞了能立刻定位是哪一層。'],
   bonus:'能説出「Rerank 的成本結構是按候選數綫性漲的，所以它的位置必須在漏斗末端——這和為什麼不能全庫跑大模型是同一個道理」，一句話證明你理解的是原理不是配置項。',
   refs:[{href:'algo-5.html',label:'兩階段漏斗'},{href:'algo-2.html',label:'推理成本'}]},

  {who:'boss',
   q:'「上個月剛花錢加了你説的 Rerank，這周用戶又反饋搜不到東西。錢白花了？這次你怎麼解釋？」',
   intent:'老闆在追責，考你<strong>有沒有漏斗全局觀</strong>。慌着懷疑 Rerank 的人會被牽着走；真懂的人知道 Rerank 只能重排候選、不能無中生有——「搜不到」很大機會是上游召回就沒撈到，或者知識庫裏壓根沒有，要分層排查而不是推倒重來。',
   frame:['<strong>先穩住定性：</strong>錢沒白花，但 Rerank 只負責漏斗的最後一段：把撈上來的候選排準。它排得再好，正確答案沒被上游撈進候選池，它也無米下鍋。',
     '<strong>給分層診斷：</strong>拿用戶搜不到的具體案例回放三層：知識庫裏到底有沒有這條內容？有的話向量檢索撈進 Top 50 沒有？撈進了 Rerank 排到前幾沒有？三層各有各的修法。',
     '<strong>預判常見結論：</strong>經驗上「搜不到」多數卡在前兩層：內容缺失或切塊太碎導致語義殘缺——修法是補內容、調切塊，和 Rerank 無關。',
     '<strong>給交代節奏：</strong>三天內出診斷報告，標清每個壞案例卡在哪一層、修復動作和預計生效時間——下次反饋來之前先有數據。'],
   bonus:'藉機建立一個老闆能懂的心智模型：「檢索是條流水綫，Rerank 是最後的質檢員——貨架上沒貨，質檢員再好也變不出貨」。一個好比喻能省掉未來無數次解釋。',
   refs:[{href:'algo-5.html',label:'漏斗排查'},{href:'ds-10.html',label:'召回與向量庫'}]},

  // ── 遞歸（3 題）──
  {who:'hr',
   q:'「遞歸就是自己調用自己，聽起來像個死循環。一個正確的遞歸必須具備哪幾個要素？少了哪個會發生什麼？」',
   intent:'考遞歸的<strong>安全三要素</strong>是否刻在你腦子裏。背名詞的人只記得「自己調自己」這半句危險的話；真懂的人張口就是三件套：基綫條件、自我調用、問題必須變小——並且知道少了基綫或問題不變小，等着你的就是爆棧。',
   frame:['<strong>先給三要素：</strong>一是基綫條件（什麼時候直接給答案、不再往下調）；二是自我調用；三是每次調用問題規模必須變小——三者缺一不可。',
     '<strong>推演缺失後果：</strong>沒有基綫條件，或者問題沒變小，調用就永遠停不下來：每層調用都在調用棧上壓一幀，棧空間有限，壓滿就是 stack overflow，程式當場崩潰。',
     '<strong>給一個完整例子：</strong>遍歷資料夾：基綫是「這是文件，直接處理」；遞歸是「這是資料夾，對每個子項重複此過程」；問題變小是「子資料夾層級更深、終會到底」。',
     '<strong>落到 AI：</strong>Agent 拆任務同構：拆到「一步能執行」就是基綫，拆不小的任務要設最大深度強制兜底——道理和程式碼一模一樣。'],
   bonus:'補一句「判斷遞歸對不對就問兩句話：它一定會停嗎？每層都在逼近停點嗎？」——把三要素壓縮成兩個可執行的檢查問題，面試官會想把這句話記下來。',
   refs:[{href:'algo-6.html',label:'遞歸三要素'},{href:'ds-3.html',label:'調用棧與爆棧'}]},

  {who:'hr',
   q:'「用戶對 Agent 説『幫我做一個官網』，它自己拆成設計、開發、部署幾十個小任務逐個完成。這個拆解過程和遞歸是什麼關係？」',
   intent:'考你能不能<strong>在 AI 行為裏認出算法結構</strong>。背名詞的人覺得 Agent 拆任務是「AI 的智能」，説不出機制；真懂的人能指出這就是遞歸下降：大任務拆成同類的小任務，拆到可直接執行為止，執行順序由調用棧管理。',
   frame:['<strong>先給對應關係：</strong>結構上就是遞歸：「完成任務 X」的方法是把 X 拆成幾個子任務、對每個子任務重複同樣的方法——自己調用自己，直到任務小到一步能做完（基綫條件）。',
     '<strong>指出棧的角色：</strong>執行時天然是棧語義：主任務掛起、先做子任務、子任務完成彈出、回到父任務繼續——Agent 的任務樹遍歷就是壓棧彈棧。',
     '<strong>點出工程差異：</strong>和程式碼遞歸不同的是，Agent 的「拆」由模型即興決定，不保證問題一定變小——所以必須外加最大深度、步數上限、預算上限這些護欄。',
     '<strong>給產品含義：</strong>理解這個結構就知道該盯什麼指標：拆解深度分佈、單任務重試次數、失控中斷率——Agent 產品的可靠性工程就從這裏開始。'],
   bonus:'補一句「Agent 拆任務是遞歸的『不保證收斂』變體：程式碼遞歸的基綫是程序員寫死的，Agent 的基綫靠模型判斷，所以護欄必須放在模型外面」。能點出這一層差異，就超越了類比達到了洞察。',
   refs:[{href:'algo-6.html',label:'Agent 拆任務'},{href:'ds-3.html',label:'棧與任務嵌套'}]},

  {who:'dev',
   q:'「你們那個『深度研究』Agent 昨晚自己給自己派活，跑了六個小時燒掉三百刀 API 費。我看了日誌，它在兩個子任務之間來回打轉。這鍋誰背？」',
   intent:'技術同事在事故複盤裏試探你<strong>是甩鍋還是懂根因</strong>。背名詞的人會説「模型不穩定」把鍋丟給 AI；真懂的人一聽「來回打轉」就知道是遞歸沒收斂：問題沒有變小、也沒有終止護欄，而護欄缺失是需求方和開發共同的責任。',
   frame:['<strong>先認領責任：</strong>鍋有我一半：PRD 裏只寫了「自動拆解並完成研究任務」，沒寫終止條件——等於讓一個遞歸上綫時沒有基綫條件。',
     '<strong>給出根因判斷：</strong>「兩個子任務來回打轉」説明問題規模沒有單調變小：A 的產出觸發 B，B 的產出又觸發 A——遞歸三要素破了第三條，理論上就會永遠跑下去。',
     '<strong>給修復清單：</strong>四道護欄：最大拆解深度、總步數上限、預算熔斷（燒到閾值自動暫停待人工確認）、循環檢測（同一子任務指紋出現第二次就強制終止）。',
     '<strong>補驗收用例：</strong>上綫前必測「給一個無解的任務」和「給一個會自我循環的任務」兩個極端場景，跑不飛才算過。'],
   bonus:'能報出行業慘案佐證：早期 AutoGPT 用戶最常見的投訴就是任務打轉燒錢，後來所有 Agent 框架都內置了步數與預算上限——説明這是結構性風險，不是我們程式碼特別爛。',
   refs:[{href:'algo-6.html',label:'遞歸失控'},{href:'ds-3.html',label:'爆棧的秘密'}]},

  // ── 分治 / Compaction（3 題）──
  {who:'hr',
   q:'「分治和遞歸經常一起出現，很多人分不清。它們是什麼關係？用歸併排序或者別的例子説説分治的完整套路。」',
   intent:'考概念之間的<strong>層次關係</strong>。背名詞的人把分治和遞歸當同義詞混用；真懂的人分得清：分治是解題策略（拆-治-合三步），遞歸是實現手段——分治通常用遞歸寫，但遞歸不一定在分治（比如單純的遍歷）。',
   frame:['<strong>先給關係：</strong>分治是策略，遞歸是技術。分治説的是「怎麼拆問題」：分成獨立子問題、分別解決、合併結果；遞歸是「自己調自己」這個實現手法——分治幾乎總用遞歸實現，反過來不成立。',
     '<strong>走一遍套路：</strong>歸併排序三步：分——陣列對半切到只剩單個元素（天然有序）；治——子陣列各自排序（遞歸做）；合——兩個有序陣列像拉拉鍊一樣合併成一個。',
     '<strong>點出分治的前提：</strong>子問題要相互獨立、結果要能合併。子問題之間糾纏不清的問題（比如有全局依賴的）分治不了。',
     '<strong>給現代註腳：</strong>分治的「獨立」意味着能並行：MapReduce、大數據處理、多路 Agent 併發幹活再彙總，全是分治的分佈式版本。'],
   bonus:'補一句「合併這一步最容易被輕視，歸併排序的智慧全在雙指針合併上；工程裏分治方案的成敗也往往在合併環節——比如多路摘要怎麼去重去衝突」。指出套路裏的隱藏難點，就和背誦者拉開了距離。',
   refs:[{href:'algo-7.html',label:'分治思想'},{href:'algo-4.html',label:'歸併與快排'}]},

  {who:'boss',
   q:'「客服 AI 聊久了會自動『壓縮記憶』是吧？可用戶投訴説聊到後面它把之前確認過的訂單號都記錯了。壓縮這東西可靠嗎？」',
   intent:'老闆在問一個<strong>有損機制的可靠性</strong>問題。背名詞的人只會説「壓縮難免丟信息」等於沒回答；真懂的人知道 Compaction 是遞歸摘要、天然有損，但「丟什麼」是可以設計的——關鍵事實要結構化保全，丟的應該是寒暄和過程。',
   frame:['<strong>先坦誠機制：</strong>壓縮確實是有損的：把幾十輪對話摘要成幾百字，細節必然有取捨——這是為了讓長對話不爆窗口、不爆帳單的必要妥協。',
     '<strong>指出問題所在：</strong>但訂單號被記錯不是「難免的損耗」，是壓縮策略的缺陷：訂單號、金額、承諾這類關鍵事實不該走摘要，摘要模型改寫時一個數字錯位就是事故。',
     '<strong>給修復方案：</strong>分層壓縮：關鍵事實（單號、時間、金額、已確認事項）抽取成結構化字段原樣保留，永不進摘要；閒聊和過程性內容才交給摘要壓縮。',
     '<strong>給驗證承諾：</strong>上綫「壓縮前後關鍵事實一致性」自動校驗，抽檢通過率作為週報指標——壓縮靠不可靠，用數據説話。'],
   bonus:'補一句「這和人記事一個道理：聊天內容可以只記大意，訂單號必須抄在本子上——我們就是給 AI 配那個本子」。把技術方案講成常識，老闆才真的放心。',
   refs:[{href:'algo-7.html',label:'Compaction 壓縮'},{href:'ds-2.html',label:'上下文截斷'}]},

  {who:'dev',
   q:'「你要求把 500 頁的招股書『切塊分別摘要再合併成一份報告』。想過切塊的邊界問題嗎？一個財務論證正好被從中間切斷，兩邊各自摘要會發生什麼？」',
   intent:'技術同事在戳分治方案的<strong>「獨立性前提」軟肋</strong>。背名詞的人以為切塊是均勻分頁那麼簡單；真懂的人知道分治要求子問題獨立，而文檔的語義單元跨頁存在——從論證中間切斷，兩個半截各自摘要都會曲解原意，合併時錯誤還會疊加。',
   frame:['<strong>先接住要害：</strong>會出胡話：前半截的「假設條件」和後半截的「結論」分了家，兩邊摘要各自腦補缺失的語境，合併後可能出現原文根本沒説過的判斷。',
     '<strong>給切塊原則：</strong>按語義邊界切不按字數切：章節、小節標題是天然分割綫；塊間再留 10% 到 15% 的重疊區，跨邊界的論證兩邊都能看到完整上下文。',
     '<strong>補合併環節：</strong>合併不是拼接：先給每塊摘要帶上章節出處，合併時讓模型做衝突檢測——兩塊結論矛盾時標記出來回查原文，而不是隨機採信一邊。',
     '<strong>給驗收標準：</strong>抽取原文裏跨塊邊界的十個關鍵論斷做一致性核對，全對才算通過——專治切塊引入的幻覺。'],
   bonus:'能説出「塊的大小還有個隱藏權衡：塊越大摘要質素越好但並行度越低、單塊成本越高——我傾向按章節自然大小切，不強行均勻」，説明你對分治的理解到了參數層。',
   refs:[{href:'algo-7.html',label:'切塊與遞歸摘要'},{href:'algo-2.html',label:'長文檔成本'}]},

  // ── BFS vs DFS（3 題）──
  {who:'hr',
   q:'「BFS 一層層掃，DFS 一條道走到黑。拋開術語，這兩種性格分別適合找什麼樣的東西？」',
   intent:'考你對兩種搜索的<strong>選型直覺</strong>。背名詞的人能畫出遍歷順序卻説不出何時用誰；真懂的人有清晰口訣：目標淺、要最短路徑用 BFS；目標深、要遍歷全部或省記憶體用 DFS——還能各給一個真實系統的例子。',
   frame:['<strong>先給兩種性格：</strong>BFS 從起點一圈圈向外擴，近處全看完才走遠處；DFS 認準一條路扎到底，撞牆才回頭換路。',
     '<strong>BFS 的適用面：</strong>答案離起點不遠、或要保證「最短路徑」時用它：社交網絡查兩人隔幾層、迷宮最短路綫、爬蟲按層抓網頁——BFS 第一次碰到目標的那條路必然最短。',
     '<strong>DFS 的適用面：</strong>要走遍所有角落、或目標藏得深時用它：遍歷檔案樹、走完所有分支的可能性窮舉——而且它只需記住當前這條路徑，記憶體比 BFS 記一整層節點省得多。',
     '<strong>給記憶體註腳：</strong>BFS 的隊列在寬圖上會膨脹得很大（每層節點數指數漲），DFS 的棧只有路徑深度那麼長——空間開銷經常是選型的決定因素。'],
   bonus:'補一句「工程裏常用折中方案：迭代加深——用 DFS 的省記憶體方式實現 BFS 的按層效果；遊戲 AI 和早期搜索引擎都用過」。知道兩者之間還有光譜，説明理解是立體的。',
   refs:[{href:'algo-8.html',label:'BFS 與 DFS'},{href:'ds-4.html',label:'隊列'},{href:'ds-3.html',label:'棧'}]},

  {who:'dev',
   q:'「Coding Agent 要在我們倉庫裏找數據庫配置。你覺得它該一層層掃目錄，還是順着入口檔案一路鑽下去？説説你的判斷依據。」',
   intent:'技術同事拿真實場景考你<strong>會不會活用搜索策略</strong>。背名詞的人隨便選一個説不出依據；真懂的人會先分析先驗知識：配置文件通常在淺層且文件名有模式（BFS 加名字過濾快），但「順程式碼引用找」本質是 DFS——兩種策略對應兩種綫索。',
   frame:['<strong>先給判斷依據：</strong>取決於手上有什麼綫索。綫索是「位置規律」（配置一般在根目錄或 config 目錄、名字帶 config/env）就該 BFS：淺層掃一兩層加文件名匹配，幾步就中。',
     '<strong>另一條路：</strong>綫索是「程式碼引用」（入口檔案裏 import 了什麼）就是 DFS：順着引用鏈一路追到配置定義處——路徑可能深，但每步都有確定方向，不會白掃。',
     '<strong>給出組合策略：</strong>實際 Agent 是混合體：先 BFS 看目錄結構建立地圖，再用 grep 這類全局匹配直接跳躍，最後 DFS 追引用鏈確認——工具讓它不必拘泥單一策略。',
     '<strong>落到驗收：</strong>所以評估 Agent 檢索能力時我會看它的搜索軌跡是否有策略性：無腦全量讀檔案的實現，成本和速度都不合格。'],
   bonus:'補一句「grep 相當於給圖加了傳送門，把逐層搜索變成關鍵詞直達——這也是為什麼 Coding Agent 的檢索效率高度依賴程式碼庫的命名質素」。能點出工具對算法的改寫，就是工程視角。',
   refs:[{href:'algo-8.html',label:'Agent 找檔案'},{href:'ds-7.html',label:'文件樹'}]},

  {who:'boss',
   q:'「同樣讓 AI 在公司文檔庫裏找一份資料，有時候幾秒就到，有時候等半天最後還説沒找到。這種時好時壞是怎麼回事？」',
   intent:'老闆在問搜索的<strong>方差從哪來</strong>。背名詞的人只會説「AI 不穩定」；真懂的人能解釋搜索路徑和運氣的關係：起點選得好、目標在淺層就快；綫索誤導、一條道走錯要大量回溯就慢——並給出減小方差的工程手段。',
   frame:['<strong>先給直觀解釋：</strong>AI 找資料像人在陌生倉庫找貨：有時一進門就看到，有時要一排排翻。它按綫索選搜索路徑，綫索準就直達，綫索誤導就繞遠路甚至遍歷完才敢説沒有。',
     '<strong>拆兩個具體原因：</strong>快慢差異來自搜索深度：目標在淺層或關鍵詞獨特，幾步命中；「沒找到」還要更久，因為宣佈沒有之前它必須把該看的都看完——證偽永遠比證實貴。',
     '<strong>給改善手段：</strong>降方差靠基礎設施：文檔規範命名和打標籤（改善綫索質素）、建索引和向量庫（把翻找變成直達）、常見查詢做緩存——讓運氣成分越來越小。',
     '<strong>給預期設定：</strong>整改後設定 SLA：九成查詢幾秒內返回，剩下的難查詢給進度提示——「時好時壞」會變成「大部分快、少數可解釋地慢」。'],
   bonus:'補一句「搜索時長的分佈比平均值更重要：平均 3 秒但 5% 的查詢要 3 分鐘，用戶記住的只有那 3 分鐘」——用長尾思維談體驗，老闆會意識到你懂的不只是技術。',
   refs:[{href:'algo-8.html',label:'搜索策略'},{href:'ds-10.html',label:'向量索引直達'}]},

  // ── 貪心 / 採樣 / Temperature（3 題）──
  {who:'hr',
   q:'「貪心算法的『貪』是什麼意思？它什麼時候能貪出全局最優，什麼時候會貪進死胡同？」',
   intent:'考你對貪心<strong>邊界條件的認識</strong>。背名詞的人只會説「每步選局部最優」；真懂的人知道貪心的成立是有條件的——局部最優能拼成全局最優的問題結構才行——並能各舉一個成功和翻車的例子。',
   frame:['<strong>先給定義：</strong>貪心就是每一步都選當下看起來最好的，選完不回頭。優點是簡單快速，一遍掃完就出結果。',
     '<strong>什麼時候靈：</strong>問題滿足「局部最優可疊加成全局最優」時貪心是正解：找零錢用最少張數（面額設計合理時）、按截止時間排任務——每步的好選擇不會堵死後面的路。',
     '<strong>什麼時候翻車：</strong>當前的好選擇會鎖死未來時貪心就掉坑：走迷宮每步朝出口方向走可能撞進死胡同；下棋每步吃對方最大的子會中棄子陷阱。',
     '<strong>給判斷方法：</strong>用前問自己一句：「這一步選錯了，後面還有救嗎？」沒救的問題（選擇之間強依賴）別用貪心，上動態規劃或搜索。'],
   bonus:'落一個 AI 註腳：「大模型的貪心解碼每步都選概率最高的詞，恰恰是『局部最優不保證全局最優』的活例子——開頭選了個平庸的詞，整句話就平庸到底了」。用剛學的 AI 知識反哺經典算法題，是最討喜的答法。',
   refs:[{href:'algo-9.html',label:'貪心與採樣'},{href:'algo-10.html',label:'貪心的短視'}]},

  {who:'hr',
   q:'「Temperature 這個參數，產品文檔裏都寫『越高越有創意、越低越穩定』。從算法角度講，它到底動了什麼？」',
   intent:'考你能不能<strong>把產品話術還原成機制</strong>。背名詞的人只會重複文檔裏那句話；真懂的人能講出它調節的是概率分佈的形狀：低温把分佈削尖趨近貪心（只選最很大機會），高温把分佈抹平讓冷門詞也有機會被採樣到。',
   frame:['<strong>先給機制：</strong>模型每步輸出的是候選詞的概率分佈，Temperature 在採樣前給這個分佈整形：温度低，分佈被削得更尖，高概率詞幾乎壟斷；温度高，分佈被抹平，冷門詞的中籤率上升。',
     '<strong>給兩個極端：</strong>温度趨近 0 就是貪心解碼：每步必選概率第一，同樣輸入幾乎同樣輸出；温度調高，擲骰子的隨機性變大，同一個問題十次十個答案。',
     '<strong>翻譯成產品語言：</strong>所謂「創意」就是敢走低概率路徑，代價是胡説的風險同步上升；所謂「穩定」就是循規蹈矩，代價是千篇一律。',
     '<strong>給配置建議：</strong>按任務定温度：客服、抽取、程式碼用低温（要對不要花），文案、頭腦風暴用高温（要花才有驚喜）——一個產品裏不同功能應該用不同温度。'],
   bonus:'補一句「Temperature 常和 Top-p 配合：先按累計概率截掉長尾再採樣，防止高温時採到徹底離譜的詞——兩個參數一起看才是完整的採樣策略」。能主動帶出參數間的聯動，就不是照本宣科了。',
   refs:[{href:'algo-9.html',label:'Temperature 的算法學'}]},

  {who:'boss',
   q:'「同一個模型，客服那邊要它穩定得像復讀機，營銷那邊嫌它寫文案千篇一律。兩邊需求打架，我們是不是得買兩個模型？」',
   intent:'老闆把參數問題理解成了模型問題，考你<strong>能不能用便宜方案解決貴問題</strong>。背名詞的人可能真去調研雙模型成本；真懂的人知道這就是一個 Temperature（加採樣參數）按場景分配的事——同一個模型、兩套調用配置，零額外成本。',
   frame:['<strong>先給結論省錢：</strong>不用買兩個模型。模型生成時有個「保守還是奔放」的旋鈕（Temperature），是每次調用時傳的參數——同一個模型，客服調用時擰低、營銷調用時擰高，就是兩種性格。',
     '<strong>解釋為什麼可行：</strong>模型每次都在一堆候選詞裏做選擇：擰低就永遠挑最穩的詞，輸出高度一致；擰高就允許冒險選新奇的詞，十條文案十個花樣。',
     '<strong>給落地方案：</strong>按業務綫建調用配置模板：客服低温加固定話術約束；營銷高温加一次生成多條供人挑選。一週內可上綫，成本只是配置工作量。',
     '<strong>給驗證方式：</strong>各拿 50 個真實案例試跑：客服看回答一致性和準確率，營銷看文案多樣性和採用率——數據確認後再固化配置。'],
   bonus:'替老闆想到下一步：「營銷那邊光調温度不夠的話，再加『多路生成 + 人工挑選』的工作流，創意產能能再翻幾倍——這也不需要新模型」。把問題解決在參數層，錢花在刀刃上。',
   refs:[{href:'algo-9.html',label:'貪心與採樣的兩種性格'},{href:'algo-10.html',label:'多候選生成'}]},

  // ── Beam Search / AI 時代還要不要刷題（2 題）──
  {who:'hr',
   q:'「貪心解碼一步錯步步錯，那模型怎麼『多想幾步再落筆』？説説 Beam Search 的思路，以及它為什麼沒有成為聊天產品的預設方案。」',
   intent:'考你對解碼策略的理解<strong>有沒有超出 Temperature</strong>。背名詞的人説不出 Beam Search 和貪心的關係；真懂的人能講清「同時保留 K 條候選路徑往前探」的機制，還知道它的代價（K 倍計算、偏保守）讓聊天場景寧可用採樣。',
   frame:['<strong>先給思路：</strong>Beam Search 是貪心的寬視野版：每步不是只留概率第一的詞，而是同時保留 K 條最有希望的候選句往前擴展，最後從 K 條完整路徑裏選整體概率最高的——用「多看幾步」避免開頭選錯鎖死全局。',
     '<strong>給對比錨點：</strong>貪心是 K=1 的特例；K 越大越接近全局最優，計算量也按 K 倍漲。',
     '<strong>回答後半問：</strong>它沒成為聊天預設有兩個原因：一是 K 倍算力在高併發下太貴；二是它偏愛「安全高概率」的句子，生成的話平淡重複，聊天要的靈動反而靠帶温度的採樣。',
     '<strong>給出它的主場：</strong>機器翻譯、語音識別這類「有標準答案、要整體最優」的任務裏，Beam Search 至今是主力。'],
   bonus:'補一句「現在推理模型的『先想再答』走了另一條路：不在解碼層多看幾步，而是先生成思考 Token 再給答案——用生成換搜索。兩條路綫解決的是同一個『貪心短視』問題」。能把 Beam Search 和思維鏈串起來，是本章最高級的融會貫通。',
   refs:[{href:'algo-10.html',label:'Beam Search'},{href:'algo-9.html',label:'貪心解碼'}]},

  {who:'boss',
   q:'「招聘要求裏還寫『算法基礎紮實』有意義嗎？AI 都能秒解 LeetCode 了，我們到底該考候選人什麼？」',
   intent:'終極觀念題，老闆在<strong>讓你重新定義人才標準</strong>。背名詞的人只會站隊「要考」或「不考」；真懂的人會區分「手寫算法的能力」和「用複雜度直覺做判斷的能力」——前者 AI 接管了大半，後者恰恰因為 AI 大量產碼而更稀缺。',
   frame:['<strong>先給判斷：</strong>有意義，但內涵變了。要淡化的是「手寫紅黑樹」式的默寫能力——AI 確實秒解；要強化的是算法直覺——能看出 AI 寫的程式碼扛不扛得住數據量、貴不貴、會不會失控。',
     '<strong>給理由：</strong>AI 時代程式碼產量暴漲，驗收需求同步暴漲：不懂複雜度的人簽收了 O(n²)，上綫就是事故——判斷力沒法外包給寫程式碼的那個 AI 自己。',
     '<strong>給考法建議：</strong>面試題從「白板寫快排」換成「這是 AI 寫的方案，指出它數據量翻百倍後的問題」「這個 Agent 為什麼會燒錢失控」——考的是真實工作裏每天要做的判斷。',
     '<strong>按崗位分層：</strong>基礎設施和算法崗仍要硬功底；產品工程和業務研發重直覺與驗收能力；PM 和運營能聽懂複雜度對話即可——一刀切的舊標準才該淘汰。'],
   bonus:'給老闆一句能轉述的話：「以前算法好的人負責把程式碼寫快，現在算法好的人負責不讓 AI 寫的慢程式碼上綫——考核從生產能力變成了守門能力」。這句話值一次管理層會議。',
   refs:[{href:'algo-11.html',label:'還要刷 LeetCode 嗎'},{href:'algo-12.html',label:'用 AI 學算法'},{href:'algo-build.html',label:'複雜度體檢'}]}
];

const WHO = {
  hr:  {label:'面試官',   cls:'who-hr',   card:''},
  boss:{label:'老闆',     cls:'who-boss', card:' c-boss'},
  dev: {label:'技術同事', cls:'who-dev',  card:' c-dev'}
};

document.getElementById('iqList').innerHTML = QUESTIONS.map(function(it, i){
  const w = WHO[it.who];
  return '<div class="iq-card' + w.card + '">'
    + '<div class="iq-head"><span class="iq-num">Q' + (i + 1) + '</span><span class="iq-who ' + w.cls + '">' + w.label + '</span></div>'
    + '<div class="iq-q">' + it.q + '</div>'
    + '<div class="iq-block iq-intent"><div class="iq-label">🎯 對方在考察什麼</div><div class="iq-body">' + it.intent + '</div></div>'
    + '<div class="iq-block iq-frame"><div class="iq-label">🧭 答題框架</div><ol>'
    + it.frame.map(function(f){ return '<li>' + f + '</li>'; }).join('')
    + '</ol></div>'
    + '<div class="iq-bonus"><b>⭐ 加分點</b>' + it.bonus + '</div>'
    + '<div class="iq-refs"><span class="iq-refs-label">用這些課程頁組織答案 →</span>'
    + it.refs.map(function(r){ return '<a href="' + r.href + '">' + r.label + '</a>'; }).join('')
    + '</div></div>';
}).join('');
</script>
