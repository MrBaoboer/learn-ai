<style>
:root{--green:var(--success);--red:var(--danger);--muted:var(--sub)}

/* filter buttons */
.filter-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
.filter-label{font-size:13px;color:var(--muted);font-weight:600}
.filter-btn{padding:8px 16px;border-radius:999px;border:1.5px solid var(--border);background:var(--card);font-size:13px;font-weight:700;cursor:pointer;transition:all .15s;color:var(--sub);font-family:inherit;min-height:36px}
.filter-btn.active{color:white}
.filter-btn.f-all.active{background:var(--accent);border-color:var(--accent)}
.filter-btn.f-green.active{background:var(--green);border-color:var(--green)}
.filter-btn.f-amber.active{background:var(--amber);border-color:var(--amber)}
.filter-btn.f-red.active{background:var(--red);border-color:var(--red)}

/* two-column: left list + right detail */
.sc-layout{display:grid;grid-template-columns:1fr 1.2fr;gap:20px;align-items:start}

.card-list{display:flex;flex-direction:column;gap:10px}
.scene-card{background:var(--card);border:2px solid var(--border);border-radius:var(--radius-sm);padding:13px 15px;cursor:pointer;transition:all .2s;display:flex;gap:12px;align-items:flex-start;box-shadow:var(--shadow-card)}
.scene-card:hover{transform:translateX(3px);box-shadow:0 2px 12px rgba(0,0,0,.06)}
.scene-card.active{border-color:var(--accent);background:rgba(0,102,255,.03)}
.scene-card.hidden{display:none}
.sc-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.sc-body{flex:1;min-width:0}
.sc-title{font-size:14px;font-weight:800;color:var(--text);margin-bottom:2px}
.sc-desc{font-size:12px;color:var(--sub);line-height:1.4}
.sc-risk{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:5px;font-size:10px;font-weight:800;margin-top:4px}

/* right detail panel (desktop sticky) */
.detail-panel{display:flex;flex-direction:column;gap:12px;position:sticky;top:20px}

.detail-hd{display:flex;align-items:center;gap:12px}
.detail-icon{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.detail-title{font-size:18px;font-weight:800;color:var(--text)}
.detail-risk{font-size:12px;font-weight:700;margin-top:2px}

.info-card{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px;box-shadow:var(--shadow-card)}
.ic-label{font-size:11px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;margin-bottom:6px}
.ic-body{font-size:14px;color:var(--sub);line-height:1.7}
.ic-body strong{color:var(--text)}
.ic-list{display:flex;flex-direction:column;gap:6px}
.ic-item{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.55}
.ic-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;margin-top:7px}

.do-dont{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dd-col{border-radius:var(--radius-sm);padding:12px 14px;font-size:13px;line-height:1.7}
.dd-col strong{display:block;font-size:11px;letter-spacing:.3px;margin-bottom:5px}
.dd-do{background:rgba(22,163,74,.06);border:1.5px solid rgba(22,163,74,.15);color:#14532d}
.dd-do strong{color:var(--green)}
.dd-dont{background:rgba(220,38,38,.06);border:1.5px solid rgba(220,38,38,.15);color:#7c2d12}
.dd-dont strong{color:var(--red)}

@media (max-width:768px){
  .sc-layout{grid-template-columns:1fr;gap:16px}
  .detail-panel{position:static}
  .do-dont{grid-template-columns:1fr}
  .filter-btn{padding:9px 15px}
}
</style>

<body>
<article class="lesson wide">
  <header class="lesson-header">
    <div class="kicker">Practical Tips</div>
    <h1>Scenario Guide: When to Trust AI</h1>
    <p class="subtitle">9 common scenarios ranked into three risk tiers. Click a scenario card on the left to view the detailed guide, or filter by risk level.</p>
  </header>

  <div class="filter-row">
    <span class="filter-label">Filter:</span>
    <button class="filter-btn f-all active" onclick="filterBy('all',this)">All</button>
    <button class="filter-btn f-green" onclick="filterBy('green',this)">Safe</button>
    <button class="filter-btn f-amber" onclick="filterBy('amber',this)">Caution</button>
    <button class="filter-btn f-red" onclick="filterBy('red',this)">High Risk</button>
  </div>

  <div class="sc-layout">
    <div class="card-list" id="cardList"></div>
    <div class="detail-panel" id="detailPanel"></div>
  </div>
</article>

<script>
const SCENES = [
  {
    icon:'📧', risk:'green', riskText:'Safe', title:'Email / Weekly Reports',
    desc:'An efficient assistant for everyday writing tasks',
    iconBg:'rgba(22,163,74,.1)',
    detail:'AI excels at structured writing and can quickly produce drafts when given context. You know the content well and can easily verify it.',
    tips:['Provide specific facts and data so AI can write substantive content','Specify tone and length to avoid AI going off on its own','Quickly review to confirm no fabricated data'],
    doList:['Provide specific work done this week','Specify style: practical / formal / casual','Let AI produce the framework, then you fill in the details'],
    dontList:['Just say "write me a weekly report" with no background','Send it without checking','Ask AI to make up things you haven\'t done']
  },
  {
    icon:'💡', risk:'green', riskText:'Safe', title:'Brainstorming / Idea Generation',
    desc:'Rapidly generate a large number of ideas and directions',
    iconBg:'rgba(22,163,74,.1)',
    detail:'Brainstorming doesn\'t require 100% accuracy, and AI\'s divergent thinking is exactly the advantage here. Hallucinations might even spark unexpected creative ideas.',
    tips:['Tell AI how many options you want (e.g., "give me 10 directions")','Setting constraints actually generates better ideas','Have AI think from different roles/perspectives on the same problem'],
    doList:['Clarify goals and constraints','Have AI list 10–20 directions to filter','Use "What if...?" to guide divergent thinking'],
    dontList:['Use AI\'s ideas directly as solutions','Skip feasibility evaluation','Only have AI list one or two options']
  },
  {
    icon:'🌐', risk:'green', riskText:'Safe', title:'Translation / Polishing / Rewriting',
    desc:'Language processing is AI\'s strong suit',
    iconBg:'rgba(22,163,74,.1)',
    detail:'Translation and text polishing are among the most thoroughly trained areas for large language models. You provide the source text, AI handles the language conversion — results are controllable and easy to verify.',
    tips:['Specify target style: formal / conversational / academic','Provide domain terminology lists to improve professionalism','Chinese-English mutual translation quality is already very high'],
    doList:['Provide complete source text and target style','Provide terminology references for specialized fields','Translate long texts in segments to maintain consistency'],
    dontList:['Skip a readthrough after translation','Rely on AI to translate important documents like legal contracts','Ignore cultural differences and context']
  },
  {
    icon:'📊', risk:'amber', riskText:'Caution', title:'Data Analysis / Report Interpretation',
    desc:'Can help analyze, but you need to provide the data',
    iconBg:'rgba(217,119,6,.1)',
    detail:'AI excels at finding patterns and writing analysis, but it cannot access your database. You must paste the data to it and verify that its calculations are correct.',
    tips:['Paste data directly into the conversation','Have AI explain the analysis approach first, then produce conclusions','Double-check key numbers yourself in Excel'],
    doList:['Provide complete data and analysis goals','Have AI explain the analysis logic','Cross-validate key conclusions'],
    dontList:['Have AI guess your data','Use AI-calculated numbers directly for decisions','Put it in presentation slides without verification']
  },
  {
    icon:'📝', risk:'amber', riskText:'Caution', title:'Learning New Concepts / Technical Research',
    desc:'Can get you started quickly, but cross-verify',
    iconBg:'rgba(217,119,6,.1)',
    detail:'AI is well-suited for quickly building an initial conceptual framework, but details may be incorrect. Especially for cutting-edge technology and niche fields, training data may have insufficient coverage.',
    tips:['Have AI use analogies to explain concepts and build intuition','Ask follow-up: "What is the source of that claim?"','Use keywords AI provides to search and verify'],
    doList:['State your knowledge level (beginner / intermediate)','Ask AI to explain with analogies and examples','Use AI as a starting point, then consult authoritative sources'],
    dontList:['Treat what AI says as textbook','Write it into documents/reports without verification','Ask about technical developments from the last 24 hours']
  },
  {
    icon:'💻', risk:'amber', riskText:'Caution', title:'Writing Code / Debugging',
    desc:'Huge productivity boost, but you must run and verify',
    iconBg:'rgba(217,119,6,.1)',
    detail:'AI is very capable at writing code, but it will fabricate non-existent APIs and mix up syntax from different versions. Code that looks correct but throws errors at runtime is common.',
    tips:['Provide specific tech stack and version numbers','Have AI explain code logic — don\'t just copy-paste','Actually run and test every piece of code'],
    doList:['Specify language, framework, and version','Paste error messages for AI to help debug','Have AI write unit tests to validate its own code'],
    dontList:['Deploy code without running it','Assume AI\'s API calls are correct','Ignore security issues (SQL injection, etc.)']
  },
  {
    icon:'⚖️', risk:'red', riskText:'High Risk', title:'Legal Regulations / Contract Terms',
    desc:'AI fabricates legal citations — never take them at face value',
    iconBg:'rgba(220,38,38,.1)',
    detail:'Law is a high-risk area for hallucinations. AI fabricates realistic-looking statute numbers, judicial interpretations, and case law. The format is perfect, the content is false, and non-experts cannot distinguish them.',
    tips:['Only use AI for an initial framework or general direction','Verify every cited regulation in official databases','Final versions must be reviewed by legal counsel'],
    doList:['Have AI list potentially relevant legal areas','Use AI to organize contract structure frameworks','Clearly annotate "for reference only — requires legal review"'],
    dontList:['Directly cite statute numbers AI provides','Sign a contract AI generated directly','Trust what AI says "according to Article X"']
  },
  {
    icon:'🏥', risk:'red', riskText:'High Risk', title:'Medical / Health Advice',
    desc:'Involves life safety — AI cannot replace a doctor',
    iconBg:'rgba(220,38,38,.1)',
    detail:'AI may provide incorrect drug dosages, confuse disease symptoms, or recommend inappropriate treatments. Errors in the medical field can be life-threatening.',
    tips:['Use AI to learn general common-sense knowledge','Any questions involving diagnosis or medication must be seen by a doctor','Also verify the authenticity of references AI provides'],
    doList:['Learn basic medical common-knowledge concepts','Organize symptom descriptions to communicate more effectively with a doctor','Use AI to help understand medical report terminology'],
    dontList:['Self-medicate based on AI suggestions','Use AI instead of seeing a doctor for diagnosis','Ask AI first in an emergency']
  },
  {
    icon:'📈', risk:'red', riskText:'High Risk', title:'Financial Decisions / Investment Advice',
    desc:'AI cannot predict markets and often fabricates data',
    iconBg:'rgba(220,38,38,.1)',
    detail:'AI cannot access real-time market data and will fabricate company financial figures and market trends. Investment decisions require real data and professional judgment — AI has neither.',
    tips:['Never make investment decisions based on AI\'s analysis','Verify specific data in financial terminals or public financial reports','AI can help you organize analytical frameworks, but cannot replace an analyst'],
    doList:['Have AI help organize analysis templates','Paste real data for AI to format','Use AI to understand financial concepts and terminology'],
    dontList:['Ask AI "will stock X go up or down"','Trust specific financial figures AI provides','Use AI output directly to produce investment reports']
  }
];

const RISK_META = {
  green:{color:'var(--green)',bg:'rgba(22,163,74,.1)',label:'Low Risk · Safe'},
  amber:{color:'var(--amber)',bg:'rgba(217,119,6,.1)',label:'Medium Risk · Caution'},
  red:{color:'var(--red)',bg:'rgba(220,38,38,.1)',label:'High Risk · Must Verify'}
};

function renderCards() {
  const list = document.getElementById('cardList');
  list.innerHTML = '';
  SCENES.forEach((s,i) => {
    const m = RISK_META[s.risk];
    const card = document.createElement('div');
    card.className = 'scene-card' + (i===0?' active':'');
    card.dataset.risk = s.risk;
    card.innerHTML = `
      <div class="sc-icon" style="background:${s.iconBg}">${s.icon}</div>
      <div class="sc-body">
        <div class="sc-title">${s.title}</div>
        <div class="sc-desc">${s.desc}</div>
        <span class="sc-risk" style="background:${m.bg};color:${m.color}">${s.riskText}</span>
      </div>
    `;
    card.onclick = () => {
      document.querySelectorAll('.scene-card').forEach(c => c.classList.remove('active'));
      card.classList.add('active');
      showDetail(i);
      if (window.innerWidth <= 768) {
        setTimeout(() => {
          document.getElementById('detailPanel').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 60);
      }
    };
    list.appendChild(card);
  });
}

function showDetail(idx) {
  const s = SCENES[idx];
  const m = RISK_META[s.risk];
  const panel = document.getElementById('detailPanel');
  panel.innerHTML = `
    <div class="detail-hd">
      <div class="detail-icon" style="background:${s.iconBg}">${s.icon}</div>
      <div>
        <div class="detail-title">${s.title}</div>
        <div class="detail-risk" style="color:${m.color}">${m.label}</div>
      </div>
    </div>
    <div class="info-card">
      <div class="ic-label" style="color:${m.color}">Scenario Overview</div>
      <div class="ic-body">${s.detail}</div>
    </div>
    <div class="info-card">
      <div class="ic-label" style="color:var(--accent)">Usage Tips</div>
      <div class="ic-list">${s.tips.map(t => `<div class="ic-item"><div class="ic-dot" style="background:var(--accent)"></div><span>${t}</span></div>`).join('')}</div>
    </div>
    <div class="do-dont">
      <div class="dd-col dd-do">
        <strong>✅ Do This</strong>
        ${s.doList.map(d => '· ' + d).join('<br>')}
      </div>
      <div class="dd-col dd-dont">
        <strong>❌ Don't Do This</strong>
        ${s.dontList.map(d => '· ' + d).join('<br>')}
      </div>
    </div>
  `;
}

function filterBy(risk, btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.scene-card').forEach(card => {
    if (risk === 'all' || card.dataset.risk === risk) {
      card.classList.remove('hidden');
    } else {
      card.classList.add('hidden');
    }
  });
  const firstVisible = document.querySelector('.scene-card:not(.hidden)');
  if (firstVisible) firstVisible.click();
}

renderCards();
showDetail(0);
</script>
