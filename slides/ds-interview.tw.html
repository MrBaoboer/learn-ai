<article class="lesson">
  <header class="lesson-header">
    <div class="kicker">他們會這樣考你</div>
    <h1>資料結構 · 30 道靈魂拷問</h1>
    <p class="subtitle">資料結構篇學完了，收納方式的直覺建立了沒有，一問便知。這 30 個問題來自三個真實場景，先自己開口回答，再看框架。</p>
  </header><!--seo:begin--><aside class="xa-tldr"><span class="xa-tldr-tag">一句話速覽</span><p>每題附考察意圖、答題框架與加分點：陣列 vs 連結串列 / 雜湊碰撞 / 樹的遍歷 / 快取設計 / 向量檢索 / 場景選型</p></aside><!--seo:end-->  <section class="paywall-locked xa-peek">
    <div class="iq-intro">
      <div class="iq-intro-title">怎麼用這一頁</div>
      <div class="iq-intro-lead">每道題都標註了提問者。他們問同一塊知識，想聽的東西卻不一樣。</div>
      <div class="iq-role-rows">
        <div class="iq-role-row" style="background:rgba(0,102,255,.05)"><span class="rr-name" style="color:var(--accent)">🎙 面試官</span><span class="rr-desc">想驗證你是真懂，還是在背名詞</span></div>
        <div class="iq-role-row" style="background:rgba(217,119,6,.06)"><span class="rr-name" style="color:var(--amber)">👔 老闆</span><span class="rr-desc">要的是解釋和承諾</span></div>
        <div class="iq-role-row" style="background:rgba(124,58,237,.05)"><span class="rr-name" style="color:var(--purple)">🛠 技術同事</span><span class="rr-desc">在試探你值不值得信任</span></div>
      </div>
      <div class="iq-intro-foot">每題給出三層：<strong>對方在考察什麼 → 答題框架 → 加分點</strong>。答不上來的環節，點末尾的課程頁回去補。</div>
    </div>

<script>
const QUESTIONS = [
  // ── 本質：資料結構 = 收納方式（2 題）──
  {who:'hr',
   q:'「你履歷上寫會資料結構。先別談程式碼，用一句白話告訴我：資料結構到底是什麼，解決什麼問題？」',
   intent:'開場熱身題，考的是你有沒有把資料結構<strong>內化成直覺</strong>而不是一堆定義。背名詞的人會開始背「資料的組織、管理和儲存格式」這類教科書句子；真懂的人會給一個生活隱喻，然後把「組織方式決定操作快慢」這個核心講出來。',
   frame:['<strong>先給本質：</strong>資料結構就是資料的收納方式。同一堆東西，扔抽屜裡和分格擺好，找起來的速度天差地別。',
     '<strong>點出核心矛盾：</strong>沒有萬能的收納方式，每種結構都是拿一種代價換一種好處——陣列查得快但插入貴，連結串列插入快但查詢慢。',
     '<strong>說清它解決什麼：</strong>它決定同樣的資料量下，程式是毫秒級響應還是幾秒卡死。資料小的時候怎麼放都行，資料一大差距就出來了。',
     '<strong>落到 AI 場景：</strong>message list 是陣列、KV Cache 是快取、RAG 檢索是向量近鄰——大模型肚子裡裝的全是這些結構。'],
   bonus:'主動講一句「選資料結構本質是選取捨，先問清楚這堆資料最高頻的操作是查、是插還是刪，再談用什麼裝」。能把選型邏輯說在前面的人，比能背八種結構的人稀缺得多。',
   refs:[{href:'ds-1.html',label:'資料結構 = 收納方式'},{href:'ds-summary.html',label:'八種結構決策表'}]},

  {who:'boss',
   q:'「AI 都能寫程式碼了，你們還要花時間學什麼資料結構？這筆錢和時間花得值得嗎？」',
   intent:'老闆不是在質疑你，是在<strong>要一個投入產出的解釋</strong>。答「基礎很重要」是廢話；真懂的人會把「AI 寫程式碼」和「人驗收程式碼」拆開，告訴老闆不懂結構的團隊會把慢程式碼直接上線，出事時才發現沒人看得懂。',
   frame:['<strong>先給結論：</strong>正因為 AI 在寫程式碼，人的角色從「寫」變成了「驗收」——不懂資料結構，就沒有驗收能力，等於閉眼簽字。',
     '<strong>給一個具體風險：</strong>AI 為了通用經常給出能跑但很慢的實現，比如該用雜湊表的地方用了雙重迴圈。Demo 階段看不出來，使用者量一上來直接卡死。',
     '<strong>算一筆帳：</strong>上線後返工的成本是開發階段發現的十倍以上，還要搭上使用者流失。學結構花的是小時級時間，防的是事故級損失。',
     '<strong>給行動承諾：</strong>我們不是去背課本，是學到能對 AI 的程式碼問出「為什麼選這個結構、資料量翻十倍還行不行」這兩個問題的程度。'],
   bonus:'補一句「我們已經在用了：每次讓 AI 寫完程式碼，都會要求它自己解釋選的結構並給出替代方案對比」，把學習成果落到看得見的工作流程上，老闆要的就是這個。',
   refs:[{href:'ds-1.html',label:'為什麼還要懂資料結構'},{href:'ds-build.html',label:'實戰：驗收 AI 的程式碼'}]},

  // ── 陣列與 message list（3 題）──
  {who:'hr',
   q:'「你和 ChatGPT 的對話歷史，在系統裡是用什麼結構存的？為什麼用它？」',
   intent:'考你能不能把大模型原理篇的 message list 和資料結構<strong>串起來</strong>。背名詞的人只會說「陣列吧」就沒了下文；真懂的人能講出對話場景的操作特徵——按順序追加、按順序整體讀——和陣列的強項剛好咬合。',
   frame:['<strong>先給答案：</strong>message list 就是一個陣列：system、user、assistant 訊息按時間順序一格一格排好，新訊息永遠追加在尾部。',
     '<strong>解釋為什麼合適：</strong>對話的操作模式是「尾部追加 + 從頭到尾整體讀」，這恰好是陣列最便宜的兩個操作；幾乎不需要在中間插入或刪除。',
     '<strong>補上機制細節：</strong>每次請求都是把整個陣列重新發給模型，模型按下標順序讀——順序就是語義，誰先誰後不能亂，這也是陣列保序特性的價值。',
     '<strong>落到工程：</strong>理解這一點後，RAG、記憶、截斷這些操作的本質都清楚了——全是在這個陣列上做增刪改。'],
   bonus:'指出陣列按順序整體讀還對效能友好：記憶體連續、快取命中率高。能從「功能合適」講到「物理層面也快」，說明你理解的不止是 API 表面。',
   refs:[{href:'ds-2.html',label:'陣列與 message list'}]},

  {who:'hr',
   q:'「對話太長超出上下文視窗時要做截斷。為什麼業界的通行做法是掐頭不掐尾——扔掉舊訊息、保住新訊息？」',
   intent:'考你對<strong>截斷策略背後的取捨</strong>有沒有想過。背名詞的人只會重複「滑動視窗」四個字；真懂的人能說出「近因性 + 陣列頭部刪除的語義」兩層理由，還知道 system prompt 是例外，必須釘在頭部不動。',
   frame:['<strong>先給結論：</strong>因為對話的資訊價值分佈不均：最近幾輪和當前問題最相關，最早的寒暄早就失效了。掐頭保尾符合「近的重要」這個基本規律。',
     '<strong>點出例外：</strong>system prompt 是全域規則，不管多長都必須保留，所以實際做法是「釘住頭部的 system + 滑動保留最近 N 輪」，掐的是中間偏早的部分。',
     '<strong>說清代價：</strong>被掐掉的資訊模型就真的看不見了——使用者三十輪前說過的預算、偏好會突然「失憶」。這不是 bug，是截斷的必然代價。',
     '<strong>給緩解方案：</strong>重要資訊不能只靠留在原文裡，要摘要成短句放進 system，或者存到外部記憶按需檢索回來。'],
   bonus:'能報出真實量級更有說服力：一輪正常對話幾百 Token，視窗 128K 也就撐幾百輪重對話；再提一句截斷點最好落在完整的一輪邊界上，從訊息中間切斷會讓模型讀到半句話。',
   refs:[{href:'ds-2.html',label:'上下文截斷'},{href:'ds-6.html',label:'快取與 KV Cache'}]},

  {who:'dev',
   q:'「你這個需求要往對話歷史第 3 條的位置插入一條提示訊息。你知道往陣列中間插一條資料，計算機實際上要幹多少活嗎？」',
   intent:'技術同事在試探你<strong>提需求時懂不懂代價</strong>。背名詞的人以為插入就是「放進去」一個動作；真懂的人知道陣列中間插入意味著後面所有元素集體後移，是 O(n) 操作，還會順勢問一句「這個插入是高頻還是一次性的」。',
   frame:['<strong>先接住問題：</strong>知道——陣列記憶體連續，往第 3 格插入，第 3 格之後的所有元素都要整體往後挪一位，資料越多挪得越久，是 O(n) 的操作。',
     '<strong>評估實際影響：</strong>但要看頻率和規模：對話歷史通常幾十到幾百條，一次性插入的成本毫秒級都不到，工程上完全可接受。',
     '<strong>給出替代思路：</strong>如果這類插入是高頻操作，那要重新設計：比如提示訊息不進歷史陣列，而是在每次請求組裝時動態拼接，歷史本身保持只追加。',
     '<strong>確認真實意圖：</strong>反問一句這條訊息要不要持久化、要不要讓模型每輪都看到——答案不同，實現位置完全不同。'],
   bonus:'能主動分辨「資料結構上的貴」和「業務上的貴」：中間插入對百萬級陣列是災難，對幾百條的 message list 無所謂。有量級感的 PM，技術同事才願意和你討論方案。',
   refs:[{href:'ds-2.html',label:'陣列中間插入的代價'},{href:'ds-summary.html',label:'八種結構決策表'}]},

  // ── 陣列 vs 連結串列（1 題）──
  {who:'hr',
   q:'「陣列和連結串列是最常拿來對比的一對。它們的根本區別是什麼？各舉一個 AI 產品裡該用誰的場景。」',
   intent:'經典選型題，考的不是定義而是<strong>取捨思維</strong>。背名詞的人會背「陣列連續、連結串列離散」然後卡住；真懂的人會用「按下標直達 vs 順藤摸瓜」講清訪問差異，再自然地落到場景——考官等的是後半段。',
   frame:['<strong>先給根本區別：</strong>陣列在記憶體裡連續排列，按下標直達任何位置，O(1)；連結串列每個節點存著下一個的地址，找第 N 個要順藤摸瓜走 N 步，O(n)。',
     '<strong>反過來看寫入：</strong>連結串列在已知位置插入刪除只改兩根指標，O(1)；陣列中間插入要整體搬家，O(n)。兩者優缺點剛好互補。',
     '<strong>陣列的場景：</strong>message list——追加在尾、整體順序讀、按序號定位，全是陣列的強項。',
     '<strong>連結串列的場景：</strong>頻繁在中間增刪、不需要隨機存取的場合，比如 LRU 快取的淘汰順序維護，用雙向連結串列移動節點是 O(1)。'],
   bonus:'補一刀現實感：現代工程裡裸連結串列用得越來越少，因為陣列的快取區域性性太強，中等規模下搬家成本反而比指標跳轉便宜。知道「教科書結論和工程實測會打架」，是加分中的加分。',
   refs:[{href:'ds-2.html',label:'陣列與插入代價'},{href:'ds-summary.html',label:'八種結構決策表'}]},

  // ── 棧（3 題）──
  {who:'hr',
   q:'「Cmd+Z 撤銷、瀏覽器後退、函式呼叫，這三件事背後是同一種資料結構。是什麼？它的規則為什麼恰好適合這三件事？」',
   intent:'考你能不能從三個表象<strong>抽出同一個模型</strong>。背名詞的人會答「棧，後進先出」就停了；真懂的人能說出這三個場景的共性——「最近發生的最先被處理」——再解釋為什麼這個共性天然對應棧的規則。',
   frame:['<strong>先給答案：</strong>是棧，規則只有一條：後進先出，永遠只操作最頂上那個。',
     '<strong>抽出共性：</strong>這三件事的需求都是「按發生順序的倒序處理」——撤銷要先撤最近的編輯，後退要回最近的頁面，函式返回要先回最近的呼叫者。',
     '<strong>展開一個例子：</strong>每次編輯壓一條記錄進棧，Cmd+Z 彈出棧頂恢復；做過的事像摞盤子，取的時候只能從最上面拿——順序天然就對。',
     '<strong>落到 AI：</strong>Agent 拆子任務也是壓棧：主任務掛起、子任務先做完彈出、再回來繼續。理解棧，就理解了 Agent 的任務巢狀。'],
   bonus:'提一句「重做（Cmd+Shift+Z）需要第二個棧：撤銷時彈出的記錄壓進重做棧」。用兩個棧解釋一對互逆操作，考官立刻知道你不是只背了定義。',
   refs:[{href:'ds-3.html',label:'棧：撤銷與呼叫'}]},

  {who:'dev',
   q:'「昨晚 Agent 遞迴拆任務把服務幹崩了，日誌裡全是 stack overflow。你作為需求方，知道『爆棧』到底爆的是什麼嗎？」',
   intent:'技術同事在確認你<strong>能不能理解事故根因</strong>，而不是聽完點頭。背名詞的人只知道「棧溢位=程式崩了」；真懂的人能講出呼叫棧的機制——每層呼叫都佔一格棧空間，沒有終止條件就無限壓棧，直到把固定大小的棧壓穿。',
   frame:['<strong>先答機制：</strong>爆的是呼叫棧。每發生一層函式呼叫，就往棧裡壓一幀記錄現場；呼叫返回才彈出。棧空間是固定的，遞迴沒有終止條件就一直壓不彈，壓滿即崩。',
     '<strong>對應到事故：</strong>Agent 拆任務就是遞迴：任務拆子任務、子任務再拆。如果沒設「拆到什麼程度停」的基線條件，它會無限拆下去，每層都佔一幀。',
     '<strong>給出產品側動作：</strong>這不只是程式碼 bug，需求裡就該寫清約束：最大拆解深度、單任務超時、總步數上限，三道保險。',
     '<strong>補上驗收標準：</strong>以後這類功能上線前，驗收用例裡必須有「給一個永遠拆不完的任務」的極端場景測試。'],
   bonus:'能說出「深度限制設多少要看業務：任務樹正常三四層就夠，限制設 10 層既容住正常情況又能快速攔住失控」，說明你不但懂機制，還能把機制翻譯成可靠的參數。',
   refs:[{href:'ds-3.html',label:'棧與爆棧'},{href:'algo-6.html',label:'遞迴三要素'}]},

  {who:'boss',
   q:'「使用者投訴我們編輯器只能撤銷一步，競品能撤銷五十步。這功能很難做嗎？要做多久？」',
   intent:'老闆要的是<strong>難度判斷和排期承諾</strong>，不是技術課。答「我問問技術」不及格；真懂的人知道多級撤銷就是把棧加深，本身不難，難點在每步「快照」存多大——這決定了記憶體成本和實現工作量。',
   frame:['<strong>先給結論：</strong>不難，這是成熟方案：撤銷本來就是棧結構，多級撤銷就是把只存一步改成存 N 步，主流編輯器都這麼做。',
     '<strong>指出真正的成本點：</strong>關鍵在每步存什麼——存整個文件快照最簡單但費記憶體，存增量差異省記憶體但實現複雜。五十步的深度決定了必須用增量方案。',
     '<strong>給排期邏輯：</strong>基礎版（增量記錄 + 雙棧支援重做）預計一個迭代內；邊界情況如協同編輯下的撤銷會複雜一檔，可以放二期。',
     '<strong>順手挖需求：</strong>確認一下使用者要的是不是其實是「誤操作恢復」——如果是，配合歷史版本功能一起做，價值更大。'],
   bonus:'提一句「五十步是顯示給使用者的承諾，內部實現按記憶體預算動態截斷舊記錄就行，使用者永遠撤不到第五十步之前」——把技術彈性藏在產品承諾後面，老闆會覺得你考慮得很成熟。',
   refs:[{href:'ds-3.html',label:'棧：撤銷與呼叫'}]},

  // ── 佇列（3 題）──
  {who:'hr',
   q:'「棧和佇列只差一個字：一個後進先出、一個先進先出。就這點區別，為什麼足以讓它們適用於完全不同的場景？」',
   intent:'考你是否理解<strong>順序規則和公平性的關係</strong>。背名詞的人只會重複 LIFO/FIFO 的縮寫；真懂的人能講出佇列的先進先出保證「先來的先被服務」，這是任務排程、排隊系統的公平底線，而棧的場景恰恰要「最近優先」。',
   frame:['<strong>先給本質：</strong>區別就是出口方向：棧從同一端進出（最近優先），佇列從一端進另一端出（先來先服務）。一個字的差異，語義完全相反。',
     '<strong>佇列的適用面：</strong>凡是「請求到達速度和處理速度不匹配」的地方都需要佇列：使用者請求排隊、訊息佇列、列印任務——先來的先辦，誰也不插隊。',
     '<strong>棧的適用面：</strong>凡是「要按倒序回溯」的地方用棧：撤銷、函式返回、任務巢狀——最近的先處理。',
     '<strong>給一個對照：</strong>Agent 的待辦任務用佇列（按計劃順序執行），Agent 的任務巢狀用棧（子任務先完成再回主線）——同一個系統裡兩者各管一段。'],
   bonus:'補一句「選錯的後果很具體：任務排程誤用棧會讓早期任務被無限餓死，新任務源源不斷壓在上面，老任務永遠輪不到」。能說出「餓死」這個詞，考官知道你見過真系統。',
   refs:[{href:'ds-4.html',label:'佇列與任務排程'},{href:'ds-3.html',label:'棧：撤銷與呼叫'}]},

  {who:'boss',
   q:'「為什麼我們的 AI 客服平時好好的，一到促銷檔期就一直轉圈？技術說在『削峰』，這是在削什麼？加機器能不能直接解決？」',
   intent:'老闆要一個<strong>聽得懂的解釋加一個決策依據</strong>。背名詞的人說「訊息佇列削峰填谷」等於沒說；真懂的人會用銀行櫃檯的比喻講清楚：櫃員數量固定，促銷檔期來的人翻十倍，佇列的作用是讓人排隊而不是把銀行擠爆。',
   frame:['<strong>先給解釋：</strong>模型推理的處理能力是固定的，比如每秒 100 個請求；促銷檔期湧進來每秒 1000 個。沒有佇列，多出來的 900 個直接把服務壓垮；有佇列，它們排隊等著，系統慢但不死。',
     '<strong>回答加機器：</strong>能緩解但不划算——按峰值配機器，平時 90% 的算力在閒置燒錢。正確做法是適度擴容 + 佇列兜底，讓峰值「排掉」而不是「頂掉」。',
     '<strong>把一直轉圈翻譯成指標：</strong>使用者看到的等待就是排隊時長。我們要盯的是佇列積壓量和最長等待時間，超閾值自動擴容或降級。',
     '<strong>給行動項：</strong>檔期前壓測出真實處理上限，設好「排隊超 30 秒先給自動回覆安撫」的降級策略——體驗託底比硬扛便宜得多。'],
   bonus:'報一個成本對比：按峰值擴容可能要十倍機器錢，佇列 + 彈性擴容通常兩三成成本就能扛住。老闆聽到具體的省錢比例，比聽到任何術語都安心。',
   refs:[{href:'ds-4.html',label:'佇列與削峰'},{href:'ds-6.html',label:'快取省錢'}]},

  {who:'dev',
   q:'「你要求批次任務『來多少收多少，後台慢慢跑』。好，那我問你：生產速度一直大於消費速度，這個佇列最後會怎樣？」',
   intent:'技術同事在檢驗你<strong>有沒有想過系統的極限狀態</strong>。背名詞的人以為佇列是無限大的魔法緩衝區；真懂的人知道積壓只增不減的佇列遲早吃光記憶體或磁碟，必須回答「上限設多少、滿了怎麼辦」。',
   frame:['<strong>先承認問題：</strong>會無限積壓直到資源耗盡——佇列只能緩衝脈衝式的高峰，救不了持續的供需失衡。生產長期大於消費，佇列就是個定時炸彈。',
     '<strong>給出三個閥門：</strong>限流（佇列到上限就拒絕新任務並提示稍後再試）、擴容（消費者數量根據積壓量自動伸縮）、丟棄或降級（低優先順序任務超時自動放棄）。',
     '<strong>從產品側配合：</strong>需求裡我來定優先順序規則——哪些任務使用者在等著必須先跑，哪些可以夜間跑，哪些積壓超一天就作廢。',
     '<strong>定監控指標：</strong>佇列長度和最老任務等待時長兩條告警線，積壓趨勢不對提前介入，別等使用者來報。'],
   bonus:'主動補一句「消費者擴容還要注意任務順序和冪等：同一使用者的任務亂序執行或重複執行都會出 bug」。能想到擴容的副作用，技術同事會真正把你當成能對話的人。',
   refs:[{href:'ds-4.html',label:'生產者消費者'},{href:'ds-summary.html',label:'八種結構決策表'}]},

  // ── 雜湊表（4 題）──
  {who:'hr',
   q:'「十億個使用者裡查一個人的資料，幾乎瞬間返回。雜湊表憑什麼做到？它到底省掉了什麼？」',
   intent:'考雜湊表的<strong>核心機制能不能講成人話</strong>。背名詞的人會說「雜湊表是 O(1) 的」但說不出為什麼；真懂的人能講出「用計算代替查詢」這個關鍵轉換——不是找得快，是根本不用找。',
   frame:['<strong>先給本質：</strong>它省掉的是「找」這個動作本身。普通查詢要一個個對比；雜湊表拿 key 一算，直接算出資料住在幾號桶，直達取貨。',
     '<strong>拆開機制：</strong>雜湊函式把任意 key（使用者 ID、單詞）變成一個固定範圍的數字，這個數字就是存放位置。存的時候按它放，取的時候按它拿，兩頭用同一個函式，位置必然一致。',
     '<strong>點出代價：</strong>快是拿空間換的——要預留一大片桶位，而且資料在桶裡是亂序的，想按順序遍歷或者找「範圍內所有人」它無能為力。',
     '<strong>落到日常：</strong>Python 的 dict、JS 的物件、Redis，天天在用的都是它。AI 場景裡 KV Cache 的查詢、詞表對映，底層也是雜湊。'],
   bonus:'用一個對比釘死量級：十億條資料，挨個找平均要五億次對比，雜湊一次計算直達——不是快幾倍，是快到不在一個物種。能把 O(n) 到 O(1) 講出畫面感，這題就滿分了。',
   refs:[{href:'ds-5.html',label:'雜湊表原理'}]},

  {who:'hr',
   q:'「雜湊函式再好也會有兩個不同的 key 算出同一個位置。碰撞發生時怎麼辦？碰撞變多會有什麼後果？」',
   intent:'上一題的自然追問，考你對雜湊表的理解<strong>有沒有第二層</strong>。背名詞的人到「鏈地址法」四個字就停了；真懂的人能講清掛鏈子的過程，並且知道惡化路徑——碰撞堆積會讓 O(1) 退化回 O(n)，雜湊表名存實亡。',
   frame:['<strong>先正面回答：</strong>碰撞不可避免，標準解法是鏈地址法：同一個桶裡的多個 key 掛成一條小連結串列，查詢時先定位到桶、再在鏈子上挨個對比。',
     '<strong>說清後果：</strong>鏈子短時無所謂，多對比兩三次而已；但如果大量 key 擠進少數桶，鏈子越來越長，查詢退化成線性掃描——號稱 O(1) 的表實際跑成 O(n)。',
     '<strong>給出成因：</strong>兩個誘因：雜湊函式分佈不均（某些桶天生熱門），或裝載率過高（資料多桶少，想不撞都難）。',
     '<strong>給出對策：</strong>工程上靠監控裝載率、超閾值自動擴容重排來兜底；好的雜湊函式讓 key 儘量均勻散開。'],
   bonus:'提一個真實攻擊案例：雜湊碰撞攻擊——攻擊者故意構造大量同桶的 key 把服務拖死，所以現代語言的雜湊函式要加隨機鹽。知道碰撞能變成安全問題，是罕見的深度訊號。',
   refs:[{href:'ds-5.html',label:'雜湊碰撞'}]},

  {who:'dev',
   q:'「你方案裡說『使用者畫像放雜湊表，即時查』。現在兩千萬使用者，明年翻到兩億——擴容那一下會發生什麼，你心裡有數嗎？」',
   intent:'技術同事在試探你知不知道<strong>雜湊表的成長痛</strong>。背名詞的人以為雜湊表自動變大無感知；真懂的人知道擴容意味著所有 key 重新雜湊、整體搬家，是一次 O(n) 的大動作，線上系統扛不住突然停頓。',
   frame:['<strong>先接住機制：</strong>有數——桶的數量變了，每個 key 算出的位置全變，擴容等於把兩千萬條資料全部重新雜湊搬一遍家。搬家期間查詢要麼停要麼慢。',
     '<strong>給出工程答案：</strong>成熟方案是漸進式擴容：新舊兩張表並存，每次讀寫順手搬幾條，把一次大停頓攤薄成無數次小動作——Redis 就是這麼做的。',
     '<strong>再拔一層：</strong>如果是分散式多機場景，還要用一致性雜湊，讓擴容時只有小部分 key 需要遷移，而不是全體洗牌。',
     '<strong>回到產品側：</strong>我在需求裡補上容量規劃：按明年兩億的規模預估記憶體，和你們確認擴容視窗和演練計劃。'],
   bonus:'能說出「裝載率到 0.75 左右就該擴了，別等塞滿」這種具體閾值，或者主動問「我們現在的裝載率是多少」，技術同事立刻知道你不是來對暗號的。',
   refs:[{href:'ds-5.html',label:'雜湊擴容'},{href:'ds-6.html',label:'快取與失效'}]},

  {who:'boss',
   q:'「你上次說雜湊表查東西快到不講理，那乾脆我們系統裡所有資料都用雜湊表存，不就全部都變快了？」',
   intent:'老闆在用樸素邏輯推極端結論，考你<strong>敢不敢說不、能不能說清邊界</strong>。順著說「好」的人失職；真懂的人會先肯定直覺，再用兩三個雜湊表幹不了的事（排序、範圍查詢、記憶體成本）把邊界畫出來。',
   frame:['<strong>先接住再轉折：</strong>查單條確實無敵，但雜湊表是偏科生——它把「按 key 直達」練到滿分，代價是別的科目全放棄了。',
     '<strong>列出幹不了的事：</strong>它內部是亂序的：想按註冊時間排序、查「最近七天下單的使用者」這種範圍查詢，雜湊表幫不上忙，還得靠有序結構。',
     '<strong>算記憶體帳：</strong>快是空間換的，桶位要預留、裝載率要壓低，全量資料塞雜湊表記憶體成本會失控——所以實踐是熱資料放雜湊（快取），全量放資料庫。',
     '<strong>給決策版結論：</strong>正確姿勢是組合拳：高頻精確查詢走雜湊，排序和範圍走 B+ 樹類索引，各幹各擅長的活。'],
   bonus:'用一個類比收尾：「雜湊表像快遞櫃，按單號取件極快，但你沒法讓快遞櫃『把包裹按大小排個序』」。老闆記住這個類比，下次就不會再提全用雜湊表了。',
   refs:[{href:'ds-5.html',label:'雜湊表的代價'},{href:'ds-summary.html',label:'八種結構決策表'}]},

  // ── 快取（4 題）──
  {who:'hr',
   q:'「快取的思想一句話就能說完：算過的別再算。那 KV Cache 快取的是什麼？為什麼沒有它，大模型生成會慢到沒法用？」',
   intent:'考你能不能把快取思想<strong>對接到大模型的具體機制</strong>。背名詞的人只會說「KV Cache 是快取 Key 和 Value」的同義反復；真懂的人能講出不快取的世界有多慘——每生成一個新 Token 都要把前文的注意力全部重算一遍。',
   frame:['<strong>先給快取本質：</strong>快取就是拿空間換時間：把算過的結果存起來，下次直接用，別重算。',
     '<strong>對接到生成過程：</strong>模型逐 Token 生成，每個新 Token 都要「看」前面所有 Token 的注意力中間結果。不快取的話，生成第 1000 個 Token 時要把前 999 個的計算全部重做。',
     '<strong>說清 KV Cache 存什麼：</strong>它把每個已處理 Token 的 Key/Value 中間結果存在顯存裡，新 Token 直接查表複用，整段生成的計算量從平方級壓回線性級。',
     '<strong>點出代價：</strong>顯存佔用隨上下文長度漲——長上下文又貴又吃顯存，一半原因就在這。快取的老規矩：空間換時間，兩頭總得付一頭。'],
   bonus:'串一句跨章知識：API 廠商的 Prompt Caching 折扣（命中部分常見五折到九折）就是把這個機制變成了定價——system prompt 放開頭保持穩定就能反覆命中。能從機制講到帳單，說明真的打通了。',
   refs:[{href:'ds-6.html',label:'快取與 KV Cache'},{href:'algo-2.html',label:'注意力的 O(n²) 帳單'}]},

  {who:'boss',
   q:'「這個月 AI 帳單又漲了 40%。技術提了個詞叫『快取命中率』，說提上去就能省錢。到底能省多少？你給我個數。」',
   intent:'老闆要的是<strong>可承諾的數字</strong>，不是原理課。含糊說「能省不少」的人會被追問到啞口無言；真懂的人會現場把帳拆開：哪部分開銷可快取、命中率現在多少、提到多少、對應省幾成，再給出提升命中率的具體動作。',
   frame:['<strong>先拆帳單結構：</strong>我們的開銷大頭是輸入 Token——每輪對話都要重發 system prompt 和歷史。這部分是重複計算，恰好是快取能吃掉的。',
     '<strong>給出計算邏輯：</strong>以 Prompt Caching 為例，命中部分的輸入費率通常只有原價一到五折。如果輸入佔帳單 70%、命中率做到 60%，整體帳單大約能降兩到三成。',
     '<strong>給動作而不只是數字：</strong>提高命中率的做法很具體：把 system prompt 和固定知識放到訊息最前面且保持位元組級穩定，動態內容往後放——前綴穩定才能命中。',
     '<strong>再補第二層：</strong>高頻重複的使用者問題上語義快取，相似問題直接返回快取答案，連模型呼叫都省了。兩層加起來，下月帳單目標降 30%，我按周彙報命中率。'],
   bonus:'主動暴露一個風險：語義快取省錢但有舊答案風險，知識更新後必須讓相關快取失效，否則省了錢賠了口碑。老闆看到你連副作用都想好了，這個承諾才有分量。',
   refs:[{href:'ds-6.html',label:'快取省錢'},{href:'ds-2.html',label:'message list 重發'}]},

  {who:'dev',
   q:'「你 PRD 裡寫『加語義快取，相似問題直接回快取答案』。好啊，那我問你：知識庫明天更新了，快取裡的舊答案怎麼辦？失效策略你想過嗎？」',
   intent:'快取的經典送命題：<strong>失效</strong>。背名詞的人方案裡只有「加快取」三個字，從沒想過刪；真懂的人知道快取失效是電腦科學兩大難題之一，能給出主動失效、TTL、版本號至少兩種策略的組合。',
   frame:['<strong>先承認這是核心難點：</strong>想過——快取最難的不是存是刪。舊答案比沒答案更糟，使用者拿著過期政策來投訴，鍋還是產品的。',
     '<strong>給出組合策略：</strong>三層：知識庫更新時主動清掉關聯快取（按知識條目和快取的對映關係精確失效）；全部快取帶 TTL 過期時間兜底；知識庫大版本更新直接整體清空重來。',
     '<strong>處理語義快取的特殊性：</strong>語義快取按相似度命中，還要定閾值：相似度多高才算同一個問題。閾值鬆了張冠李戴，緊了命中率歸零，需要拿真實問題集調。',
     '<strong>給驗收標準：</strong>上線指標兩條一起看：命中率（省錢）和快取答案的正確率抽檢（保命），只看第一條就是在埋雷。'],
   bonus:'補一句「政策、價格類的高風險問題可以直接繞過快取，永遠即時查」——按風險分級決定誰可快取，這個思路會讓技術同事覺得你對快取的理解超過大多數 PM。',
   refs:[{href:'ds-6.html',label:'快取失效'},{href:'ds-10.html',label:'向量與相似度'}]},

  {who:'hr',
   q:'「精確快取和語義快取，一字之差，判斷『算不算同一個問題』的方式完全不同。分別怎麼判斷？各自的坑在哪？」',
   intent:'考你對快取 key 的理解<strong>有沒有到達語義層</strong>。背名詞的人說不清兩者邊界；真懂的人知道精確快取按字串完全一致匹配（改一個字就失效），語義快取靠 Embedding 相似度（能泛化但會誤傷），坑恰好互補。',
   frame:['<strong>先給兩種判斷方式：</strong>精確快取拿請求原文做 key，一字不差才命中；語義快取把問題變成向量，相似度超過閾值就算同一個問題。',
     '<strong>精確快取的坑：</strong>命中條件太苛刻——「怎麼退款」和「如何退款」是兩個 key，使用者表達千變萬化，自然語言場景命中率低得可憐。',
     '<strong>語義快取的坑：</strong>相似不等於相同——「怎麼退款」和「怎麼取消退款」向量很近、語義相反，閾值沒調好就把錯誤答案端給使用者。',
     '<strong>給選型結論：</strong>API 層前綴複用用精確邏輯（Prompt Caching），使用者問題去重用語義快取加高閾值，高風險類目直接不快取。'],
   bonus:'點出語義快取的隱藏成本：每次查快取都要先做一次 Embedding 呼叫，本身也花錢花時間——省的必須大於花的，這筆帳很多方案根本沒算過。',
   refs:[{href:'ds-6.html',label:'語義快取'},{href:'ds-10.html',label:'Embedding 與相似度'}]},

  // ── 樹（3 題）──
  {who:'hr',
   q:'「檔案目錄、JSON、網頁 DOM、公司組織架構——為什麼這些東西全都長成樹？樹到底擅長表達什麼？」',
   intent:'考你能不能<strong>從一堆例子裡說出共性</strong>。背名詞的人會背「樹是有根節點的分層結構」；真懂的人會點破：這些東西天然存在「包含與從屬」關係，一個父節點管多個子節點、每個子節點只有一個爹——這就是樹的定義本身。',
   frame:['<strong>先給共性：</strong>它們都是「包含」關係：資料夾包含檔案、JSON 物件包含欄位、頁面元素包含子元素。凡是一層包一層、每個成員只有一個直接上級的關係，畫出來必然是樹。',
     '<strong>說清樹的強項：</strong>層級導航和分而治之——從根出發每層做一次選擇就能定位任何節點，路徑即地址（檔案路徑、DOM 選擇器都是這個原理）。',
     '<strong>給一個反例劃邊界：</strong>朋友關係、超連結網路不是樹——一個人可以屬於多個圈子、有環路，那是圖。樹是圖的特例：無環、單親。',
     '<strong>落到 AI：</strong>Coding Agent 看你的專案就是看一棵檔案樹，讀你的程式碼會解析成語法樹（AST）——它眼裡的世界是一棵套一棵的樹。'],
   bonus:'補一句「樹的深度決定查詢步數：平衡的樹百萬節點二十步到底，退化成一條鏈就是百萬步——所以資料庫索引拼命保持樹的平衡」。把樹和 log n 掛上鉤，廣度立刻顯出來。',
   refs:[{href:'ds-7.html',label:'樹與 AST'},{href:'ds-8.html',label:'圖與 DAG'}]},

  {who:'dev',
   q:'「你說讓 AI 把專案裡所有舊函式名批次改掉。直接全域字串替換不就行了？為什麼工具非要先把程式碼解析成 AST 再改？」',
   intent:'這題在試探你<strong>懂不懂「文字」和「結構」的本質區別</strong>。背名詞的人覺得替換就是替換；真懂的人能舉出字串替換的車禍現場——把註釋裡、字串裡、同名區域性變數全改了——AST 改的是語法節點，精確知道每個名字是什麼身份。',
   frame:['<strong>先給區別：</strong>字串替換把程式碼當一串字元，看見匹配就換；AST 先把程式碼解析成語法樹，每個名字都帶著身份——是函式名、變數名，還是註釋和字串裡的普通文字。',
     '<strong>舉車禍現場：</strong>全域替換 getData 會誤傷 getDataById、註釋裡的說明文字、字串裡的介面路徑；AST 只改「引用了那個函式定義」的節點，一個不多一個不少。',
     '<strong>點破本質：</strong>重構操作的對象是程式碼的結構而不是外觀。IDE 的重新命名、ESLint 的檢查、Copilot 的程式碼理解，全部建立在 AST 上。',
     '<strong>回應場景：</strong>所以這個需求我會寫成「基於語法的重新命名」，驗收標準裡加一條：字串和註釋內的同名文字不受影響。'],
   bonus:'提一句「AI 改程式碼偶爾會破壞語法，靠的兜底恰恰是 AST 解析失敗會立刻報錯——解析器是最便宜的第一道驗收」。能把 AST 說成質檢工具，視角就和工程師對齊了。',
   refs:[{href:'ds-7.html',label:'程式碼與 AST'},{href:'ds-build.html',label:'實戰：驗收 AI 的程式碼'}]},

  {who:'boss',
   q:'「我把整個專案丟給 Coding Agent，它幾秒鐘就說清了我們的程式碼結構。幾千個檔案啊，它是全讀了一遍嗎？這也太快了吧。」',
   intent:'老闆在表達驚訝，實際是想<strong>確認這能力的邊界和可信度</strong>。順著誇「AI 就是強」的人錯失機會；真懂的人會拆穿魔術：它沒有全讀，是沿著檔案樹做了結構化探索——先看目錄骨架，再挑關鍵檔案精讀。',
   frame:['<strong>先揭開魔術：</strong>它沒有全讀。專案是一棵檔案樹，它先掃一遍目錄結構——相當於看書先看目錄——幾千個檔案的骨架幾秒就掃完了。',
     '<strong>講清第二步：</strong>然後按線索精讀少數關鍵節點：配置檔案、入口檔案、README。樹結構讓它每層排除大量無關分支，不用地毯式搜尋。',
     '<strong>給出邊界：</strong>所以它對「專案大概什麼結構」很準，但沒讀過的深層實現細節它可能靠猜——問到具體業務邏輯時要讓它先讀了相關檔案再回答。',
     '<strong>轉成價值：</strong>這個能力可以用起來：新人入職讓 Agent 生成專案導覽、評審外包程式碼先讓它畫結構圖，都是幾分鐘的事。'],
   bonus:'補一句「它讀單個程式碼檔案時還會解析成語法樹來理解呼叫關係，所以能回答『這個函式被誰呼叫』這類結構問題」——把目錄樹和語法樹兩層都點到，解釋就完整了。',
   refs:[{href:'ds-7.html',label:'Coding Agent 眼裡的樹'},{href:'ds-1.html',label:'為什麼要懂結構'}]},

  // ── 圖（3 題）──
  {who:'hr',
   q:'「樹和圖長得很像，都是節點連節點。它們的分界線在哪？什麼樣的業務關係一定要用圖來表達？」',
   intent:'考你對兩種結構<strong>邊界的把握</strong>。背名詞的人說「圖有環樹沒有」就完了；真懂的人能從關係的性質出發：一旦成員可以有多個上級、關係可以繞回來，樹就裝不下了，硬套樹模型會丟資訊。',
   frame:['<strong>先給分界線：</strong>樹是受限的圖：每個節點只有一個父節點、不存在環。突破任何一條——多個上級、或者關係能繞一圈回來——就必須用圖。',
     '<strong>給必須用圖的場景：</strong>社交關係（互相關注成環）、知識圖譜（一個實體連線無數實體）、微服務依賴（A 調 B、B 調 C、C 又調 A 就是事故）。',
     '<strong>說清圖多出的能力：</strong>圖能回答「兩點之間怎麼走、隔幾層、哪個節點最關鍵」這類關係問題——推薦系統的「好友的好友」、風控的關聯帳戶挖掘全靠它。',
     '<strong>落到 AI：</strong>多 Agent 協作的工作流是圖（嚴格說是 DAG），知識圖譜給 RAG 補充實體關係——圖是 AI 表達「關係」的母語。'],
   bonus:'補一句判斷口訣：「問一句這個節點能有幾個爹、關係會不會繞回來——兩個問題任何一個答案是『會』，就上圖」。把選型壓縮成兩個問題，考官會記住你。',
   refs:[{href:'ds-8.html',label:'圖與 DAG'},{href:'ds-7.html',label:'樹與 AST'}]},

  {who:'dev',
   q:'「你畫的這個多 Agent 工作流，審核 Agent 的輸出又流回了生成 Agent。我們框架只接受 DAG，你知道為什麼必須無環嗎？」',
   intent:'技術同事在檢查你<strong>畫流程圖時腦子裡有沒有執行模型</strong>。背名詞的人不知道 DAG 的 A（無環）是硬約束；真懂的人明白有環意味著沒有確定的執行順序、可能無限迴圈，而「重試改稿」這類真實需求要用受控的迴圈次數來表達，不是在圖上畫圈。',
   frame:['<strong>先答為什麼：</strong>無環才有確定的執行順序——DAG 可以拓撲排序，誰先誰後、哪些能並行一目瞭然；一旦有環，排程器不知道從哪開始，跑起來可能無限打轉。',
     '<strong>接住真實需求：</strong>我畫那條迴流線想表達的是「審核不通過要退回重寫」。這個需求合理，但表達方式錯了。',
     '<strong>給正確表達：</strong>把迴圈藏進節點內部：審核-重寫封裝成一個帶最大重試次數的子流程節點，比如最多改三稿，超次數走人工兜底——圖本身保持無環。',
     '<strong>補上成本意識：</strong>每次重試都是真金白銀的模型呼叫，重試上限和退出條件我寫進 PRD，不讓它變成燒錢的死迴圈。'],
   bonus:'提一句「無環還保證了可恢復性：DAG 掛在中間可以從斷點續跑，有環的流程崩了都不知道該回滾到哪」。能說到故障恢復，說明你對生產環境有敬畏。',
   refs:[{href:'ds-8.html',label:'DAG 工作流'},{href:'algo-6.html',label:'遞迴與終止條件'}]},

  {who:'boss',
   q:'「競品發表會說他們用了『知識圖譜增強的 AI』，聽起來很厲害。我們是不是也得做一個？大概要投入多少？」',
   intent:'老闆被概念行銷打動了，考你<strong>能不能把術語翻譯成投入產出</strong>。直接說「跟」或「不跟」都輕率；真懂的人會先講清知識圖譜到底補了向量檢索的什麼短板，再評估自家場景配不配得上它的建設成本。',
   frame:['<strong>先解釋是什麼：</strong>知識圖譜是把知識存成「實體-關係」的圖：誰是誰的子公司、哪個產品屬於哪個類目。它補的是向量檢索的短板——向量擅長「找相似」，圖譜擅長「查關係」和多步推理。',
     '<strong>給判斷標準：</strong>值不值得上，看我們的使用者問題裡有多少是關係型的：「A 公司旗下有哪些產品在打折」這種多跳問題多，圖譜就有價值；大部分是「怎麼退款」式的問答，向量 RAG 足夠。',
