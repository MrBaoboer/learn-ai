<!DOCTYPE html>
<!--
  功能：爸妈版课程目录与 iframe 阅读外壳。
  作者：Cursor
  日期：2026-08-25
  版本：1.0.0
-->
<html lang="zh-CN" data-xa-login="direct">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="白艾莉小姐爸妈版课程阅读器：大字目录、学习进度与连续阅读。">
<meta property="og:image" content="https://xueai.miyang.cn/slides/og/og-default.jpg">
  <meta name="robots" content="index, follow">
  <link rel="icon" href="assets/favicon.ico" type="image/x-icon">
  <title>爸妈版课程学习｜白艾莉小姐</title>
  <link rel="stylesheet" href="elder-reader.css?v=20260903a">
  <script src="elder-course-data.js?v=20260903b" defer></script>
  <script src="elder-reader.js?v=20260903a" defer></script>
<link rel="canonical" href="https://xueai.miyang.cn/slides/elder-learn.html">
<link rel="alternate" hreflang="zh-CN" href="https://xueai.miyang.cn/slides/elder-learn.html">
<link rel="alternate" hreflang="zh-TW" href="https://xueai.miyang.cn/slides/elder-learn.tw.html">
<link rel="alternate" hreflang="zh-HK" href="https://xueai.miyang.cn/slides/elder-learn.hk.html">
<link rel="alternate" hreflang="zh-MO" href="https://xueai.miyang.cn/slides/elder-learn.hk.html">
<link rel="alternate" hreflang="x-default" href="https://xueai.miyang.cn/slides/elder-learn.html">
<meta property="og:url" content="https://xueai.miyang.cn/slides/elder-learn.html">
<meta property="og:site_name" content="xueai.miyang.cn · AI 产品经理培训">
<meta property="og:locale" content="zh_CN">
</head>
<body>
  <header class="reader-topbar">
    <a class="back-link" href="elder.html" aria-label="返回爸妈版首页">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="m15 18-6-6 6-6"/>
      </svg>
      <span class="button-copy">返回首页</span>
    </a>

    <button class="catalog-button" id="catalogButton" type="button" aria-controls="courseSidebar" aria-expanded="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
      <span class="button-copy">课程目录</span>
    </button>

    <div class="reader-heading" aria-live="polite">
      <div class="reader-title" id="currentTitle">正在打开课程…</div>
    </div>

    <div class="font-controls" id="fontControls" role="group" aria-label="调整课程正文字号">
      <span aria-hidden="true">字号</span>
      <button type="button" data-font-size="small" aria-pressed="false" title="小字号">小</button>
      <button type="button" data-font-size="standard" aria-pressed="false" title="标准字号">标准</button>
      <button type="button" data-font-size="large" aria-pressed="false" title="大字号">大</button>
      <button type="button" data-font-size="xlarge" aria-pressed="false" title="超大字号">超大</button>
    </div>

    <div class="reader-lang-slot" data-lang-switcher-slot></div>
    <span id="authSlot" aria-label="米羊账号状态"></span>
  </header>

  <button class="scrim" id="scrim" type="button" aria-label="关闭课程目录" tabindex="-1"></button>

  <div class="reader-shell">
    <aside class="reader-sidebar" id="courseSidebar" aria-label="爸妈版课程目录">
      <div class="sidebar-intro">
        <strong>九章 · 四十八课</strong>
        <span>可以按顺序学习，也可以直接打开想看的内容。</span>
        <div class="progress-summary">
          <div class="progress-copy">
            <span>已经学完</span>
            <strong id="progressText">0 / 48</strong>
          </div>
          <div class="progress-track" id="progressTrack" role="progressbar" aria-label="爸妈版课程完成进度" aria-valuemin="0" aria-valuemax="48" aria-valuenow="0">
            <span id="progressBar"></span>
          </div>
        </div>
        <a class="sidebar-home-link" href="elder.html">← 返回爸妈版首页</a>
      </div>
      <div class="reader-search">
        <label for="readerSearch">搜索课程</label>
        <div class="reader-search-box">
          <input id="readerSearch" type="search" placeholder="输入想找的内容" autocomplete="off">
          <button id="readerSearchClear" type="button" hidden>清空</button>
        </div>
        <button class="alice-search-button" id="aliceSearchButton" type="button" hidden>
          让白艾莉搜一搜
        </button>
      </div>
      <nav class="chapter-tree" id="chapterTree" aria-label="课程章节"></nav>
    </aside>

    <div class="reader-sidebar-resizer" id="readerSidebarResizer"
      role="separator" aria-orientation="vertical" aria-label="调整课程目录宽度"
      aria-valuemin="260" aria-valuemax="640" aria-valuenow="320" tabindex="0"
      title="左右拖动调整目录宽度，双击恢复默认"></div>

    <main class="reader-content">
      <div class="frame-area">
        <iframe class="lesson-frame" id="lessonFrame" title="爸妈版课程正文" referrerpolicy="no-referrer-when-downgrade"></iframe>
      </div>

      <nav class="lesson-footer" aria-label="课程翻页">
        <a class="step-button prev" id="previousLesson" href="#">
          <span class="step-arrow" aria-hidden="true">‹</span>
          <span class="step-copy">
            <span class="step-label">上一课</span>
            <span class="step-title" id="previousTitle">已经是第一课</span>
          </span>
        </a>

        <a class="step-button next" id="nextLesson" href="#">
          <span class="step-arrow" aria-hidden="true">›</span>
          <span class="step-copy">
            <span class="step-label">下一课</span>
            <span class="step-title" id="nextTitle">—</span>
          </span>
        </a>
      </nav>
    </main>
  </div>

  <div class="route-announcer sr-only" id="routeAnnouncer" aria-live="polite"></div>
  <script src="auth.js?v=20260903a"></script>
  <script>
    if (window.XueaiAuth) {
      window.XueaiAuth.mount(document.getElementById('authSlot'));
    }
  </script>
  <script src="watermark.js?v=20260806c"></script>
  <script src="/pwa-install.js?v=20260901c"></script>
<script src="i18n.js?v=20260903b"></script>
</body>
</html>
