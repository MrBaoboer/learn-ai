<style>
.scenario-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:8px}
@media(max-width:768px){.scenario-grid{grid-template-columns:1fr}}
.scenario-card{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-card);overflow:hidden;cursor:pointer;transition:all .3s}
.scenario-card:hover{border-color:var(--accent);box-shadow:var(--shadow-pop)}
.scenario-card.expanded{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,102,255,.1)}
.sc-header{padding:16px 20px;display:flex;align-items:center;gap:12px}
.sc-icon{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.sc-title-area{flex:1}
.sc-title{font-size:15px;font-weight:800;color:var(--text);margin-bottom:2px}
.sc-subtitle{font-size:12px;color:var(--sub)}
.sc-arrow{font-size:16px;color:var(--sub);transition:transform .3s;flex-shrink:0}
.scenario-card.expanded .sc-arrow{transform:rotate(180deg)}

.sc-detail{max-height:0;overflow:hidden;transition:max-height .4s ease,padding .3s;padding:0 20px}
.scenario-card.expanded .sc-detail{max-height:500px;padding:0 20px 20px}

.conflict-vis{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.memory-pill{padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.memory-old{background:rgba(220,38,38,.08);border:1px solid rgba(220,38,38,.18);color:var(--danger)}
.memory-new{background:rgba(22,163,74,.08);border:1px solid rgba(22,163,74,.18);color:var(--success)}
.conflict-arrow{font-size:18px;color:var(--sub)}

.strategy-tag{display:inline-block;padding:5px 12px;border-radius:6px;font-size:12px;font-weight:800;margin-bottom:10px}
.strategy-explain{font-size:13px;color:var(--sub);line-height:1.7}
.strategy-result{margin-top:10px;padding:10px 14px;border-radius:var(--radius-sm);font-size:13px;line-height:1.6}

.overview-card{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);padding:20px 24px;box-shadow:var(--shadow-card);margin-top:16px}
.overview-title{font-size:15px;font-weight:800;color:var(--text);margin-bottom:14px;text-align:center}
.overview-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:768px){.overview-grid{grid-template-columns:repeat(2,1fr)}}
.ov-item{text-align:center;padding:14px 8px;border-radius:var(--radius-sm);border:1.5px solid var(--border)}
.ov-item .ov-icon{font-size:24px;margin-bottom:6px}
.ov-item .ov-name{font-size:13px;font-weight:800;color:var(--text);margin-bottom:3px}
.ov-item .ov-when{font-size:11px;color:var(--sub);line-height:1.4}

.takeaway{background:rgba(124,58,237,.04);border:1.5px solid rgba(124,58,237,.18);border-radius:var(--radius);padding:16px 20px;font-size:15px;color:var(--text);display:flex;gap:10px;line-height:1.7;margin-top:24px}
.takeaway b{color:var(--purple)}
</style>

<script>
var scenarios = [
  {
    icon: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg>', iconBg: 'rgba(22,163,74,.1)', iconColor: 'var(--success)',
    title: '偏好變了', subtitle: '明確的替換關係',
    oldMemory: '喜歡喝咖啡', newMemory: '改喝茶了',
    strategy: '覆蓋更新', strategyColor: 'var(--success)', strategyBg: 'rgba(22,163,74,.1)',
    explain: '用戶明確表達了改變，新偏好直接替換舊偏好。不需要同時保留兩條，「喜歡咖啡」已經不再準確了。',
    result: '記憶更新為：<b>「飲品偏好：喝茶（已從咖啡改為茶）」</b>',
    resultBg: 'rgba(22,163,74,.05)', resultBorder: '1px solid rgba(22,163,74,.15)'
  },
  {
    icon: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>', iconBg: 'rgba(0,102,255,.1)', iconColor: 'var(--accent)',
    title: '信息補充', subtitle: '兩條信息可以共存',
    oldMemory: '住在北京', newMemory: '週末常去上海出差',
    strategy: '合併擴展', strategyColor: 'var(--accent)', strategyBg: 'rgba(0,102,255,.1)',
    explain: '兩條信息並不矛盾：住在北京和常去上海是互補的。合併成一條更完整的記憶。',
    result: '記憶合併為：<b>「常駐北京，週末常去上海出差」</b>',
    resultBg: 'rgba(0,102,255,.05)', resultBorder: '1px solid rgba(0,102,255,.15)'
  },
  {
    icon: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-8a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8"/><path d="M4 16s.5-1 2-1 2.5 2 4 2 2.5-2 4-2 2.5 2 4 2 2-1 2-1"/><path d="M2 21h20"/><path d="M7 8v3"/><path d="M12 8v3"/><path d="M17 8v3"/><path d="M7 4h.01"/><path d="M12 4h.01"/><path d="M17 4h.01"/></svg>', iconBg: 'rgba(217,119,6,.1)', iconColor: 'var(--amber)',
    title: '信息矛盾', subtitle: '不確定哪個對',
    oldMemory: '生日是3月15日', newMemory: '好像是3月16日？',
    strategy: '標記衝突', strategyColor: 'var(--amber)', strategyBg: 'rgba(217,119,6,.1)',
    explain: '用戶自己也不確定（「好像」），兩條都有可能對。保留兩條並標記衝突，等用戶下次明確時再決定。',
    result: '記憶標記為：<b>「生日：3月15日 <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg> 或3月16日（待確認）」</b>',
    resultBg: 'rgba(217,119,6,.05)', resultBorder: '1px solid rgba(217,119,6,.15)'
  },
  {
    icon: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>', iconBg: 'rgba(124,58,237,.1)', iconColor: 'var(--purple)',
    title: '臨時狀態', subtitle: '不值得更新長期記憶',
    oldMemory: '習慣早起', newMemory: '最近太累了總睡懶覺',
    strategy: '跳過不存', strategyColor: 'var(--purple)', strategyBg: 'rgba(124,58,237,.1)',
    explain: '「最近太累了」是臨時狀態，不代表用戶改變了長期習慣。跳過這條，不更新記憶。',
    result: '記憶保持不變：<b>「作息習慣：早起」</b>（臨時狀態不覆蓋長期偏好）',
    resultBg: 'rgba(124,58,237,.05)', resultBorder: '1px solid rgba(124,58,237,.15)'
  }
];

function renderScenarios() {
  var grid = document.getElementById('scenarioGrid');
  var html = '';
  scenarios.forEach(function(s, i) {
    html += '<div class="scenario-card" id="sc' + i + '" onclick="toggleCard(' + i + ')">';
    html += '<div class="sc-header">';
    html += '<div class="sc-icon" style="background:' + s.iconBg + ';color:' + s.iconColor + '">' + s.icon + '</div>';
    html += '<div class="sc-title-area"><div class="sc-title">' + s.title + '</div><div class="sc-subtitle">' + s.subtitle + '</div></div>';
    html += '<div class="sc-arrow"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></div>';
    html += '</div>';
    html += '<div class="sc-detail">';
    html += '<div class="conflict-vis">';
    html += '<span class="memory-pill memory-old"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:4px"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg> 舊記憶：' + s.oldMemory + '</span>';
    html += '<span class="conflict-arrow"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg></span>';
    html += '<span class="memory-pill memory-new"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:4px"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg> 新信息：' + s.newMemory + '</span>';
    html += '</div>';
    html += '<div class="strategy-tag" style="background:' + s.strategyBg + ';color:' + s.strategyColor + '">' + s.strategy + '</div>';
    html += '<div class="strategy-explain">' + s.explain + '</div>';
    html += '<div class="strategy-result" style="background:' + s.resultBg + ';border:' + s.resultBorder + ';color:var(--text)">' + s.result + '</div>';
    html += '</div>';
    html += '</div>';
  });
  grid.innerHTML = html;
}

function toggleCard(idx) {
  var card = document.getElementById('sc' + idx);
  card.classList.toggle('expanded');
}

renderScenarios();
</script>
