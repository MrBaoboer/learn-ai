.msg-item .role-tag{flex-shrink:0;font-size:11px;font-weight:800;padding:3px 8px;border-radius:5px;text-transform:uppercase;min-width:58px;text-align:center}

.role-system .role-tag{background:rgba(124,58,237,.1);color:var(--purple)}

<body>
<article class="lesson wide">

  <header class="lesson-header">
    <div class="kicker">上下文管理</div>
    <h1>压缩是一门取舍的艺术</h1>
    <p class="subtitle">上下文太长了怎么办？全删或全留都不对：有的能删（旧工具输出）、有的不能删（用户原话）、有的要花钱压（全量摘要）。产品经理需要一个决策框架。</p>
  </header>

  <div class="sec-label">上下文压缩模拟器</div>

  <div class="sim-wrap reveal">
    <div class="sim-header">
      <h3>一段 8 轮对话，试试不同的压缩策略</h3>
      <div class="strategy-btns">
        <button class="strat-btn active" onclick="applyStrategy(0)">原始（不压缩）</button>
        <button class="strat-btn" onclick="applyStrategy(1)">策略 A：删旧工具</button>
        <button class="strat-btn" onclick="applyStrategy(2)">策略 B：压缩 AI 输出</button>
        <button class="strat-btn" onclick="applyStrategy(3)">策略 C：激进全压</button>
      </div>
    </div>
    <div class="msg-list" id="msgList"></div>
    <div class="stats-bar" id="statsBar"></div>
  </div>

  <div class="sec-label paywall-locked xa-peek">决策框架</div>

  <div class="l-card reveal paywall-locked" style="margin-top:8px">
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px;text-align:center">
      <div style="padding:16px;background:rgba(22,163,74,.05);border-radius:var(--radius-sm);border:1px solid rgba(22,163,74,.15)">
        <div style="font-size:22px;margin-bottom:6px"><span style="display:inline-block;width:18px;height:18px;border-radius:50%;background:#22c55e;margin-bottom:8px"></span></div>
        <div style="font-size:14px;font-weight:800;color:var(--success);margin-bottom:4px">可以删</div>
        <div style="font-size:12px;color:var(--sub);line-height:1.5">旧的工具调用结果<br>已处理完的中间步骤<br>重复的确认消息</div>
      </div>
      <div style="padding:16px;background:rgba(217,119,6,.05);border-radius:var(--radius-sm);border:1px solid rgba(217,119,6,.15)">
        <div style="font-size:22px;margin-bottom:6px"><span style="display:inline-block;width:18px;height:18px;border-radius:50%;background:#eab308;margin-bottom:8px"></span></div>
        <div style="font-size:14px;font-weight:800;color:var(--amber);margin-bottom:4px">可以压缩</div>
        <div style="font-size:12px;color:var(--sub);line-height:1.5">AI 的长篇回复<br>多轮讨论的结论<br>搜索/查询的详细结果</div>
      </div>
      <div style="padding:16px;background:rgba(220,38,38,.05);border-radius:var(--radius-sm);border:1px solid rgba(220,38,38,.15)">
        <div style="font-size:22px;margin-bottom:6px"><span style="display:inline-block;width:18px;height:18px;border-radius:50%;background:#ef4444;margin-bottom:8px"></span></div>
        <div style="font-size:14px;font-weight:800;color:var(--danger);margin-bottom:4px">不能动</div>
        <div style="font-size:12px;color:var(--sub);line-height:1.5">用户的原始消息<br>System Prompt<br>关键的偏好设定</div>
      </div>
    </div>
  </div>

  <div class="takeaway reveal paywall-locked">
    <span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg></span>
    <span><b>压缩不是全删或全留，是在信息价值和 token 成本之间找平衡。</b>好的压缩策略像一个有经验的编辑：知道什么是废话可以砍，什么是用户的原话必须留。</span>
  </div>

</article>
<script src="i18n.js?v=20260808"></script>
<script src="lesson.js"></script>
<script>
var messages = [
  { role: 'system', type: 'role-system', text: '你是一个旅行助手，帮用户规划行程。', tokens: 80 },
  { role: 'user', type: 'role-user', text: '我想去日本玩 7 天，预算 2 万，喜欢美食和温泉。', tokens: 45 },
  { role: 'assistant', type: 'role-assistant', text: '好的！根据您的偏好，我推荐东京(3天)+箱根温泉(2天)+大阪美食(2天)的路线。东京可以去筑地市场、浅草寺…（详细 800 字）', tokens: 520 },
  { role: 'tool', type: 'role-tool', text: '[搜索航班] 找到 23 个结果：国航 CA925 ¥3200、全日空 NH980 ¥4100、春秋 9C8515 ¥1800…（完整列表 600 字）', tokens: 480 },
  { role: 'assistant', type: 'role-assistant', text: '航班方面，最推荐国航 CA925，性价比最高。以下是详细对比分析…（详细 500 字）', tokens: 380 },
  { role: 'user', type: 'role-user', text: '国航那个可以，帮我查下箱根的温泉酒店。', tokens: 32 },
  { role: 'tool', type: 'role-tool', text: '[搜索酒店] 箱根地区温泉酒店 15 个结果：强罗花坛 ¥1200/晚、吟游 ¥2800/晚…（完整列表 500 字）', tokens: 420 },
  { role: 'assistant', type: 'role-assistant', text: '推荐强罗花坛，性价比最高，含私汤和怀石料理。以下是详细评测…（详细 600 字）', tokens: 450 },
  { role: 'user', type: 'role-user', text: '强罗花坛不错，就定这个。帮我把完整行程整理一下。', tokens: 38 }
];

var strategies = [
  { name: '原始', actions: ['keep','keep','keep','keep','keep','keep','keep','keep','keep'] },
  { name: '删旧工具', actions: ['keep','keep','keep','delete','keep','keep','delete','keep','keep'] },
  { name: '压缩AI输出', actions: ['keep','keep','compress','delete','compress','keep','delete','compress','keep'] },
  { name: '激进全压', actions: ['keep','keep','compress','delete','compress','keep','delete','compress','keep'] }
];

var compressedTexts = {
  2: '[摘要] 推荐路线：东京3天+箱根2天+大阪2天',
  4: '[摘要] 推荐国航CA925航班，¥3200',
  7: '[摘要] 推荐箱根强罗花坛温泉酒店，¥1200/晚'
};

function applyStrategy(idx) {
  document.querySelectorAll('.strat-btn').forEach(function(b, i) {
    b.classList.toggle('active', i === idx);
  });
  var s = strategies[idx];
  var list = document.getElementById('msgList');
  var html = '';
  var totalTokens = 0, keptTokens = 0, savedTokens = 0;

  messages.forEach(function(m, i) {
    totalTokens += m.tokens;
    var action = s.actions[i];
    var cls = 'msg-item ' + m.type;
    var statusHtml = '';
    var displayText = m.text;

    if (action === 'keep') {
      cls += ' msg-keep';
      statusHtml = '<span class="status-tag"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><path d="M20 6L9 17l-5-5"/></svg> 保留</span>';
      keptTokens += m.tokens;
    } else if (action === 'compress') {
      cls += ' msg-compress';
      statusHtml = '<span class="status-tag">⚡ 压缩</span>';
      displayText = compressedTexts[i] || m.text;
      keptTokens += 30;
      savedTokens += m.tokens - 30;
    } else {
      cls += ' msg-delete';
      statusHtml = '<span class="status-tag"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg> 删除</span>';
      savedTokens += m.tokens;
    }

    html += '<div class="' + cls + '">';
    html += '<span class="role-tag">' + m.role + '</span>';
    html += '<span class="msg-text">' + displayText + '</span>';
    html += statusHtml;
    html += '</div>';
  });

  list.innerHTML = html;

  var statsBar = document.getElementById('statsBar');
  var savePct = totalTokens > 0 ? Math.round((savedTokens / totalTokens) * 100) : 0;
  statsBar.innerHTML = '<span class="stat-item">原始: <b>' + totalTokens + '</b> tokens</span>'
    + '<span class="stat-item">压缩后: <b style="color:var(--success)">' + keptTokens + '</b> tokens</span>'
    + '<span class="stat-item">节省: <b style="color:var(--accent)">' + savePct + '%</b></span>';
}

applyStrategy(0);
</script>
