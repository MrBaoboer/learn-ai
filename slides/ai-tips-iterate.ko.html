<script>

    ai:'저희 AI 고객 서비스 시스템은 첨단 인공지능 기술을 활용하여 기업에 지능형 고객 서비스 솔루션을 제공합니다. 시스템은 자연어 이해 능력을 갖추어 고객 의도를 정확히 파악하고 정밀한 답변을 제공합니다. 다중 채널 접속을 지원하며 24/7 무중단 서비스로 인건비를 크게 절감하고 고객 만족도를 높입니다.',

      body:'훨씬 좋아졌습니다! 이제 <strong>제품명, 데이터, 타깃 오디언스</strong>가 있습니다. 하지만 어조가 딱딱하고 기술 문서처럼 읽혀서 마케팅 카피의 느낌이 부족합니다. 여전히 <em>감정적 공명과 시나리오 몰입감</em>이 부족합니다.'}

    user:'내용 방향은 맞는데 어조가 너무 딱딱합니다. 이커머스를 잘 아는 친구가 추천하는 느낌으로 — 가볍지만 전문적으로 바꿔주세요.\n\n또 이커머스 고객 서비스의 페인 포인트를 짚는 첫 문장을 추가해주세요. 100자 이내로 유지해주세요.',

    scores:[90,85,90,92],

    ai:'아직도 고객 서비스 때문에 <span class="bad">머리를 쥐어뜯고</span> 있나요? <span class="bad">게임 체인저</span>가 왔습니다! XiaoMi — 번개 같은 5분 배포, AI가 여러분의 FAQ를 순식간에 흡수! 사전 판매 문의의 78% <span class="bad">완전 박살</span>! 경쟁사들이 허둥지둥할 때, <span class="bad">여러분의 AI는 이미 돈을 찍어내고 있습니다</span>. 망설이지 마세요 — <span class="bad">지금 바로 고객 서비스 혁명에 합류하세요</span>!',
    scores:[65,50,35,28],

      body:'<strong>다듬으면 다듬을수록 더 나빠집니다.</strong> 3라운드가 이미 좋았는데 한 라운드를 더 했습니다. 이제 "게임 체인저", "박살", "혁명"으로 가득 찼습니다 — <em>진심 어린 추천에서 다단계 마케팅 광고로 전락했습니다</em>. 데이터는 슬로건에 묻혔고 신뢰도가 급락했습니다.<br><br>문제는 AI가 아닙니다 — 여러분의 지시가 문제입니다: "더 강하게 치게" 와 "더 자극적으로"는 처음부터 잘못된 방향이었습니다.'}

      text:'<strong>Vibe Coding 시대의 핵심 역량: 하지 말아야 할 것을 아는 것이 해야 할 것을 아는 것보다 더 중요합니다.</strong>\n\n<em>Round 1→3</em>: 매 라운드마다 AI에게 새로운 정보(맥락, 데이터, 스타일 제약)를 주었고 품질은 계속 향상되었습니다.\n<em>Round 4</em>: 새로운 정보 없이 그냥 "더 좋게" 요구했고 — 잘 다듬어진 작품이 망가졌습니다.\n\n<strong style="color:var(--red)">멈춰야 할 신호:</strong>\n· 출력이 이미 <em>사용 가능</em>합니다 → 멈추고 다음 작업으로 넘어가세요\n· 무엇을 바꿔야 할지 말로 설명하기 어렵고, 그냥 "더 좋아질 것 같다"는 느낌만 있습니다 → 멈추세요\n· 수정한 버전이 이전보다 나쁩니다 → 즉시 되돌리세요\n\n<strong>세 라운드 안에 문제를 해결하면 고수입니다. 세 번째 라운드에서 더 진행하지 않고 멈출 수 있으면 최고 고수입니다.</strong>'

function barColor(v) {
  if (v >= 80) return 'var(--green)';
  if (v >= 55) return 'var(--amber)';
  return 'var(--red)';
}

function updateMeters(scores) {
  scores.forEach((s,i) => {
    const bar = document.getElementById('bar'+i);
    const val = document.getElementById('val'+i);
    bar.style.width = s + '%';
    bar.style.background = barColor(s);
    val.textContent = s;
    val.style.color = barColor(s);
  });
}

/* 자동 재생: 화면에 진입하면 라운드별 렌더링; playId로 "다시 시작"이 기존 재생 시퀀스를 중단 가능 */
let playId = 0;

function playRound(idx, myId) {
  if (myId !== playId || idx >= STEPS.length) return;
  const s = STEPS[idx];
  const chat = document.getElementById('chatPanel');

  if (s.final) {
    const box = document.createElement('div');
    box.className = 'final-box';
    box.style.background = s.finalContent.bg;
    box.style.border = '1.5px solid ' + s.finalContent.border;
    box.style.color = s.finalContent.color;
    box.innerHTML = s.finalContent.text.replace(/\n/g,'<br>');
    chat.appendChild(box);
    setTimeout(() => box.classList.add('show'), 50);
    return;
  }

  if (s.divider) {
    const div = document.createElement('div');
    div.className = 'round-divider';
    div.innerHTML = `<span class="round-badge" style="background:${s.divider.bg};color:${s.divider.color}">${s.divider.text}</span><div class="round-line"></div>`;
    chat.appendChild(div);
  }

  const userMsg = document.createElement('div');
  userMsg.className = 'msg msg-user';
  userMsg.innerHTML = `<div class="msg-lbl">당신이 말한 것</div>${s.user.replace(/\n/g,'<br>')}`;
  chat.appendChild(userMsg);
  setTimeout(() => userMsg.classList.add('show'), 50);

  setTimeout(() => {
    if (myId !== playId) return;
    const aiMsg = document.createElement('div');
    aiMsg.className = 'msg msg-ai';
    aiMsg.innerHTML = `<div class="msg-lbl">AI 출력</div>${s.ai.replace(/\n/g,'<br>')}`;
    chat.appendChild(aiMsg);
    setTimeout(() => aiMsg.classList.add('show'), 50);

    updateMeters(s.scores);

    setTimeout(() => {
      if (myId !== playId) return;
      const card = document.createElement('div');
      card.className = 'analysis-card';
      card.innerHTML = `<div class="ac-label" style="color:${s.analysis.color}">${s.analysis.label}</div><div class="ac-body">${s.analysis.body}</div>`;
      chat.appendChild(card);
      setTimeout(() => card.classList.add('show'), 50);

      // 1.2초 후 다음 라운드 재생
      setTimeout(() => playRound(idx + 1, myId), 1200);
    }, 700);
  }, 800);
}

function startDemo() {
  playId++;
  document.getElementById('chatPanel').innerHTML = '';
  [0,1,2,3].forEach(i => {
    document.getElementById('bar'+i).style.width = '0';
    document.getElementById('bar'+i).style.background = '#ccc';
    document.getElementById('val'+i).textContent = '—';
    document.getElementById('val'+i).style.color = 'var(--muted)';
  });
  playRound(0, playId);
}

function resetDemo() {
  startDemo();
}

lessonOnView(document.getElementById('chatPanel'), startDemo, 0.05);
</script>
