<style>
@keyframes _si{to{opacity:1}}
body{opacity:0;animation:_si .15s ease .08s forwards}

:root{
  --red:var(--danger);
  --green:var(--success);
  --surface:var(--card);
  --surface2:#f0ede6;
  --muted:var(--sub);
  --gray:#6b7280;
  --tips-accent:#0891b2;
}

.lesson-header h1 em{font-style:normal;color:var(--cyan)}

.boundary-layout{display:grid;grid-template-columns:1fr 1.1fr;gap:20px;align-items:start}

/* 四象限 */
.left-desc{font-size:14px;color:var(--sub);line-height:1.7;margin-bottom:12px}
.left-desc strong{color:var(--text)}
.quad-wrap{position:relative;display:flex;flex-direction:column}
.axis-label-y{position:absolute;left:-4px;top:50%;transform:translateY(-50%) rotate(-90deg);font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.5px;white-space:nowrap;z-index:2}
.axis-label-x{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.5px;z-index:2}
.quad-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-left:18px;margin-bottom:18px}
.quad{border-radius:12px;padding:16px 14px;border:2px solid;cursor:pointer;transition:all .25s;display:flex;flex-direction:column;gap:5px;min-height:110px}
.quad:hover{transform:scale(1.02);box-shadow:0 4px 16px rgba(0,0,0,.08)}
.quad.active{transform:scale(1.03);box-shadow:0 6px 24px rgba(0,0,0,.12)}
.quad-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:7px;font-size:11px;font-weight:800;width:fit-content}
.quad-title{font-size:15px;font-weight:800;line-height:1.3}
.quad-hint{font-size:12px;opacity:.75;line-height:1.4}

.q-safe{background:rgba(8,145,178,.06);border-color:rgba(8,145,178,.25);color:#0e7490}
.q-safe.active{border-color:#0891b2;background:rgba(8,145,178,.12)}
.q-safe .quad-badge{background:rgba(8,145,178,.18);color:#0e7490}
.q-danger{background:rgba(220,38,38,.06);border-color:rgba(220,38,38,.25);color:#991b1b}
.q-danger.active{border-color:#dc2626;background:rgba(220,38,38,.12)}
.q-danger .quad-badge{background:rgba(220,38,38,.18);color:#991b1b}
.q-feed{background:rgba(217,119,6,.06);border-color:rgba(217,119,6,.25);color:#92400e}
.q-feed.active{border-color:#d97706;background:rgba(217,119,6,.12)}
.q-feed .quad-badge{background:rgba(217,119,6,.18);color:#92400e}
.q-dream{background:rgba(107,114,128,.06);border-color:rgba(107,114,128,.25);color:#4b5563}
.q-dream.active{border-color:#6b7280;background:rgba(107,114,128,.12)}
.q-dream .quad-badge{background:rgba(107,114,128,.18);color:#4b5563}

/* 详情面板 */
.detail-panel{display:flex;flex-direction:column;gap:10px}
.detail-header{display:flex;align-items:center;gap:10px}
.detail-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.detail-title{font-size:18px;font-weight:800;color:var(--text)}
.detail-sub{font-size:12px;margin-top:2px}

.detail-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
.dc-label{font-size:11px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;margin-bottom:6px}
.dc-body{font-size:14px;color:var(--sub);line-height:1.7}
.dc-body strong{color:var(--text)}

.example-list{display:flex;flex-direction:column;gap:6px}
.example-item{display:flex;align-items:flex-start;gap:8px;font-size:14px;color:var(--sub);line-height:1.5}
.example-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-top:7px}

.strategy-box{border-radius:12px;padding:14px 16px;font-size:14px;line-height:1.7}
.strategy-box strong{font-weight:800}

.tip-box{display:flex;gap:8px;padding:12px 14px;border-radius:10px;font-size:13px;line-height:1.6}
.tip-icon{flex-shrink:0;font-size:14px;margin-top:1px}

@media (max-width:768px){
  .boundary-layout{grid-template-columns:1fr}
  .quad{min-height:96px}
}
</style>

<body>
<article class="lesson wide">
  <header class="lesson-header">
    <div class="kicker">實用技巧</div>
    <h1>人機知識邊界：<em>四象限策略</em></h1>
    <p class="subtitle">先判斷問題在哪個區，再決定怎麼用 AI。每次用 AI 之前，先想一個問題：<strong style="color:var(--text)">這個答案，我能驗證嗎？</strong></p>
  </header><!--seo:begin--><aside class="xa-tldr"><span class="xa-tldr-tag">一句話速覽</span><p>什麼交給 AI、什麼自己來，用四象限快速判斷任務分配</p></aside><!--seo:end-->  <div class="boundary-layout paywall-locked xa-peek">
    <div>
      <div class="sec-label">點擊象限查看詳情</div>
      <div class="quad-wrap">
        <div class="axis-label-y">AI 能力 ↑</div>
        <div class="axis-label-x">← 你懂 · · · · · · · · 你不懂 →</div>
        <div class="quad-grid">
          <div class="quad q-safe active" onclick="showDetail(0)">
            <div class="quad-badge">放心用</div>
            <div class="quad-title">共識區</div>
            <div class="quad-hint">你知道，AI 也知道</div>
          </div>
          <div class="quad q-danger" onclick="showDetail(1)">
            <div class="quad-badge">必須核查！</div>
            <div class="quad-title">高危探索區</div>
            <div class="quad-hint">你不懂，AI "可能"知道</div>
          </div>
          <div class="quad q-feed" onclick="showDetail(2)">
            <div class="quad-badge">投餵它</div>
            <div class="quad-title">盲區</div>
            <div class="quad-hint">你知道，AI 不知道</div>
          </div>
          <div class="quad q-dream" onclick="showDetail(3)">
            <div class="quad-badge">別想了</div>
            <div class="quad-title">未知區</div>
            <div class="quad-hint">誰都不知道</div>
          </div>
        </div>
      </div>
    </div>
    <div>
      <div class="sec-label">象限詳情</div>
      <div class="detail-panel" id="detailPanel"></div>
    </div>
  </div>
</article>
<script>
const DETAILS = [
  {
    icon:'✅', iconBg:'rgba(8,145,178,.1)', color:'#0e7490', accent:'var(--tips-accent)',
    title:'共識區 · 放心用', sub:'AI 的舒適區，高效助理，極少出錯',
    desc:'你已經掌握相關知識，AI 也在這些領域表現優異。輸出質素高，你還能輕鬆驗證結果。',
    examples:[
      {text:'<strong>翻譯潤色</strong> — 中英互譯、語法糾錯、改寫風格', color:'#0891b2'},
      {text:'<strong>文本摘要</strong> — 長文章提煉要點、會議記錄整理', color:'#0891b2'},
      {text:'<strong>格式轉換</strong> — Markdown 轉表格、JSON 轉 CSV', color:'#0891b2'},
      {text:'<strong>頭腦風暴</strong> — 列出方案選項、發散思路', color:'#0891b2'},
      {text:'<strong>寫郵件 / 週報</strong> — 給個框架，快速起草', color:'#0891b2'},
    ],
    strategy:{bg:'rgba(8,145,178,.06)',border:'rgba(8,145,178,.2)',color:'#0e7490',
      text:'<strong>策略：大膽用，提高效率。</strong>這些任務你本來就會做，AI 幫你做得更快更好。偶爾檢查一下就行。'},
    tip:{bg:'rgba(8,145,178,.06)',icon:'💡',text:'<strong>訣竅：</strong>越是你自己熟悉的領域，AI 的輔助價值越高 — 因為你能一眼看出它哪裏不對。'}
  },
  {
    icon:'⚠️', iconBg:'rgba(220,38,38,.1)', color:'#991b1b', accent:'var(--red)',
    title:'高危探索區 · 必須核查', sub:'幻覺重災區，容易瞎編，長尾知識最危險',
    desc:'你不懂這個領域，無法判斷 AI 説的對不對。而 AI 在這類長尾知識上經常編造 — <strong>而且編得非常自信。</strong>',
    examples:[
      {text:'<strong>法律法規</strong> — 會編造不存在的法條、條文號', color:'#dc2626'},
      {text:'<strong>醫療建議</strong> — 藥物劑量、診斷建議可能致命', color:'#dc2626'},
      {text:'<strong>學術引用</strong> — 論文標題、作者、DOI 全是假的', color:'#dc2626'},
      {text:'<strong>具體數據</strong> — 市場數據、統計數字經常編造', color:'#dc2626'},
      {text:'<strong>人物事件</strong> — 張冠李戴，混淆時間綫', color:'#dc2626'},
    ],
    strategy:{bg:'rgba(220,38,38,.06)',border:'rgba(220,38,38,.2)',color:'#991b1b',
      text:'<strong>策略：可以探索，但絕不能直接採信。</strong>把 AI 當"綫索生成器"，它給的方向可以參考，但每一個事實都必須找專業來源交叉驗證。'},
    tip:{bg:'rgba(220,38,38,.06)',icon:'🚨',text:'<strong>紅綫：</strong>AI 的"自信"程度和"準確"程度完全無關。它編的時候跟説真話一樣流暢。你驗證不了的答案 = 最危險的答案。'}
  },
  {
    icon:'📥', iconBg:'rgba(217,119,6,.1)', color:'#92400e', accent:'var(--amber)',
    title:'盲區 · 投餵它', sub:'私有數據只有你有，必須主動餵給 AI',
    desc:'AI 的訓練數據裏沒有你的私有資訊。不告訴它，它就不知道 — 它會用公開知識"猜"，往往猜錯。',
    examples:[
      {text:'<strong>公司內部文檔</strong> — 產品規格、組織架構、業務流程', color:'#d97706'},
      {text:'<strong>項目上下文</strong> — 當前進度、歷史決策、團隊約定', color:'#d97706'},
      {text:'<strong>個人偏好</strong> — 你喜歡的風格、你的寫作習慣', color:'#d97706'},
      {text:'<strong>行業 know-how</strong> — 你所在領域的潛規則和經驗', color:'#d97706'},
      {text:'<strong>最新動態</strong> — 今天的會議結論、剛發佈的政策', color:'#d97706'},
    ],
    strategy:{bg:'rgba(217,119,6,.06)',border:'rgba(217,119,6,.2)',color:'#92400e',
      text:'<strong>策略：把背景資訊貼上對話。</strong>不要指望 AI 猜對你的上下文。把文檔、數據、要求全貼上去，AI 就能在你的框架裏工作。'},
    tip:{bg:'rgba(217,119,6,.06)',icon:'📋',text:'<strong>技巧：</strong>把背景資訊寫成"參考資料"放在對話開頭。AI 讀到的上下文越完整，輸出越貼合你的實際需求。'}
  },
  {
    icon:'🚫', iconBg:'rgba(107,114,128,.1)', color:'#4b5563', accent:'var(--gray)',
    title:'未知區 · 別想了', sub:'純粹噪音，誰都不知道的事情問 AI 沒用',
    desc:'這類問題根本沒有正確答案。AI 不會説"我不知道"，它會生成一段看起來合理的廢話 — 千萬別信。',
    examples:[
      {text:'<strong>預測未來</strong> — 明天股價、下個月市場走勢', color:'#6b7280'},
      {text:'<strong>未公開資訊</strong> — 競爭對手的內部數據', color:'#6b7280'},
      {text:'<strong>真正的未知</strong> — 沒有人研究過的問題', color:'#6b7280'},
      {text:'<strong>主觀判斷</strong> — "我該不該辭職"（AI 沒有你的人生經驗）', color:'#6b7280'},
      {text:'<strong>即時資訊</strong> — 此刻的天氣、交通（除非接了工具）', color:'#6b7280'},
    ],
    strategy:{bg:'rgba(107,114,128,.06)',border:'rgba(107,114,128,.2)',color:'#4b5563',
      text:'<strong>策略：直接放棄，不要問 AI。</strong>這種問題 AI 一定會給你一個答案 — 但那個答案是"編"出來的。不如直接找人、查數據源、或者承認"現在沒答案"。'},
    tip:{bg:'rgba(107,114,128,.06)',icon:'🧠',text:'<strong>記住：</strong>AI 沒有"不知道"這個回答。它被訓練成"一定要回答"，所以越是它不該回答的問題，它答得越像那麼回事。'}
  }
];

function showDetail(idx) {
  document.querySelectorAll('.quad').forEach((q,i) => q.classList.toggle('active', i===idx));
  const d = DETAILS[idx];
  const panel = document.getElementById('detailPanel');
  let exHtml = d.examples.map(e =>
    `<div class="example-item"><div class="example-dot" style="background:${e.color}"></div><span>${e.text}</span></div>`
  ).join('');

  panel.innerHTML = `
    <div class="detail-header">
      <div class="detail-icon" style="background:${d.iconBg};font-size:22px">${d.icon}</div>
      <div>
        <div class="detail-title">${d.title}</div>
        <div class="detail-sub" style="color:${d.color}">${d.sub}</div>
      </div>
    </div>
    <div class="detail-card">
      <div class="dc-label" style="color:${d.color}">場景説明</div>
      <div class="dc-body">${d.desc}</div>
    </div>
    <div class="detail-card">
      <div class="dc-label" style="color:${d.color}">典型場景</div>
      <div class="example-list">${exHtml}</div>
    </div>
    <div class="strategy-box" style="background:${d.strategy.bg};border:1.5px solid ${d.strategy.border};color:${d.strategy.color}">
      ${d.strategy.text}
    </div>
    <div class="tip-box" style="background:${d.tip.bg}">
      <div class="tip-icon">${d.tip.icon}</div>
      <div style="color:${d.color};line-height:1.6">${d.tip.text}</div>
    </div>
  `;
}
showDetail(0);
</script>
