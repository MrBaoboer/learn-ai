  </header><!--seo:begin--><aside class="xa-tldr"><span class="xa-tldr-tag">一句話速覽</span><p>每題附考察意圖、答題框架與加分點：陣列 vs 鏈表 / 哈希碰撞 / 樹的遍歷 / 緩存設計 / 向量檢索 / 場景選型</p></aside><!--seo:end-->  <section class="paywall-locked xa-peek">

<script>
const QUESTIONS = [
  // ── 本質：數據結構 = 收納方式（2 題）──
  {who:'hr',
   q:'「你履歷寫住識數據結構。唔好傾程式碼，用一句人話同我講：數據結構到底係咩，解決咩問題？」',
   intent:'開場熱身題，考的是你有沒有把數據結構<strong>內化成直覺</strong>而不是一堆定義。背名詞的人會開始背「數據的組織、管理和存儲格式」這類教科書句子；真懂的人會給一個生活隱喻，然後把「組織方式決定操作快慢」這個核心講出來。',
   frame:['<strong>先給本質：</strong>數據結構就是數據的收納方式。同一堆東西，扔抽屜裏和分格擺好，找起來的速度天差地別。',
     '<strong>點出核心矛盾：</strong>沒有萬能的收納方式，每種結構都是拿一種代價換一種好處——陣列查得快但插入貴，鏈表插入快但查找慢。',
     '<strong>説清它解決什麼：</strong>它決定同樣的數據量下，程式是毫秒級響應還是幾秒卡死。數據小的時候怎麼放都行，數據一大差距就出來了。',
     '<strong>落到 AI 場景：</strong>message list 是陣列、KV Cache 是緩存、RAG 檢索是向量近鄰——大模型肚子裏裝的全是這些結構。'],
   bonus:'主動講一句「揀數據結構本質係揀取捨，先問清楚呢堆數據最高頻嘅操作係查、係插定刪，再傾用咩裝」。能把選型邏輯説在前面的人，比能背八種結構的人稀缺得多。',
   refs:[{href:'ds-1.html',label:'數據結構 = 收納方式'},{href:'ds-summary.html',label:'八種結構決策表'}]},

  {who:'boss',
   q:'「AI 都寫到程式碼喇，你哋仲要花時間學咩數據結構？呢筆錢同時間值唔值得花？」',
   intent:'老闆不是在質疑你，是在<strong>要一個投入產出的解釋</strong>。答「基礎很重要」是廢話；真懂的人會把「AI 寫程式碼」和「人驗收程式碼」拆開，告訴老闆不懂結構的團隊會把慢程式碼直接上綫，出事時才發現沒人看得懂。',
   frame:['<strong>先給結論：</strong>正因為 AI 在寫程式碼，人的角色從「寫」變成了「驗收」——不懂數據結構，就沒有驗收能力，等於閉眼簽字。',
     '<strong>給一個具體風險：</strong>AI 為了通用經常給出能跑但很慢的實現，比如該用哈希表的地方用了雙重循環。Demo 階段看不出來，用戶量一上來直接卡死。',
     '<strong>算一筆賬：</strong>上綫後返工的成本是開發階段發現的十倍以上，還要搭上用戶流失。學結構花的是小時級時間，防的是事故級損失。',
     '<strong>給行動承諾：</strong>我們不是去背課本，是學到能對 AI 的程式碼問出「為什麼選這個結構、數據量翻十倍還行不行」這兩個問題的程度。'],
   bonus:'補一句「我哋已經喺度用：每次等 AI 寫完程式碼，都會要求佢自己解釋揀嘅結構並畀出替代方案對比」，把學習成果落到看得見的工作流程上，老闆要的就是這個。',
   refs:[{href:'ds-1.html',label:'為什麼還要懂數據結構'},{href:'ds-build.html',label:'實戰：驗收 AI 的程式碼'}]},

  // ── 陣列與 message list（3 題）──
  {who:'hr',
   q:'「你同 ChatGPT 嘅對話紀錄，喺系統裏面用咩結構存？點解用佢？」',
   intent:'考你能不能把大模型原理篇的 message list 和數據結構<strong>串起來</strong>。背名詞的人只會説「陣列吧」就沒了下文；真懂的人能講出對話場景的操作特徵——按順序追加、按順序整體讀——和陣列的強項剛好咬合。',
   frame:['<strong>先給答案：</strong>message list 就是一個陣列：system、user、assistant 消息按時間順序一格一格排好，新消息永遠追加在尾部。',
     '<strong>解釋為什麼合適：</strong>對話的操作模式是「尾部追加 + 從頭到尾整體讀」，這恰好是陣列最便宜的兩個操作；幾乎不需要在中間插入或刪除。',
     '<strong>補上機制細節：</strong>每次請求都是把整個陣列重新發給模型，模型按下標順序讀——順序就是語義，誰先誰後不能亂，這也是陣列保序特性的價值。',
     '<strong>落到工程：</strong>理解這一點後，RAG、記憶、截斷這些操作的本質都清楚了——全是在這個陣列上做增刪改。'],
   bonus:'指出陣列按順序整體讀還對性能友好：記憶體連續、緩存命中率高。能從「功能合適」講到「物理層面也快」，説明你理解的不止是 API 表面。',
   refs:[{href:'ds-2.html',label:'陣列與 message list'}]},

  {who:'hr',
   q:'「對話太長超出上下文窗口就要截斷。點解業界通行做法係掐頭唔掐尾——掉舊訊息、留新訊息？」',
   intent:'考你對<strong>截斷策略背後的取捨</strong>有沒有想過。背名詞的人只會重複「滑動窗口」四個字；真懂的人能説出「近因性 + 陣列頭部刪除的語義」兩層理由，還知道 system prompt 是例外，必須釘在頭部不動。',
   frame:['<strong>先給結論：</strong>因為對話的信息價值分佈不均：最近幾輪和當前問題最相關，最早的寒暄早就失效了。掐頭保尾符合「近的重要」這個基本規律。',
     '<strong>點出例外：</strong>system prompt 是全局規則，不管多長都必須保留，所以實際做法是「釘住頭部的 system + 滑動保留最近 N 輪」，掐的是中間偏早的部分。',
     '<strong>説清代價：</strong>被掐掉的信息模型就真的看不見了——用戶三十輪前説過的預算、偏好會突然「失憶」。這不是 bug，是截斷的必然代價。',
     '<strong>給緩解方案：</strong>重要信息不能只靠留在原文裏，要摘要成短句放進 system，或者存到外部記憶按需檢索回來。'],
   bonus:'能報出真實量級更有説服力：一輪正常對話幾百 Token，窗口 128K 也就撐幾百輪重對話；再提一句截斷點最好落在完整的一輪邊界上，從消息中間切斷會讓模型讀到半句話。',
   refs:[{href:'ds-2.html',label:'上下文截斷'},{href:'ds-6.html',label:'緩存與 KV Cache'}]},

  {who:'dev',
   q:'「你呢個需求要喺對話紀錄第 3 條嗰度插入一條提示訊息。你知唔知喺陣列中間插一條數據，電腦實際要做幾多嘢？」',
   intent:'技術同事在試探你<strong>提需求時懂不懂代價</strong>。背名詞的人以為插入就是「放進去」一個動作；真懂的人知道陣列中間插入意味着後面所有元素集體後移，是 O(n) 操作，還會順勢問一句「這個插入是高頻還是一次性的」。',
   frame:['<strong>先接住問題：</strong>知道——陣列記憶體連續，往第 3 格插入，第 3 格之後的所有元素都要整體往後挪一位，數據越多挪得越久，是 O(n) 的操作。',
     '<strong>評估實際影響：</strong>但要看頻率和規模：對話歷史通常幾十到幾百條，一次性插入的成本毫秒級都不到，工程上完全可接受。',
     '<strong>給出替代思路：</strong>如果這類插入是高頻操作，那要重新設計：比如提示消息不進歷史陣列，而是在每次請求組裝時動態拼接，歷史本身保持只追加。',
     '<strong>確認真實意圖：</strong>反問一句這條消息要不要持久化、要不要讓模型每輪都看到——答案不同，實現位置完全不同。'],
   bonus:'能主動分辨「數據結構上的貴」和「業務上的貴」：中間插入對百萬級陣列是災難，對幾百條的 message list 無所謂。有量級感的 PM，技術同事才願意和你討論方案。',
   refs:[{href:'ds-2.html',label:'陣列中間插入的代價'},{href:'ds-summary.html',label:'八種結構決策表'}]},

  // ── 陣列 vs 鏈表（1 題）──
  {who:'hr',
   q:'「陣列同鏈表係最常攞嚟對比嗰對。佢哋根本分別係咩？各自舉一個 AI 產品裏面應該用邊個嘅場景。」',
   intent:'經典選型題，考的不是定義而是<strong>取捨思維</strong>。背名詞的人會背「陣列連續、鏈表離散」然後卡住；真懂的人會用「按下標直達 vs 順藤摸瓜」講清訪問差異，再自然地落到場景——考官等的是後半段。',
   frame:['<strong>先給根本區別：</strong>陣列在記憶體裏連續排列，按下標直達任何位置，O(1)；鏈表每個節點存着下一個的地址，找第 N 個要順藤摸瓜走 N 步，O(n)。',
     '<strong>反過來看寫入：</strong>鏈表在已知位置插入刪除只改兩根指針，O(1)；陣列中間插入要整體搬家，O(n)。兩者優缺點剛好互補。',
     '<strong>陣列的場景：</strong>message list——追加在尾、整體順序讀、按序號定位，全是陣列的強項。',
     '<strong>鏈表的場景：</strong>頻繁在中間增刪、不需要隨機存取的場合，比如 LRU 緩存的淘汰順序維護，用雙向鏈表移動節點是 O(1)。'],
   bonus:'補一刀現實感：現代工程裏裸鏈表用得越來越少，因為陣列的緩存局部性太強，中等規模下搬家成本反而比指針跳轉便宜。知道「教科書結論和工程實測會打架」，是加分中的加分。',
   refs:[{href:'ds-2.html',label:'陣列與插入代價'},{href:'ds-summary.html',label:'八種結構決策表'}]},

  // ── 棧（3 題）──
  {who:'hr',
   q:'「Cmd+Z 撤銷、瀏覽器後退、函式調用，呢三件事背後係同一種數據結構。係咩？佢條規則點解啱晒呢三件事？」',
   intent:'考你能不能從三個表象<strong>抽出同一個模型</strong>。背名詞的人會答「棧，後進先出」就停了；真懂的人能説出這三個場景的共性——「最近發生的最先被處理」——再解釋為什麼這個共性天然對應棧的規則。',
   frame:['<strong>先給答案：</strong>是棧，規則只有一條：後進先出，永遠只操作最頂上那個。',
     '<strong>抽出共性：</strong>這三件事的需求都是「按發生順序的倒序處理」——撤銷要先撤最近的編輯，後退要回最近的頁面，函式返回要先回最近的調用者。',
     '<strong>展開一個例子：</strong>每次編輯壓一條記錄進棧，Cmd+Z 彈出棧頂恢復；做過的事像摞盤子，取的時候只能從最上面拿——順序天然就對。',
     '<strong>落到 AI：</strong>Agent 拆子任務也是壓棧：主任務掛起、子任務先做完彈出、再回來繼續。理解棧，就理解了 Agent 的任務嵌套。'],
   bonus:'提一句「重做（Cmd+Shift+Z）需要第二個棧：撤銷時彈出的記錄壓進重做棧」。用兩個棧解釋一對互逆操作，考官立刻知道你不是只背了定義。',
   refs:[{href:'ds-3.html',label:'棧：撤銷與調用'}]},

  {who:'dev',
   q:'「尋晚 Agent 遞歸拆任務拆到服務爆咗，日誌裏面全是 stack overflow。你作為需求方，知唔知『爆棧』到底爆緊咩？」',
   intent:'技術同事在確認你<strong>能不能理解事故根因</strong>，而不是聽完點頭。背名詞的人只知道「棧溢出=程式崩了」；真懂的人能講出調用棧的機制——每層調用都佔一格棧空間，沒有終止條件就無限壓棧，直到把固定大小的棧壓穿。',
   frame:['<strong>先答機制：</strong>爆的是調用棧。每發生一層函式調用，就往棧裏壓一幀記錄現場；調用返回才彈出。棧空間是固定的，遞歸沒有終止條件就一直壓不彈，壓滿即崩。',
     '<strong>對應到事故：</strong>Agent 拆任務就是遞歸：任務拆子任務、子任務再拆。如果沒設「拆到什麼程度停」的基綫條件，它會無限拆下去，每層都佔一幀。',
     '<strong>給出產品側動作：</strong>這不只是程式碼 bug，需求裏就該寫清約束：最大拆解深度、單任務超時、總步數上限，三道保險。',
     '<strong>補上驗收標準：</strong>以後這類功能上綫前，驗收用例裏必須有「給一個永遠拆不完的任務」的極端場景測試。'],
   bonus:'能説出「深度限制設多少要看業務：任務樹正常三四層就夠，限制設 10 層既容住正常情況又能快速攔住失控」，説明你不但懂機制，還能把機制翻譯成可靠的參數。',
   refs:[{href:'ds-3.html',label:'棧與爆棧'},{href:'algo-6.html',label:'遞歸三要素'}]},

  {who:'boss',
   q:'「用戶投訴我哋編輯器淨係撤銷到一步，競品可以撤銷五十步。呢個功能好難做咩？要做幾耐？」',
   intent:'老闆要的是<strong>難度判斷和排期承諾</strong>，不是技術課。答「我問問技術」不及格；真懂的人知道多級撤銷就是把棧加深，本身不難，難點在每步「快照」存多大——這決定了記憶體成本和實現工作量。',
   frame:['<strong>先給結論：</strong>不難，這是成熟方案：撤銷本來就是棧結構，多級撤銷就是把只存一步改成存 N 步，主流編輯器都這麼做。',
     '<strong>指出真正的成本點：</strong>關鍵在每步存什麼——存整個文檔快照最簡單但費記憶體，存增量差異省記憶體但實現複雜。五十步的深度決定了必須用增量方案。',
     '<strong>給排期邏輯：</strong>基礎版（增量記錄 + 雙棧支持重做）預計一個迭代內；邊界情況如協同編輯下的撤銷會複雜一檔，可以放二期。',
     '<strong>順手挖需求：</strong>確認一下用戶要的是不是其實是「誤操作恢復」——如果是，配合歷史版本功能一起做，價值更大。'],
   bonus:'提一句「五十步是顯示給用戶的承諾，內部實現按記憶體預算動態截斷舊記錄就行，用戶永遠撤不到第五十步之前」——把技術彈性藏在產品承諾後面，老闆會覺得你考慮得很成熟。',
   refs:[{href:'ds-3.html',label:'棧：撤銷與調用'}]},

  // ── 隊列（3 題）──
  {who:'hr',
   q:'「棧同隊列淨係差一個字：一個後進先出、一個先進先出。就咁少分別，點解夠佢哋用喺完全唔同嘅場景？」',
   intent:'考你是否理解<strong>順序規則和公平性的關係</strong>。背名詞的人只會重複 LIFO/FIFO 的縮寫；真懂的人能講出隊列的先進先出保證「先來的先被服務」，這是任務調度、排隊系統的公平底綫，而棧的場景恰恰要「最近優先」。',
   frame:['<strong>先給本質：</strong>區別就是出口方向：棧從同一端進出（最近優先），隊列從一端進另一端出（先來先服務）。一個字的差異，語義完全相反。',
     '<strong>隊列的適用面：</strong>凡是「請求到達速度和處理速度不匹配」的地方都需要隊列：用戶請求排隊、消息隊列、列印任務——先來的先辦，誰也不插隊。',
     '<strong>棧的適用面：</strong>凡是「要按倒序回溯」的地方用棧：撤銷、函式返回、任務嵌套——最近的先處理。',
     '<strong>給一個對照：</strong>Agent 的待辦任務用隊列（按計劃順序執行），Agent 的任務嵌套用棧（子任務先完成再回主綫）——同一個系統裏兩者各管一段。'],
   bonus:'補一句「選錯的後果很具體：任務調度誤用棧會讓早期任務被無限餓死，新任務源源不斷壓在上面，老任務永遠輪不到」。能説出「餓死」這個詞，考官知道你見過真系統。',
   refs:[{href:'ds-4.html',label:'隊列與任務調度'},{href:'ds-3.html',label:'棧：撤銷與調用'}]},

  {who:'boss',
   q:'「點解我哋嘅 AI 客服平時好好哋，一到大促就打圈？技術口中嘅『削峯』，呢個係削咩？加機器可唔可以直接解決？」',
   intent:'老闆要一個<strong>聽得懂的解釋加一個決策依據</strong>。背名詞的人説「消息隊列削峯填谷」等於沒説；真懂的人會用銀行窗口的比喻講清楚：櫃員數量固定，大促時來的人翻十倍，隊列的作用是讓人排隊而不是把銀行擠爆。',
   frame:['<strong>先給解釋：</strong>模型推理的處理能力是固定的，比如每秒 100 個請求；大促時湧進來每秒 1000 個。沒有隊列，多出來的 900 個直接把服務壓垮；有隊列，它們排隊等着，系統慢但不死。',
     '<strong>回答加機器：</strong>能緩解但不划算——按峯值配機器，平時 90% 的算力在閒置燒錢。正確做法是適度擴容 + 隊列兜底，讓峯值「排掉」而不是「頂掉」。',
     '<strong>把轉圈圈翻譯成指標：</strong>用戶看到的等待就是排隊時長。我們要盯的是隊列積壓量和最長等待時間，超閾值自動擴容或降級。',
     '<strong>給行動項：</strong>大促前壓測出真實處理上限，設好「排隊超 30 秒先給自動回覆安撫」的降級策略——體驗託底比硬扛便宜得多。'],
   bonus:'報一個成本對比：按峯值擴容可能要十倍機器錢，隊列 + 彈性擴容通常兩三成成本就能扛住。老闆聽到具體的省錢比例，比聽到任何術語都安心。',
   refs:[{href:'ds-4.html',label:'隊列與削峯'},{href:'ds-6.html',label:'緩存省錢'}]},

  {who:'dev',
   q:'「你要求批量任務『來幾多收幾多，後台慢慢跑』。得，咁我問你：生產速度一路大過消費速度，呢條隊列最後會點？」',
   intent:'技術同事在檢驗你<strong>有沒有想過系統的極限狀態</strong>。背名詞的人以為隊列是無限大的魔法緩衝區；真懂的人知道積壓只增不減的隊列遲早吃光記憶體或磁盤，必須回答「上限設多少、滿了怎麼辦」。',
   frame:['<strong>先承認問題：</strong>會無限積壓直到資源耗盡——隊列只能緩衝脈衝式的高峯，救不了持續的供需失衡。生產長期大於消費，隊列就是個定時炸彈。',
     '<strong>給出三個閥門：</strong>限流（隊列到上限就拒絕新任務並提示稍後再試）、擴容（消費者數量根據積壓量自動伸縮）、丟棄或降級（低優先級任務超時自動放棄）。',
     '<strong>從產品側配合：</strong>需求裏我來定優先級規則——哪些任務用戶在等着必須先跑，哪些可以夜間跑，哪些積壓超一天就作廢。',
     '<strong>定監控指標：</strong>隊列長度和最老任務等待時長兩條告警綫，積壓趨勢不對提前介入，別等用戶來報。'],
   bonus:'主動補一句「消費者擴容還要注意任務順序和冪等：同一用戶的任務亂序執行或重複執行都會出 bug」。能想到擴容的副作用，技術同事會真正把你當成能對話的人。',
   refs:[{href:'ds-4.html',label:'生產者消費者'},{href:'ds-summary.html',label:'八種結構決策表'}]},

  // ── 哈希表（4 題）──
  {who:'hr',
   q:'「十億個用戶裏面查一個人嘅資料，幾乎瞬間返到。哈希表憑咩做到？佢到底慳咗咩？」',
   intent:'考哈希表的<strong>核心機制能不能講成人話</strong>。背名詞的人會説「哈希表是 O(1) 的」但説不出為什麼；真懂的人能講出「用計算代替查找」這個關鍵轉換——不是找得快，是根本不用找。',
   frame:['<strong>先給本質：</strong>它省掉的是「找」這個動作本身。普通查找要一個個對比；哈希表拿 key 一算，直接算出數據住在幾號桶，直達取貨。',
     '<strong>拆開機制：</strong>哈希函式把任意 key（用戶 ID、單詞）變成一個固定範圍的數字，這個數字就是存放位置。存的時候按它放，取的時候按它拿，兩頭用同一個函式，位置必然一致。',
     '<strong>點出代價：</strong>快是拿空間換的——要預留一大片桶位，而且數據在桶裏是亂序的，想按順序遍歷或者找「範圍內所有人」它無能為力。',
     '<strong>落到日常：</strong>Python 的 dict、JS 的對象、Redis，天天在用的都是它。AI 場景裏 KV Cache 的查找、詞表映射，底層也是哈希。'],
   bonus:'用一個對比釘死量級：十億條數據，挨個找平均要五億次對比，哈希一次計算直達——不是快幾倍，是快到不在一個物種。能把 O(n) 到 O(1) 講出畫面感，這題就滿分了。',
   refs:[{href:'ds-5.html',label:'哈希表原理'}]},

  {who:'hr',
   q:'「哈希函式再好都會有兩個唔同嘅 key 計出同一個位置。撞車發生嗰陣點算？撞得多會有咩後果？」',
   intent:'上一題的自然追問，考你對哈希表的理解<strong>有沒有第二層</strong>。背名詞的人到「鏈地址法」四個字就停了；真懂的人能講清掛鏈子的過程，並且知道惡化路徑——碰撞堆積會讓 O(1) 退化回 O(n)，哈希表名存實亡。',
   frame:['<strong>先正面回答：</strong>碰撞不可避免，標準解法是鏈地址法：同一個桶裏的多個 key 掛成一條小鏈表，查找時先定位到桶、再在鏈子上挨個對比。',
     '<strong>説清後果：</strong>鏈子短時無所謂，多對比兩三次而已；但如果大量 key 擠進少數桶，鏈子越來越長，查找退化成綫性掃描——號稱 O(1) 的表實際跑成 O(n)。',
     '<strong>給出成因：</strong>兩個誘因：哈希函式分佈不均（某些桶天生熱門），或裝載率過高（數據多桶少，想不撞都難）。',
     '<strong>給出對策：</strong>工程上靠監控裝載率、超閾值自動擴容重排來兜底；好的哈希函式讓 key 儘量均勻散開。'],
   bonus:'提一個真實攻擊案例：哈希碰撞攻擊——攻擊者故意構造大量同桶的 key 把服務拖死，所以現代語言的哈希函式要加隨機鹽。知道碰撞能變成安全問題，是罕見的深度信號。',
   refs:[{href:'ds-5.html',label:'哈希碰撞'}]},

  {who:'dev',
   q:'「你方案裏面話『用戶畫像放哈希表，即時查』。而家兩千萬用戶，聽年翻到兩億——擴容嗰一下會發生咩事，你心裏面有數未？」',
   intent:'技術同事在試探你知不知道<strong>哈希表的成長痛</strong>。背名詞的人以為哈希表自動變大無感知；真懂的人知道擴容意味着所有 key 重新哈希、整體搬家，是一次 O(n) 的大動作，綫上系統扛不住突然停頓。',
   frame:['<strong>先接住機制：</strong>有數——桶的數量變了，每個 key 算出的位置全變，擴容等於把兩千萬條數據全部重新哈希搬一遍家。搬家期間查詢要麼停要麼慢。',
     '<strong>給出工程答案：</strong>成熟方案是漸進式擴容：新舊兩張表並存，每次讀寫順手搬幾條，把一次大停頓攤薄成無數次小動作——Redis 就是這麼做的。',
     '<strong>再拔一層：</strong>如果是分佈式多機場景，還要用一致性哈希，讓擴容時只有小部分 key 需要遷移，而不是全體洗牌。',
     '<strong>回到產品側：</strong>我在需求裏補上容量規劃：按明年兩億的規模預估記憶體，和你們確認擴容窗口和演練計劃。'],
   bonus:'能説出「裝載率到 0.75 左右就該擴了，別等塞滿」這種具體閾值，或者主動問「我哋而家嘅裝載率係幾多」，技術同事立刻知道你不是來對暗號的。',
   refs:[{href:'ds-5.html',label:'哈希擴容'},{href:'ds-6.html',label:'緩存與失效'}]},

  {who:'boss',
   q:'「你上次話哈希表搵嘢快到不講理，咁不如我哋系統裏面所有數據都用哈希表存，唔就全部都快咗？」',
   intent:'老闆在用樸素邏輯推極端結論，考你<strong>敢不敢説不、能不能説清邊界</strong>。順着説「好」的人失職；真懂的人會先肯定直覺，再用兩三個哈希表幹不了的事（排序、範圍查詢、記憶體成本）把邊界畫出來。',
   frame:['<strong>先接住再轉折：</strong>查單條確實無敵，但哈希表是偏科生——它把「按 key 直達」練到滿分，代價是別的科目全放棄了。',
     '<strong>列出幹不了的事：</strong>它內部是亂序的：想按註冊時間排序、查「最近七天下單的用戶」這種範圍查詢，哈希表幫不上忙，還得靠有序結構。',
     '<strong>算記憶體賬：</strong>快是空間換的，桶位要預留、裝載率要壓低，全量數據塞哈希表記憶體成本會失控——所以實踐是熱數據放哈希（緩存），全量放數據庫。',
     '<strong>給決策版結論：</strong>正確姿勢是組合拳：高頻精確查找走哈希，排序和範圍走 B+ 樹類索引，各幹各擅長的活。'],
   bonus:'用一個類比收尾：「哈希表像快遞櫃，按單號取件極快，但你沒法讓快遞櫃『把包裹按大小排個序』」。老闆記住這個類比，下次就不會再提全用哈希表了。',
   refs:[{href:'ds-5.html',label:'哈希表的代價'},{href:'ds-summary.html',label:'八種結構決策表'}]},

  // ── 緩存（4 題）──
  {who:'hr',
   q:'「快取嘅諗法一句就講得完：計過嘅唔好再計。咁 KV Cache 快取緊咩？點解冇佢，大模型生成會慢到用唔成？」',
   intent:'考你能不能把緩存思想<strong>對接到大模型的具體機制</strong>。背名詞的人只會説「KV Cache 是緩存 Key 和 Value」的同義反復；真懂的人能講出不緩存的世界有多慘——每生成一個新 Token 都要把前文的注意力全部重算一遍。',
   frame:['<strong>先給緩存本質：</strong>緩存就是拿空間換時間：把算過的結果存起來，下次直接用，別重算。',
     '<strong>對接到生成過程：</strong>模型逐 Token 生成，每個新 Token 都要「看」前面所有 Token 的注意力中間結果。不緩存的話，生成第 1000 個 Token 時要把前 999 個的計算全部重做。',
     '<strong>説清 KV Cache 存什麼：</strong>它把每個已處理 Token 的 Key/Value 中間結果存在顯存裏，新 Token 直接查表複用，整段生成的計算量從平方級壓回綫性級。',
     '<strong>點出代價：</strong>顯存佔用隨上下文長度漲——長上下文又貴又吃顯存，一半原因就在這。緩存的老規矩：空間換時間，兩頭總得付一頭。'],
   bonus:'串一句跨章知識：API 廠商的 Prompt Caching 折扣（命中部分常見五折到九折）就是把這個機制變成了定價——system prompt 放開頭保持穩定就能反覆命中。能從機制講到帳單，説明真的打通了。',
   refs:[{href:'ds-6.html',label:'緩存與 KV Cache'},{href:'algo-2.html',label:'注意力的 O(n²) 帳單'}]},

  {who:'boss',
   q:'「今個月 AI 帳單又升咗 40%。技術提咗個詞叫『快取命中率』，話拉上去就慳到錢。到底慳幾多？你畀個數我。」',
   intent:'老闆要的是<strong>可承諾的數字</strong>，不是原理課。含糊説「能省不少」的人會被追問到啞口無言；真懂的人會現場把賬拆開：哪部分開銷可緩存、命中率現在多少、提到多少、對應省幾成，再給出提升命中率的具體動作。',
   frame:['<strong>先拆帳單結構：</strong>我們的開銷大頭是輸入 Token——每輪對話都要重發 system prompt 和歷史。這部分是重複計算，恰好是緩存能吃掉的。',
     '<strong>給出計算邏輯：</strong>以 Prompt Caching 為例，命中部分的輸入費率通常只有原價一到五折。如果輸入佔帳單 70%、命中率做到 60%，整體帳單大約能降兩到三成。',
     '<strong>給動作而不只是數字：</strong>提高命中率的做法很具體：把 system prompt 和固定知識放到消息最前面且保持字節級穩定，動態內容往後放——前綴穩定才能命中。',
     '<strong>再補第二層：</strong>高頻重複的用戶問題上語義緩存，相似問題直接返回緩存答案，連模型調用都省了。兩層加起來，下月帳單目標降 30%，我按周彙報命中率。'],
   bonus:'主動暴露一個風險：語義緩存省錢但有舊答案風險，知識更新後必須讓相關緩存失效，否則省了錢賠了口碑。老闆看到你連副作用都想好了，這個承諾才有分量。',
   refs:[{href:'ds-6.html',label:'緩存省錢'},{href:'ds-2.html',label:'message list 重發'}]},

  {who:'dev',
   q:'「你 PRD 裏面寫『加語義快取，相似問題直接回快取答案』。得啊，咁我問你：知識庫聽日更新咗，快取裏面嘅舊答案點算？失效策略你諗過未？」',
   intent:'緩存的經典送命題：<strong>失效</strong>。背名詞的人方案裏只有「加緩存」三個字，從沒想過刪；真懂的人知道緩存失效是計算機科學兩大難題之一，能給出主動失效、TTL、版本號至少兩種策略的組合。',
   frame:['<strong>先承認這是核心難點：</strong>想過——緩存最難的不是存是刪。舊答案比沒答案更糟，用戶拿着過期政策來投訴，鍋還是產品的。',
     '<strong>給出組合策略：</strong>三層：知識庫更新時主動清掉關聯緩存（按知識條目和緩存的映射關係精確失效）；全部緩存帶 TTL 過期時間兜底；知識庫大版本更新直接整體清空重來。',
     '<strong>處理語義緩存的特殊性：</strong>語義緩存按相似度命中，還要定閾值：相似度多高才算同一個問題。閾值鬆了張冠李戴，緊了命中率歸零，需要拿真實問題集調。',
     '<strong>給驗收標準：</strong>上綫指標兩條一起看：命中率（省錢）和緩存答案的正確率抽檢（保命），只看第一條就是在埋雷。'],
   bonus:'補一句「政策、價格類嘅高風險問題可以直接繞過快取，永遠即時查」——按風險分級決定誰可緩存，這個思路會讓技術同事覺得你對緩存的理解超過大多數 PM。',
   refs:[{href:'ds-6.html',label:'緩存失效'},{href:'ds-10.html',label:'向量與相似度'}]},

  {who:'hr',
   q:'「精確快取同語義快取，一字之差，判斷『算唔算同一個問題』嘅方式完全唔同。分別點樣判斷？各自嘅坑喺邊？」',
   intent:'考你對緩存 key 的理解<strong>有沒有到達語義層</strong>。背名詞的人説不清兩者邊界；真懂的人知道精確緩存按字串完全一致匹配（改一個字就失效），語義緩存靠 Embedding 相似度（能泛化但會誤傷），坑恰好互補。',
   frame:['<strong>先給兩種判斷方式：</strong>精確緩存拿請求原文做 key，一字不差才命中；語義緩存把問題變成向量，相似度超過閾值就算同一個問題。',
     '<strong>精確緩存的坑：</strong>命中條件太苛刻——「怎麼退款」和「如何退款」是兩個 key，用戶表達千變萬化，自然語言場景命中率低得可憐。',
     '<strong>語義緩存的坑：</strong>相似不等於相同——「怎麼退款」和「怎麼取消退款」向量很近、語義相反，閾值沒調好就把錯誤答案端給用戶。',
     '<strong>給選型結論：</strong>API 層前綴複用用精確邏輯（Prompt Caching），用戶問題去重用語義緩存加高閾值，高風險類目直接不緩存。'],
   bonus:'點出語義緩存的隱藏成本：每次查緩存都要先做一次 Embedding 調用，本身也花錢花時間——省的必須大於花的，這筆賬很多方案根本沒算過。',
   refs:[{href:'ds-6.html',label:'語義緩存'},{href:'ds-10.html',label:'Embedding 與相似度'}]},

  // ── 樹（3 題）──
  {who:'hr',
   q:'「檔案目錄、JSON、網頁 DOM、公司組織架構——點解呢啲嘢全部都長成樹？樹到底擅長表達咩？」',
   intent:'考你能不能<strong>從一堆例子裏説出共性</strong>。背名詞的人會背「樹是有根節點的分層結構」；真懂的人會點破：這些東西天然存在「包含與從屬」關係，一個父節點管多個子節點、每個子節點只有一個爹——這就是樹的定義本身。',
   frame:['<strong>先給共性：</strong>它們都是「包含」關係：資料夾包含文件、JSON 對象包含字段、頁面元素包含子元素。凡是一層包一層、每個成員只有一個直接上級的關係，畫出來必然是樹。',
     '<strong>説清樹的強項：</strong>層級導航和分而治之——從根出發每層做一次選擇就能定位任何節點，路徑即地址（文件路徑、DOM 選擇器都是這個原理）。',
     '<strong>給一個反例劃邊界：</strong>朋友關係、超連結網絡不是樹——一個人可以屬於多個圈子、有環路，那是圖。樹是圖的特例：無環、單親。',
     '<strong>落到 AI：</strong>Coding Agent 看你的項目就是看一棵文件樹，讀你的程式碼會解析成語法樹（AST）——它眼裏的世界是一棵套一棵的樹。'],
   bonus:'補一句「樹的深度決定查找步數：平衡的樹百萬節點二十步到底，退化成一條鏈就是百萬步——所以數據庫索引拼命保持樹的平衡」。把樹和 log n 掛上鈎，廣度立刻顯出來。',
   refs:[{href:'ds-7.html',label:'樹與 AST'},{href:'ds-8.html',label:'圖與 DAG'}]},

  {who:'dev',
   q:'「你話要 AI 將項目裏面所有舊函式名批量改走。直接全局字串替換唔得咩？點解工具非要先將程式碼解析成 AST 再改？」',
   intent:'這題在試探你<strong>懂不懂「文本」和「結構」的本質區別</strong>。背名詞的人覺得替換就是替換；真懂的人能舉出字串替換的車禍現場——把註釋裏、字串裏、同名局部變數全改了——AST 改的是語法節點，精確知道每個名字是什麼身份。',
   frame:['<strong>先給區別：</strong>字串替換把程式碼當一串字符，看見匹配就換；AST 先把程式碼解析成語法樹，每個名字都帶着身份——是函式名、變數名，還是註釋和字串裏的普通文字。',
     '<strong>舉車禍現場：</strong>全局替換 getData 會誤傷 getDataById、註釋裏的説明文字、字串裏的接口路徑；AST 只改「引用了那個函式定義」的節點，一個不多一個不少。',
     '<strong>點破本質：</strong>重構操作的對象是程式碼的結構而不是外觀。IDE 的重命名、ESLint 的檢查、Copilot 的程式碼理解，全部建立在 AST 上。',
     '<strong>回應場景：</strong>所以這個需求我會寫成「基於語法的重命名」，驗收標準裏加一條：字串和註釋內的同名文本不受影響。'],
   bonus:'提一句「AI 改程式碼偶爾會破壞語法，靠的兜底恰恰是 AST 解析失敗會立刻報錯——解析器是最便宜的第一道驗收」。能把 AST 説成質檢工具，視角就和工程師對齊了。',
   refs:[{href:'ds-7.html',label:'程式碼與 AST'},{href:'ds-build.html',label:'實戰：驗收 AI 的程式碼'}]},

  {who:'boss',
   q:'「我將成個項目丟畀 Coding Agent，佢幾秒鐘就講清我哋嘅程式碼結構。幾千個檔案喎，佢係咪全部讀過一遍？快得滯喎。」',
   intent:'老闆在表達驚訝，實際是想<strong>確認這能力的邊界和可信度</strong>。順着誇「AI 就是強」的人錯失機會；真懂的人會拆穿魔術：它沒有全讀，是沿着文件樹做了結構化探索——先看目錄骨架，再挑關鍵文件精讀。',
   frame:['<strong>先揭開魔術：</strong>它沒有全讀。項目是一棵文件樹，它先掃一遍目錄結構——相當於看書先看目錄——幾千個文件的骨架幾秒就掃完了。',
     '<strong>講清第二步：</strong>然後按綫索精讀少數關鍵節點：配置文件、入口文件、README。樹結構讓它每層排除大量無關分支，不用地毯式搜索。',
     '<strong>給出邊界：</strong>所以它對「項目大概什麼結構」很準，但沒讀過的深層實現細節它可能靠猜——問到具體業務邏輯時要讓它先讀了相關文件再回答。',
     '<strong>轉成價值：</strong>這個能力可以用起來：新人入職讓 Agent 生成項目導覽、評審外包程式碼先讓它畫結構圖，都是幾分鐘的事。'],
   bonus:'補一句「它讀單個程式碼文件時還會解析成語法樹來理解調用關係，所以能回答『這個函式被誰調用』這類結構問題」——把目錄樹和語法樹兩層都點到，解釋就完整了。',
   refs:[{href:'ds-7.html',label:'Coding Agent 眼裏的樹'},{href:'ds-1.html',label:'為什麼要懂結構'}]},

  // ── 圖（3 題）──
  {who:'hr',
   q:'「樹同圖長得幾似，都係節點連節點。佢哋分界綫喺邊？咩樣嘅業務關係一定要用圖嚟表達？」',
   intent:'考你對兩種結構<strong>邊界的把握</strong>。背名詞的人説「圖有環樹沒有」就完了；真懂的人能從關係的性質出發：一旦成員可以有多個上級、關係可以繞回來，樹就裝不下了，硬套樹模型會丟信息。',
   frame:['<strong>先給分界綫：</strong>樹是受限的圖：每個節點只有一個父節點、不存在環。突破任何一條——多個上級、或者關係能繞一圈回來——就必須用圖。',
     '<strong>給必須用圖的場景：</strong>社交關係（互相關注成環）、知識圖譜（一個實體連接無數實體）、微服務依賴（A 調 B、B 調 C、C 又調 A 就是事故）。',
     '<strong>説清圖多出的能力：</strong>圖能回答「兩點之間怎麼走、隔幾層、哪個節點最關鍵」這類關係問題——推薦系統的「好友的好友」、風控的關聯帳戶挖掘全靠它。',
     '<strong>落到 AI：</strong>多 Agent 協作的工作流是圖（嚴格説是 DAG），知識圖譜給 RAG 補充實體關係——圖是 AI 表達「關係」的母語。'],
   bonus:'補一句判斷口訣：「問一句呢個節點可以有幾個爹、關係會唔會繞返嚟——兩條問題任何一條答案係『會』，就上圖」。把選型壓縮成兩個問題，考官會記住你。',
   refs:[{href:'ds-8.html',label:'圖與 DAG'},{href:'ds-7.html',label:'樹與 AST'}]},

  {who:'dev',
   q:'「你畫呢個多 Agent 工作流，審核 Agent 嘅輸出又流返生成 Agent。我哋框架淨係接受 DAG，你知唔知點解一定要無環？」',
   intent:'技術同事在檢查你<strong>畫流程圖時腦子裏有沒有執行模型</strong>。背名詞的人不知道 DAG 的 A（無環）是硬約束；真懂的人明白有環意味着沒有確定的執行順序、可能無限循環，而「重試改稿」這類真實需求要用受控的循環次數來表達，不是在圖上畫圈。',
   frame:['<strong>先答為什麼：</strong>無環才有確定的執行順序——DAG 可以拓撲排序，誰先誰後、哪些能並行一目瞭然；一旦有環，調度器不知道從哪開始，跑起來可能無限打轉。',
     '<strong>接住真實需求：</strong>我畫那條迴流綫想表達的是「審核不通過要退回重寫」。這個需求合理，但表達方式錯了。',
     '<strong>給正確表達：</strong>把循環藏進節點內部：審核-重寫封裝成一個帶最大重試次數的子流程節點，比如最多改三稿，超次數走人工兜底——圖本身保持無環。',
     '<strong>補上成本意識：</strong>每次重試都是真金白銀的模型調用，重試上限和退出條件我寫進 PRD，不讓它變成燒錢的死循環。'],
   bonus:'提一句「無環還保證了可恢復性：DAG 掛在中間可以從斷點續跑，有環的流程崩了都不知道該回滾到哪」。能説到故障恢復，説明你對生產環境有敬畏。',
   refs:[{href:'ds-8.html',label:'DAG 工作流'},{href:'algo-6.html',label:'遞歸與終止條件'}]},

  {who:'boss',
   q:'「競品發佈會話佢哋用咗『知識圖譜增強嘅 AI』，聽落好勁。我哋係咪都要整一個？大概要投入幾多？」',
   intent:'老闆被概念營銷打動了，考你<strong>能不能把術語翻譯成投入產出</strong>。直接説「跟」或「不跟」都輕率；真懂的人會先講清知識圖譜到底補了向量檢索的什麼短板，再評估自家場景配不配得上它的建設成本。',
   frame:['<strong>先解釋是什麼：</strong>知識圖譜是把知識存成「實體-關係」的圖：誰是誰的子公司、哪個產品屬於哪個類目。它補的是向量檢索的短板——向量擅長「找相似」，圖譜擅長「查關係」和多步推理。',
     '<strong>給判斷標準：</strong>值不值得上，看我們的用戶問題裏有多少是關係型的：「A 公司旗下有哪些產品在打折」這種多跳問題多，圖譜就有價值；大部分是「怎麼退款」式的問答，向量 RAG 足夠。',
     '<strong>報投入量級：</strong>圖譜貴在建設和維護：實體抽取、關係清洗、持續更新，通常要專人維護數月起步，不是買個軟件的事。',
     '<strong>給行動建議：</strong>先拿一週分析歷史問題裏關係型查詢的佔比，超過兩成再立項做小範圍試點——用數據決定跟不跟，不用發佈會決定。'],
   bonus:'補一句「競品的『知識圖譜增強』很可能只是 GraphRAG 的輕量版，先搞清楚他們實際落地了多少再對標」——幫老闆把營銷話術打回原型，這是 PM 最值錢的時刻之一。',

   frame:['<strong>先接住機制：</strong>知道——詞表是按訓練語料的高頻組合建的，英語高頻詞一個 Token 搞定；語料少的語言只能拆成碎片，同樣語義的 Token 數翻兩三倍甚至更多。',

     '<strong>給產品動作：</strong>上綫前拿目標語言的真實語料實測 Token 膨脹率，重算成本模型和截斷閾值——不能拿英語的測算直接套。',
     '<strong>給備選方案：</strong>評估對目標語種詞表友好的模型（本地化模型往往有優勢），或者對長文場景先做摘要壓縮再進模型。'],
   bonus:'能報出實測方法：「拿 tiktoken 或目標模型的 tokenizer 跑一遍樣本語料，十分鐘就有膨脹係數」——給出低成本驗證路徑的人，比給出結論的人更讓工程師放心。',

  {who:'hr',
   q:'「RAG 檢索成日被描述成『搵最近嘅鄰居』。向量、相似度、最近鄰——用呢三個詞將 RAG 檢索嘅原理同我講通。」',
   intent:'收官必考題，考你能不能把語義檢索<strong>從玄學講成幾何</strong>。背名詞的人會在「語義相似」這個詞上打轉；真懂的人能講出 Embedding 把文字變座標、語義相近座標相近、檢索就是在座標空間裏量距離找最近的幾個點。',
   frame:['<strong>先給核心轉換：</strong>Embedding 模型把任何一段文字變成一串數字座標（向量），而且保證語義越接近的文字，座標離得越近——「貓」和「貓咪」是鄰居，「貓」和「財報」隔着十萬八千里。',
     '<strong>把檢索變成幾何：</strong>知識庫的每段文檔提前算好座標存進向量庫；用戶提問時把問題也變成座標，檢索就是找「離問題座標最近的 K 個文檔點」——這就是最近鄰搜索。',
     '<strong>補上工程規模：</strong>億級向量硬算距離太慢，實際用 HNSW 這類近似算法：多層跳表式導航，先粗後細幾十步逼近目標，用一點點精度換千倍速度。',
     '<strong>落回產品：</strong>檢索質素差時排查也順着這條鏈：Embedding 模型合不合適、文檔切塊合不合理、K 和閾值設得對不對。'],
   bonus:'點出「近似」的產品含義：HNSW 不保證找到絕對最近的，偶爾漏掉正確文檔是機制內的正常現象——評測時要區分「向量庫沒召回」和「知識庫裏壓根沒有」，兩者的修法完全不同。',
   refs:[{href:'ds-10.html',label:'向量與近鄰搜索'},{href:'ds-6.html',label:'語義緩存'}]},

   frame:['<strong>先給定位而不是道歉：</strong>這不是模型笨，是檢索鏈路的問題。「發票」和「報銷」在語義空間裏本來就是近鄰，檢索時報銷文檔排到了發票文檔前面，模型只能拿錯料做菜。',

     '<strong>給承諾方式：</strong>先建一套高頻問題的評測集，量化「檢索命中率」，修一輪測一輪，兩週內給你看指標曲綫，而不是口頭説好了。'],

document.getElementById('iqList').innerHTML = QUESTIONS.map(function(it, i){
  const w = WHO[it.who];
  return '<div class="iq-card' + w.card + '">'
    + '<div class="iq-head"><span class="iq-num">Q' + (i + 1) + '</span><span class="iq-who ' + w.cls + '">' + w.label + '</span></div>'

    + '<div class="iq-block iq-intent"><div class="iq-label">🎯 對方在考察什麼</div><div class="iq-body">' + it.intent + '</div></div>'
    + '<div class="iq-block iq-frame"><div class="iq-label">🧭 答題框架</div><ol>'
    + it.frame.map(function(f){ return '<li>' + f + '</li>'; }).join('')

    + '<div class="iq-bonus"><b>⭐ 加分點</b>' + it.bonus + '</div>'
    + '<div class="iq-refs"><span class="iq-refs-label">用這些課程頁組織答案 →</span>'
    + it.refs.map(function(r){ return '<a href="' + r.href + '">' + r.label + '</a>'; }).join('')
    + '</div></div>';
}).join('');
