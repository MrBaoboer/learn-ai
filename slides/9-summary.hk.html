<style>
.topic-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:8px}
@media(max-width:900px){.topic-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.topic-grid{grid-template-columns:1fr}}
.topic-card{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow-card);cursor:pointer;transition:all .25s;position:relative;overflow:hidden}
.topic-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-pop);border-color:var(--accent)}
.topic-card .tc-num{position:absolute;top:12px;right:14px;font-size:11px;font-weight:800;color:var(--sub);opacity:.5}
.topic-card .tc-icon{font-size:28px;margin-bottom:10px}
.topic-card h4{font-size:15px;font-weight:800;color:var(--text);margin-bottom:8px}
.topic-card .tc-points{list-style:none;padding:0}
.topic-card .tc-points li{font-size:12px;color:var(--sub);line-height:1.6;padding:2px 0;display:flex;align-items:flex-start;gap:6px}
.topic-card .tc-points li::before{content:'•';color:var(--accent);font-weight:900;flex-shrink:0}
.topic-card .tc-link{display:block;margin-top:10px;font-size:12px;font-weight:700;color:var(--accent)}

.radar-section{margin-top:24px}
.radar-card{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);padding:28px;box-shadow:var(--shadow-card);text-align:center}
.radar-card h3{font-size:18px;font-weight:800;color:var(--text);margin-bottom:6px}
.radar-card .radar-sub{font-size:13px;color:var(--sub);margin-bottom:20px}
.radar-canvas-wrap{display:flex;justify-content:center;margin-bottom:16px}
.radar-canvas-wrap canvas{max-width:100%}
.radar-legend{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.radar-legend span{font-size:12px;font-weight:600;color:var(--sub);display:flex;align-items:center;gap:4px}
.radar-legend .rdot{width:10px;height:10px;border-radius:3px}

.takeaway{background:rgba(0,102,255,.04);border:1.5px solid rgba(0,102,255,.18);border-radius:var(--radius);padding:16px 20px;font-size:15px;color:var(--text);display:flex;gap:10px;line-height:1.7;margin-top:24px}
.takeaway b{color:var(--accent)}
</style>

<script>
(function(){
  var topics = [
    {num:'01',icon:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg>',title:'AI 生圖',points:['Prompt 翻譯層設計','多模型降級策略','角色一致性方案'],link:'9-1.html'},
    {num:'02',icon:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>',title:'Agent 循環',points:['真實循環遠超教科書','防無限循環機制','多步驟狀態管理'],link:'9-6.html'},
    {num:'03',icon:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>',title:'上下文管理',points:['越長越貴、越笨','摘要壓縮策略','滑動窗口設計'],link:'9-11.html'},
    {num:'04',icon:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/><path d="M9 18h6"/><path d="M10 22h4"/></svg>',title:'記憶系統',points:['短期 vs 長期記憶','記憶的存儲與檢索','遺忘也是設計'],link:'9-11.html'},
    {num:'05',icon:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg>',title:'Prompt 工程',points:['System Prompt 架構','Prompt 模板化','動態注入上下文'],link:'9-11.html'},
    {num:'06',icon:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',title:'多 Agent',points:['何時拆分 Agent','Agent 間通信','編排 vs 自組織'],link:'9-11.html'},
    {num:'07',icon:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>',title:'權限與安全',points:['五級權限光譜','風險分級策略','可觀測性儀表盤'],link:'9-27.html'},
    {num:'08',icon:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12V7a5 5 0 0 1 10 0v5"/><path d="M15 12a5 5 0 0 1-10 0"/><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="4"/><line x1="20" y1="21" x2="20" y2="14"/><line x1="20" y1="10" x2="20" y2="4"/></svg>',title:'MCP 實戰',points:['雙向協議集成','懶連接啓動','AI 自配置工具'],link:'9-30.html'}
  ];

  var grid = document.getElementById('topicGrid');
  topics.forEach(function(t){
    var pointsHtml = '';
    t.points.forEach(function(p){ pointsHtml += '<li>'+p+'</li>'; });
    grid.innerHTML += '<div class="topic-card reveal" onclick="location.href=\''+t.link+'\'">'
      + '<span class="tc-num">#'+t.num+'</span>'
      + '<div class="tc-icon">'+t.icon+'</div>'
      + '<h4>'+t.title+'</h4>'
      + '<ul class="tc-points">'+pointsHtml+'</ul>'
      + '<span class="tc-link">查看詳情 →</span>'
      + '</div>';
  });

  var canvas = document.getElementById('radarCanvas');
  var ctx = canvas.getContext('2d');
  var W = canvas.width, H = canvas.height;
  var cx = W/2, cy = H/2, R = 150;

  var labels = ['生圖','循環','上下文','記憶','Prompt','多Agent','安全','MCP'];
  var target =  [0.85, 0.9, 0.88, 0.82, 0.9, 0.78, 0.85, 0.8];
  var demo =    [0.3,  0.2, 0.15, 0.1,  0.35, 0.1,  0.1,  0.15];
  var n = labels.length;

  function angleFor(i){ return (Math.PI * 2 / n) * i - Math.PI / 2; }
  function px(i, val){ return cx + Math.cos(angleFor(i)) * R * val; }
  function py(i, val){ return cy + Math.sin(angleFor(i)) * R * val; }

  function drawBg(){
    var dark = document.documentElement.getAttribute('data-theme') === 'dark';
    var gridColor = dark ? 'rgba(255,255,255,0.12)' : 'rgba(0,0,0,0.06)';
    [0.25, 0.5, 0.75, 1].forEach(function(s){
      ctx.beginPath();
      for(var i=0;i<=n;i++){
        var idx = i % n;
        if(i===0) ctx.moveTo(px(idx,s),py(idx,s));
        else ctx.lineTo(px(idx,s),py(idx,s));
      }
      ctx.closePath();
      ctx.strokeStyle = gridColor;
      ctx.lineWidth = 1;
      ctx.stroke();
    });

    for(var i=0;i<n;i++){
      ctx.beginPath();
      ctx.moveTo(cx,cy);
      ctx.lineTo(px(i,1),py(i,1));
      ctx.strokeStyle = gridColor;
      ctx.stroke();
    }

    ctx.font = '12px -apple-system, sans-serif';
    ctx.fillStyle = dark ? '#a3ada8' : '#6b7280';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for(var i=0;i<n;i++){
      var lx = px(i,1.18), ly = py(i,1.18);
      ctx.fillText(labels[i], lx, ly);
    }
  }

  function drawArea(data, fill, stroke){
    ctx.beginPath();
    for(var i=0;i<=n;i++){
      var idx = i % n;
      if(i===0) ctx.moveTo(px(idx,data[idx]),py(idx,data[idx]));
      else ctx.lineTo(px(idx,data[idx]),py(idx,data[idx]));
    }
    ctx.closePath();
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.strokeStyle = stroke;
    ctx.lineWidth = 2;
    ctx.stroke();

    for(var i=0;i<n;i++){
      ctx.beginPath();
      ctx.arc(px(i,data[i]),py(i,data[i]),3,0,Math.PI*2);
      ctx.fillStyle = stroke;
      ctx.fill();
    }
  }

  function drawAll(){
    var dark = document.documentElement.getAttribute('data-theme') === 'dark';
    ctx.clearRect(0,0,W,H);
    drawBg();
    drawArea(
      demo,
      dark ? 'rgba(233,141,123,0.12)' : 'rgba(220,38,38,0.08)',
      dark ? 'rgba(233,141,123,0.65)' : 'rgba(220,38,38,0.5)'
    );
    drawArea(
      target,
      dark ? 'rgba(92,181,149,0.16)' : 'rgba(20,107,84,0.10)',
      dark ? 'rgba(92,181,149,0.82)' : 'rgba(20,107,84,0.72)'
    );
  }
  drawAll();
  window.addEventListener('xueai-themechange',drawAll);
})();
</script>
