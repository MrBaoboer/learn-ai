/* 系统色板别名（沿用交互数据中的变量名） */
:root{--green:var(--success);--red:var(--danger);--muted:var(--sub)}

/* 质量仪表（sticky 保持可见） */
.meter-section{
  position:sticky;top:12px;z-index:10;
  background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);
  padding:16px 18px;box-shadow:var(--shadow-card);margin-bottom:20px;
}
.meter-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.meter-title{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.4px;text-transform:uppercase}
.btn-reset{background:transparent;color:var(--sub);border:1px solid var(--border);padding:5px 14px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s}
.btn-reset:hover{border-color:var(--accent);color:var(--accent)}
.meter-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.meter-row:last-child{margin-bottom:0}
.meter-label{font-size:12px;font-weight:700;color:var(--sub);min-width:56px;text-align:right}
.meter-bar-bg{flex:1;height:12px;background:rgba(0,0,0,.04);border-radius:6px;overflow:hidden}
.meter-bar{height:100%;border-radius:6px;transition:width .8s ease,background .5s}
.meter-val{font-size:13px;font-weight:800;min-width:36px;transition:color .5s}

/* 对话流 */
#chatPanel{min-height:60px}
.round-divider{display:flex;align-items:center;gap:10px;padding:22px 0 10px}
.round-badge{padding:3px 12px;border-radius:6px;font-size:12px;font-weight:800;white-space:nowrap}
.round-line{flex:1;height:1px;background:var(--border)}

.msg{border-radius:var(--radius-sm);padding:13px 16px;font-size:14px;line-height:1.7;margin-bottom:10px;opacity:0;transform:translateY(8px);transition:opacity .4s ease,transform .4s ease}
.msg.show{opacity:1;transform:translateY(0)}
.msg-lbl{font-size:11px;font-weight:800;opacity:.6;margin-bottom:5px;letter-spacing:.3px}
.msg-user{background:rgba(8,145,178,.07);color:#0e7490;border:1.5px solid rgba(8,145,178,.18)}
.msg-ai{background:var(--card);border:1.5px solid var(--border);color:var(--text);box-shadow:var(--shadow-card)}
.msg-ai .hl{background:rgba(22,163,74,.1);padding:1px 4px;border-radius:3px;font-weight:700;color:#15803d}
.msg-ai .fix{background:rgba(8,145,178,.1);padding:1px 4px;border-radius:3px;font-weight:700;color:#0e7490}
.msg-ai .bad{background:rgba(220,38,38,.1);padding:1px 4px;border-radius:3px;font-weight:700;color:var(--danger)}

/* 每轮分析卡 */
.analysis-card{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px;margin-bottom:6px;opacity:0;transform:translateY(8px);transition:all .4s;box-shadow:var(--shadow-card)}
.analysis-card.show{opacity:1;transform:translateY(0)}
.ac-label{font-size:11px;font-weight:800;letter-spacing:.4px;margin-bottom:6px;text-transform:uppercase}
.ac-body{font-size:14px;color:var(--sub);line-height:1.7}
.ac-body strong{color:var(--text)}
.ac-body em{font-style:normal;font-weight:700;color:var(--cyan)}

/* 结论框 */
.final-box{border-radius:var(--radius);padding:18px 22px;font-size:14px;line-height:1.8;margin-top:20px;opacity:0;transition:opacity .5s}
.final-box.show{opacity:1}

@media (max-width:768px){
  .meter-section{top:8px;padding:13px 14px}
  .meter-label{min-width:48px;font-size:11px}
}
</style>

<script>
const STEPS = [
  {
    divider:{text:'第 1 輪 · 初始提問', color:'var(--cyan)', bg:'rgba(8,145,178,.1)'},
    user:'幫我寫一段產品介紹，我哋做咗一個 AI 客服系統。',
    ai:'我們的 AI 客服系統採用先進的人工智能技術，為企業提供智能化的客户服務解決方案。系統具備自然語言理解能力，能夠準確理解客户意圖，提供精準回答。支持多渠道接入，7×24 小時不間斷服務，大幅降低人工成本，提升客户滿意度。',
    scores:[40,25,20,30],
    analysis:{label:'第 1 輪分析',color:'var(--red)',
      body:'典型的<strong>萬能廢話</strong>輸出，套在任何 AI 產品上都行。沒有具體數據、沒有差異化、沒有目標受眾。<em>原因：你沒給 AI 任何具體資訊。</em>'}
  },
  {
    divider:{text:'第 2 輪 · 補充背景', color:'var(--amber)', bg:'rgba(217,119,6,.1)'},
    user:'補充吓：我哋嘅產品叫「小蜜」，面向電商商家，核心優勢是：1）接入只需 5 分鐘；2）能自動學習商家的 FAQ；3）實測能解決 78% 的售前諮詢。\n\n目標客户是中小電商，請重寫。',
    ai:'<span class="hl">小蜜</span>是專為<span class="hl">中小電商</span>打造的 AI 客服助手。商家只需 <span class="hl">5 分鐘</span>即可完成接入，系統會自動學習店鋪的常見問題，無需人工配置知識庫。經實際商家驗證，<span class="hl">小蜜能獨立解決 78% 的售前諮詢</span>，讓客服團隊聚焦高價值訂單。',
    scores:[70,65,60,50],
    analysis:{label:'第 2 輪分析',color:'var(--amber)',
      body:'好多了！有了<strong>產品名、數據、目標人羣</strong>。但文風偏硬，像技術文檔，少了營銷文案的味道。還缺少<em>情感共鳴和場景代入</em>。'}
  },
  {
    divider:{text:'第 3 輪 · 調整風格', color:'var(--green)', bg:'rgba(22,163,74,.1)'},
    user:'內容方向對了，但語氣太硬了。改成這種感覺：像一個懂電商的朋友在推薦，輕鬆但專業。\n\n另外加一句開頭，點出中小電商客服的痛點。控制在 100 字以內。',
    ai:'<span class="fix">雙 11 你請了 3 個臨時客服，還是忙不過來？</span>\n\n試試<span class="hl">小蜜</span> — 5 分鐘接入，自動學會你店鋪的 FAQ，<span class="hl">實測解決 78% 售前諮詢</span>。讓 AI 接住那些「親，喺唔喺度？」，<span class="fix">你的團隊只管搞定大單</span>。',
    scores:[90,85,90,92],
    analysis:{label:'第 3 輪分析',color:'var(--green)',
      body:'<strong>質的飛躍</strong>！開頭用場景痛點抓注意力，數據保留但不生硬，結尾有行動暗示。<em>3 輪迭代，從廢話模板到可直接用的營銷文案。</em><br><br><strong style="color:var(--green)">到這裏已經可以直接用了。但如果你停不下來…</strong>'}
  },
  {
    divider:{text:'第 4 輪 · 畫蛇添足', color:'var(--red)', bg:'rgba(220,38,38,.1)'},
    user:'再精煉一下，每句話都要有衝擊力。加一些讓人忍不住轉發的營銷金句，語氣再煽動一些。',
    ai:'還在為客服<span class="bad">焦頭爛額</span>？一個<span class="bad">顛覆遊戲規則</span>的方案來了！小蜜 — 5 分鐘極速部署，AI 自動吃透你的 FAQ！78% 售前諮詢<span class="bad">秒殺解決</span>！當競爭對手還在手忙腳亂，<span class="bad">你的 AI 客服已經在幫你印鈔</span>。別猶豫，<span class="bad">現在就擁抱客服革命</span>！',
    scores:[65,50,35,28],
    analysis:{label:'第 4 輪分析',color:'var(--red)',
      body:'<strong>越磨越差了。</strong>第 3 輪本來已經很好，但用戶貪心多磨了一輪。現在滿篇「顛覆」「秒殺」「革命」，<em>從真誠推薦變成了朋友圈微商廣告</em>。數據被淹沒在口號裏，可信度暴跌。<br><br>問題不在 AI，在於你給的指令：「加衝擊力」「再煽動」本身就是錯誤方向。'}
  },
  {
    divider:null,
    final:true,
    finalContent:{
      bg:'rgba(8,145,178,.06)',border:'rgba(8,145,178,.2)',color:'#0e7490',
      text:'<strong>Vibe Coding 時代的核心能力：知道不做什麼，比知道做什麼更重要。</strong>\n\n<em>Round 1→3</em>：每輪給 AI 新資訊（背景、數據、風格約束），質素持續上升。\n<em>Round 4</em>：沒有新資訊，只是要求「更好」，反而把好作品改壞了。\n\n<strong style="color:var(--red)">停下來的信號：</strong>\n· 產出已經<em>能用</em>了 → 收手，去做下一件事\n· 説不清哪裏要改，只覺得「還能更好」 → 收手\n· 改完不如上一版 → 立刻回退\n\n<strong>三輪內解決問題是高手。能在第三輪停住不繼續磨，是頂級高手。</strong>'
    }
  }
];

function barColor(v) {
  if (v >= 80) return 'var(--green)';
  if (v >= 55) return 'var(--amber)';
  return 'var(--red)';
}

function updateMeters(scores) {
  scores.forEach((s,i) => {
    const bar = document.getElementById('bar'+i);
    const val = document.getElementById('val'+i);
    bar.style.width = s + '%';
    bar.style.background = barColor(s);
    val.textContent = s;
    val.style.color = barColor(s);
  });
}

/* 自动播放：进入视野后逐轮渲染，用 playId 让"重来"能中断旧的播放序列 */
let playId = 0;

function playRound(idx, myId) {
  if (myId !== playId || idx >= STEPS.length) return;
  const s = STEPS[idx];
  const chat = document.getElementById('chatPanel');

  if (s.final) {
    const box = document.createElement('div');
    box.className = 'final-box';
    box.style.background = s.finalContent.bg;
    box.style.border = '1.5px solid ' + s.finalContent.border;
    box.style.color = s.finalContent.color;
    box.innerHTML = s.finalContent.text.replace(/\n/g,'<br>');
    chat.appendChild(box);
    setTimeout(() => box.classList.add('show'), 50);
    return;
  }

  if (s.divider) {
    const div = document.createElement('div');
    div.className = 'round-divider';
    div.innerHTML = `<span class="round-badge" style="background:${s.divider.bg};color:${s.divider.color}">${s.divider.text}</span><div class="round-line"></div>`;
    chat.appendChild(div);
  }

  const userMsg = document.createElement('div');
  userMsg.className = 'msg msg-user';
  userMsg.innerHTML = `<div class="msg-lbl">你説</div>${s.user.replace(/\n/g,'<br>')}`;
  chat.appendChild(userMsg);
  setTimeout(() => userMsg.classList.add('show'), 50);

  setTimeout(() => {
    if (myId !== playId) return;
    const aiMsg = document.createElement('div');
    aiMsg.className = 'msg msg-ai';
    aiMsg.innerHTML = `<div class="msg-lbl">AI 輸出</div>${s.ai.replace(/\n/g,'<br>')}`;
    chat.appendChild(aiMsg);
    setTimeout(() => aiMsg.classList.add('show'), 50);

    updateMeters(s.scores);

    setTimeout(() => {
      if (myId !== playId) return;
      const card = document.createElement('div');
      card.className = 'analysis-card';
      card.innerHTML = `<div class="ac-label" style="color:${s.analysis.color}">${s.analysis.label}</div><div class="ac-body">${s.analysis.body}</div>`;
      chat.appendChild(card);
      setTimeout(() => card.classList.add('show'), 50);

      // 間隔 1.2s 播放下一輪
      setTimeout(() => playRound(idx + 1, myId), 1200);
    }, 700);
  }, 800);
}

function startDemo() {
  playId++;
  document.getElementById('chatPanel').innerHTML = '';
  [0,1,2,3].forEach(i => {
    document.getElementById('bar'+i).style.width = '0';
    document.getElementById('bar'+i).style.background = '#ccc';
    document.getElementById('val'+i).textContent = '—';
    document.getElementById('val'+i).style.color = 'var(--muted)';
  });
  playRound(0, playId);
}

function resetDemo() {
  startDemo();
}

lessonOnView(document.getElementById('chatPanel'), startDemo, 0.05);
</script>
