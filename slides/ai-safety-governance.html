.gov-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }

.scene-card {
  background: var(--card); border: 2px solid var(--border);

}

.scene-card.active { border-color: var(--danger); background: rgba(220,38,38,0.03); }

.sc-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 800; flex-shrink: 0; }

.sc-title { font-size: 15px; font-weight: 800; color: var(--text); margin-bottom: 2px; }
.sc-desc { font-size: 13px; color: var(--sub); line-height: 1.45; }
.sc-risk { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 5px; font-size: 10px; font-weight: 800; margin-top: 6px; }

.detail-risk { font-size: 12px; font-weight: 700; margin-top: 2px; }

.info-card {
  background: var(--card); border: 1.5px solid var(--border);

}
.ic-label { font-size: 11px; font-weight: 800; letter-spacing: 0.4px; text-transform: uppercase; margin-bottom: 8px; }
.ic-body { font-size: 14px; color: var(--sub); line-height: 1.7; }
.ic-body strong { color: var(--text); }
.ic-body em { font-style: normal; font-weight: 700; }
.ic-list { display: flex; flex-direction: column; gap: 6px; }
.ic-item { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; line-height: 1.55; color: var(--sub); }
.ic-dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; margin-top: 7px; }

.do-dont { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.dd-col { border-radius: var(--radius-sm); padding: 12px 14px; font-size: 13px; line-height: 1.65; }
.dd-col strong { display: block; font-size: 11px; letter-spacing: 0.3px; margin-bottom: 5px; }

.tip-strip { border-radius: var(--radius-sm); padding: 12px 16px; font-size: 13px; line-height: 1.65; }

@media (max-width: 768px) {

  .do-dont { grid-template-columns: 1fr; }
}

function renderCards(filter) {
  const list = document.getElementById('cardList');
  list.innerHTML = '';
  ITEMS.forEach((s,i) => {
    const card = document.createElement('div');
    card.className = 'scene-card' + (i===0?' active':'');
    card.dataset.cat = s.cat;
    if (filter !== 'all' && s.cat !== filter) card.classList.add('hidden');
    card.innerHTML = `
      <div class="sc-icon" style="background:${s.iconBg};color:${s.iconColor};font-weight:800">${s.icon}</div>
      <div class="sc-body">
        <div class="sc-title">${s.title}</div>
        <div class="sc-desc">${s.desc}</div>
        <span class="sc-risk" style="background:${s.riskBg};color:${s.riskColor}">${s.riskText}</span>
      </div>
    `;
    card.onclick = () => {
      document.querySelectorAll('.scene-card').forEach(c => c.classList.remove('active'));
      card.classList.add('active');
      showDetail(i);
    };
    list.appendChild(card);
  });
}

function showDetail(idx) {

  const d = s.detail;
  const panel = document.getElementById('detailPanel');

    <div class="detail-hd">
      <div class="detail-icon" style="background:${s.iconBg};color:${s.iconColor};font-weight:800;font-size:18px">${s.icon}</div>
      <div>
        <div class="detail-title">${s.title.split(' — ')[0]}</div>
        <div class="detail-risk" style="color:${d.titleColor}">${s.riskText}</div>
      </div>
    </div>
    <div class="info-card">
      <div class="ic-label" style="color:${d.titleColor}">核心说明</div>
      <div class="ic-body">${d.desc}</div>
    </div>
    <div class="info-card">
      <div class="ic-label" style="color:${d.titleColor}">${s.cat==='tier'?'管控要求':'核心职责'}</div>
      <div class="ic-list">${d.controls.map(c=>`<div class="ic-item"><div class="ic-dot" style="background:${c.color}"></div><span>${c.text}</span></div>`).join('')}</div>
    </div>
    <div class="do-dont">
      <div class="dd-col dd-do">
        <strong>应该这样做</strong>
        ${d.doList.map(x => '· ' + x).join('<br>')}
      </div>
      <div class="dd-col dd-dont">
        <strong>不要这样做</strong>
        ${d.dontList.map(x => '· ' + x).join('<br>')}
      </div>
    </div>
    <div class="tip-strip" style="background:${d.tip.bg};border:1px solid ${d.tip.bg.replace('.06','.15')};color:${d.tip.color}">
      ${d.tip.text}
    </div>
  `;
}

function filterBy(cat, btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.scene-card').forEach(card => {
    if (cat === 'all' || card.dataset.cat === cat) {
      card.classList.remove('hidden');
    } else {
      card.classList.add('hidden');
    }
  });
  const firstVisible = document.querySelector('.scene-card:not(.hidden)');
  if (firstVisible) firstVisible.click();
}

renderCards('all');
showDetail(0);
</script>
