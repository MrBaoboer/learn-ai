/* ── 기술 선택 목록 ── */
.skill-list { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.skill-btn {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px; border-radius: var(--radius);
  border: 1.5px solid var(--border); background: var(--card);
  cursor: pointer; transition: all 0.2s; font-family: inherit;
  text-align: left; width: 100%; min-height: 44px;
  box-shadow: var(--shadow-card);
}
.skill-btn:hover { border-color: rgba(0,0,0,0.15); }
.skill-btn.active { border-color: var(--purple); background: rgba(124,58,237,0.05); }
.snum {
  width: 34px; height: 34px; border-radius: 9px;
  background: rgba(0,0,0,0.05); color: var(--sub);
  font-size: 14px; font-weight: 800;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: all 0.2s;
}
.skill-btn.active .snum { background: var(--purple); color: white; }
.st h4 { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 2px; transition: color 0.2s; }
.skill-btn.active .st h4 { color: var(--purple); }
.st p { font-size: 13px; color: var(--sub); line-height: 1.5; }

/* ── 공식 박스 ── */
.formula-box {
  background: rgba(124,58,237,0.06); border: 1.5px solid rgba(124,58,237,0.18);
  border-radius: var(--radius); padding: 16px 20px; margin-top: 16px;
}
.feq { font-size: 15px; font-weight: 800; color: var(--purple); font-family: "SF Mono", Menlo, monospace; margin-bottom: 6px; }
.fdesc { font-size: 14px; color: var(--sub); line-height: 1.7; }

/* ── 비교 데모 영역 ── */
.cmp-hd { font-size: 14px; font-weight: 800; color: var(--sub); letter-spacing: 0.4px; margin-bottom: 12px; }
.cmp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.cmp-box {
  border-radius: var(--radius); display: flex; flex-direction: column;
  overflow: hidden; border: 1.5px solid transparent;
}
.cmp-box.bad { border-color: rgba(220,38,38,0.25); background: rgba(220,38,38,0.04); }
.cmp-box.good { border-color: rgba(22,163,74,0.3); background: rgba(22,163,74,0.04); }
.cb-label { padding: 10px 16px; font-size: 14px; font-weight: 800; border-bottom: 1px solid rgba(0,0,0,0.06); }
.cmp-box.bad .cb-label { color: var(--danger); }
.cmp-box.good .cb-label { color: var(--success); }
.cb-prompt {
  padding: 12px 16px; font-family: "SF Mono", "Fira Code", Menlo, monospace;
  font-size: 13px; color: var(--sub); background: rgba(0,0,0,0.04);
  line-height: 1.6; white-space: pre-wrap; min-height: 20px;
}
.cb-result {
  padding: 12px 16px; font-size: 14px; color: var(--text);
  line-height: 1.75; min-height: 120px; white-space: pre-wrap;
}
.cursor {
  display: inline-block; width: 2px; height: 16px;
  background: var(--text); vertical-align: middle;
  animation: blink 0.7s steps(1) infinite; margin-left: 1px;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

/* ── 제어 버튼 ── */
.ctrl-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 14px; }
.btn {
  padding: 11px 24px; border-radius: var(--radius-sm);
  font-size: 15px; font-weight: 700; border: none; cursor: pointer;
  font-family: inherit; transition: all 0.15s; min-height: 44px;
}
.btn-play { background: var(--purple); color: white; }
.btn-play:hover { filter: brightness(1.1); }
.btn-play:disabled { opacity: 0.3; cursor: not-allowed; }
.btn-rst { background: var(--card); color: var(--sub); border: 1.5px solid var(--border); }
.hint { font-size: 13px; color: var(--sub); }

@media (max-width: 768px) {
  .skill-list { grid-template-columns: 1fr; }
  .cmp-grid { grid-template-columns: 1fr; }
}

<body>
<article class="lesson">

  <header class="lesson-header">
    <div class="kicker">Prompt 엔지니어링</div>
    <h1>Prompt 고급 기술</h1>
    <p class="subtitle">4가지 기술을 마스터하면 모델 응답 품질이 두 배로 높아집니다. 기술을 클릭하면 아래에 실시간 좋은/나쁜 비교가 나타납니다.</p>
  </header>

  <div class="sec-label">네 가지 고급 기술</div>

  <div class="skill-list">
    <button class="skill-btn active" onclick="pickSkill(this,0)">
      <div class="snum">01</div>
      <div class="st"><h4>Few-Shot 예시</h4><p>예시 몇 개만 주면 모델이 형식과 기준을 즉시 파악합니다</p></div>
    </button>
    <button class="skill-btn" onclick="pickSkill(this,1)">
      <div class="snum">02</div>
      <div class="st"><h4>Chain of Thought (사고 사슬)</h4><p>단계별 추론으로 정확도를 대폭 향상시킵니다</p></div>
    </button>
    <button class="skill-btn" onclick="pickSkill(this,2)">
      <div class="snum">03</div>
      <div class="st"><h4>제약 조건 (Constraints)</h4><p>글자 수, 어조, 형식, 금지 단어…</p></div>
    </button>
    <button class="skill-btn" onclick="pickSkill(this,3)">
      <div class="snum">04</div>
      <div class="st"><h4>분할 정복 (Task Decomposition)</h4><p>복잡한 작업을 단계별로 나눠 각 단계를 독립적으로 최적화합니다</p></div>
    </button>
  </div>

  <div class="sec-label">실시간 비교 데모</div>

  <div class="cmp-hd" id="cmpHd">01 · Few-Shot 예시 — 실시간 비교 데모</div>
  <div class="cmp-grid paywall-locked xa-peek">
    <div class="cmp-box bad">
      <div class="cb-label">❌ 나쁜 Prompt（예시 없음）</div>
      <div class="cb-prompt" id="badPrompt"></div>
      <div class="cb-result" id="badResult"></div>
    </div>
    <div class="cmp-box good">
      <div class="cb-label">✅ 좋은 Prompt（예시 있음）</div>
      <div class="cb-prompt" id="goodPrompt"></div>
      <div class="cb-result" id="goodResult"></div>
    </div>
  </div>
  <div class="ctrl-row paywall-locked">
    <button class="btn btn-play" id="btnPlay" onclick="playDemo()">▶ 비교 데모 시작</button>
    <button class="btn btn-rst" onclick="resetDemo()">초기화</button>
    <span class="hint" id="playHint"></span>
  </div>

  <div class="sec-label paywall-locked">만능 공식</div>

  <div class="formula-box paywall-locked">
    <div class="feq">역할 + 작업 + 컨텍스트 + 제약 + 예시 + 형식</div>
    <p class="fdesc">어느 하나라도 빠지면 품질이 떨어집니다. Prompt를 코드처럼 작성하세요: 제약 추가, 예시 추가, 테스트 케이스 추가.</p>
  </div>

<script>
const SKILLS = [
  {
    hd: '01 · Few-Shot 예시 — 실시간 비교 데모',
    badP: '분류해 주세요: 今天天气真好（날씨가 정말 좋네）',
    goodP: '감정: 开心（기쁨） → 긍정\n날씨: 下雨了（비가 왔다） → 중립\n老板太烦人了（상사가 너무 짜증난다） → 부정\n---\n今天天气真好 → ',
    badR: '이 문장은 날씨에 대한 긍정적인 태도를 표현하며 즐거운 감정이 담긴 서술문입니다. 긍정적인 감정을 나타내는 문장으로 분류할 수 있습니다. （형식 불명확, 요청 분류 방식 미준수）',
    goodR: '긍정\n\n（모델이 예시에서 형식과 기준을 학습해 직접 답변을 제공. 간결하고 정확）'
  },
  {
    hd: '02 · Chain of Thought（사고 사슬） — 실시간 비교 데모',
    badP: '13 × 7 + 5는 얼마입니까?',
    goodP: '13 × 7 + 5는 얼마입니까?\n단계별로 계산해 주세요 — 먼저 곱셈, 그 다음 덧셈.',
    badR: '96\n\n（가끔 바로 틀린 답을 줍니다. 복잡한 계산에서 특히 불안정한데, 모델이 단계를 건너뛰기 때문입니다.）',
    goodR: '1단계: 먼저 곱셈\n13 × 7 = 91\n\n2단계: 그 다음 덧셈\n91 + 5 = 96\n\n정답: 96\n\n（추론 과정이 투명하고, 정확도가 크게 향상되며, 오류 찾기도 쉬워집니다）'
  },
  {
    hd: '03 · 제약 조건（Constraints） — 실시간 비교 데모',
    badP: '제품 설명을 써 주세요',
    goodP: '제품 설명 작성\n· 글자 수: 50자 이내\n· 대상: 18-25세 젊은층\n· 어조: 활기차고 가볍게\n· 「전문적인」「탁월한」 등 단어 금지',
    badR: '이 제품은 첨단 기술 개념을 활용하여 탁월한 성능과 전문적인 품질 보증을 제공합니다. 최고의 사용 경험을 드리기 위해 최선을 다하겠습니다…\n\n（길고 딱딱하며 특정 대상을 고려하지 않음）',
    goodR: '「하루 한 잔, 그냥 버티는 게 아니라 당신의 상태를 유지하는 거예요.」\n\n（모든 제약 조건을 정확히 충족, 활기찬 어조, 금지 단어 없음, 바로 사용 가능）'
  },
  {
    hd: '04 · 분할 정복（Task Decomposition） — 실시간 비교 데모',
    badP: '경쟁사 분석하고, 전략 쓰고, PPT 개요도 만들어 줘',
    goodP: '1단계: 주요 경쟁사 3개（A, B, C）의 가격 및 기능 차이를 분석해 주세요\n（모델 출력 대기）\n2단계: 위 분석을 바탕으로 차별화 전략을 작성해 주세요\n（모델 출력 대기）\n3단계: 전략을 PPT 개요로 변환해 주세요',
    badR: '1. 경쟁사 분석: A 제품은 가격이 낮고, B 제품은 기능이 많으며…\n2. 전략 제안: 우리는…\n3. PPT 개요: 첫 슬라이드 제목…\n\n（세 가지 작업이 섞여 있고 각각 피상적 — 품질 매우 낮음）',
    goodR: '[1단계는 경쟁사 분석에만 집중]\n→ 모델이 전력으로 분석, 심층 보고서 출력\n\n[2단계는 실제 분석 기반으로 전략 작성]\n→ 구체적이고 알차며 빈말이 없음\n\n[3단계에서 구조화된 PPT로 변환]\n→ 논리적이고 바로 사용 가능\n\n단계별로 한 가지에만 집중하면 「한 번에 다 물어보기」보다 3-5배 높은 품질'
  }
];

let curSkill = 0, playing = false;
let badTimer = null, goodTimer = null;

function pickSkill(btn, idx) {
  document.querySelectorAll('.skill-btn').forEach((b,i) => b.classList.toggle('active', i===idx));
  curSkill = idx;
  resetDemo();
  document.getElementById('cmpHd').textContent = SKILLS[idx].hd;
}

function typeText(el, text, delay, done) {
  let i = 0;
  const lines = text.split('');
  el.innerHTML = '';
  const cur = document.createElement('span');
  cur.className = 'cursor';
  el.appendChild(cur);

  function tick() {
    if (i >= lines.length) {
      if (cur.parentNode) cur.parentNode.removeChild(cur);
      if (done) done();
      return;
    }
    const ch = lines[i++];
    cur.insertAdjacentText('beforebegin', ch);
    el.scrollTop = el.scrollHeight;
    const d = ch === '\n' ? delay * 3 : delay;
    setTimeout(tick, d);
  }
  setTimeout(tick, 200);
}

function playDemo() {
  if (playing) return;
  playing = true;
  document.getElementById('btnPlay').disabled = true;
  document.getElementById('playHint').textContent = 'AI 실시간 생성 시뮬레이션 중…';

  const s = SKILLS[curSkill];
  document.getElementById('badPrompt').textContent = s.badP;
  document.getElementById('goodPrompt').textContent = s.goodP;

  let badDone = false, goodDone = false;
  function check() {
    if (badDone && goodDone) {
      playing = false;
      document.getElementById('playHint').textContent = '데모 완료 — 차이가 느껴지셨나요?';
    }
  }

  typeText(document.getElementById('badResult'), s.badR, 28, () => { badDone=true; check(); });
  typeText(document.getElementById('goodResult'), s.goodR, 22, () => { goodDone=true; check(); });
}

function resetDemo() {
  playing = false;
  clearTimeout(badTimer); clearTimeout(goodTimer);
  const s = SKILLS[curSkill];
  document.getElementById('badPrompt').textContent = '';
  document.getElementById('goodPrompt').textContent = '';
  document.getElementById('badResult').innerHTML = '<span style="color:var(--sub);font-size:14px">「비교 데모 시작」을 클릭하면 결과가 표시됩니다…</span>';
  document.getElementById('goodResult').innerHTML = '<span style="color:var(--sub);font-size:14px">「비교 데모 시작」을 클릭하면 결과가 표시됩니다…</span>';
  document.getElementById('btnPlay').disabled = false;
  document.getElementById('btnPlay').textContent = '▶ 비교 데모 시작';
  document.getElementById('playHint').textContent = '';
}

// 초기화
pickSkill(document.querySelector('.skill-btn.active'), 0);
document.getElementById('cmpHd').textContent = SKILLS[0].hd;
</script>
