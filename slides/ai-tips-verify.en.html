<style>
@keyframes _si{to{opacity:1}}
body{opacity:0;animation:_si .15s ease .08s forwards}

:root{
  --red:var(--danger);
  --green:var(--success);
  --surface:var(--card);
  --muted:var(--sub);
  --tips-accent:#0891b2;
}

.lesson-header h1 em{font-style:normal;color:var(--danger)}

/* Top Control Bar */
.ctrl-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.score-badge{padding:8px 16px;border-radius:20px;font-size:14px;font-weight:800}
.btn-reveal{background:var(--tips-accent);color:white;border:none;padding:10px 20px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;transition:all .15s;font-family:inherit}
.btn-reveal:hover{filter:brightness(1.1)}
.btn-reveal:disabled{background:#ccc;cursor:not-allowed}
.round-tabs{display:flex;gap:6px}
.round-tab{padding:8px 14px;border-radius:8px;border:1.5px solid var(--border);background:var(--surface);font-size:13px;font-weight:700;cursor:pointer;color:var(--sub);transition:all .15s;font-family:inherit}
.round-tab.active{background:var(--tips-accent);border-color:var(--tips-accent);color:white}

/* Two-Column Layout */
.verify-layout{display:grid;grid-template-columns:1.15fr 1fr;gap:20px;align-items:start}
.claim-list{display:flex;flex-direction:column;gap:10px}
.right-panel{display:flex;flex-direction:column;gap:10px}

.scenario-label{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.4px;text-transform:uppercase}
.scenario-q{font-size:14px;font-weight:700;color:var(--tips-accent);padding:10px 12px;background:rgba(8,145,178,.06);border:1px solid rgba(8,145,178,.2);border-radius:8px}

.claim{background:var(--surface);border:2px solid var(--border);border-radius:12px;padding:13px 14px;cursor:pointer;transition:all .2s;position:relative}
.claim:hover{border-color:rgba(8,145,178,.3)}
.claim.selected{border-color:var(--red);background:rgba(220,38,38,.04)}
.claim.revealed-true{border-color:var(--green);background:rgba(22,163,74,.04);cursor:default}
.claim.revealed-false{border-color:var(--red);background:rgba(220,38,38,.04);cursor:default}
.claim-num{position:absolute;top:10px;right:12px;font-size:11px;font-weight:800;color:var(--muted)}
.claim-text{font-size:14px;line-height:1.65;color:var(--text);padding-right:24px}
.claim-verdict{display:none;margin-top:8px;padding:8px 10px;border-radius:8px;font-size:13px;line-height:1.6}
.revealed-true .claim-verdict{display:block;background:rgba(22,163,74,.08);color:#14532d}
.revealed-false .claim-verdict{display:block;background:rgba(220,38,38,.08);color:#7c2d12}

.inst-box{padding:12px 14px;border-radius:10px;font-size:14px;line-height:1.7}
.stat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center}
.stat-num{font-size:22px;font-weight:900}
.stat-lbl{font-size:11px;color:var(--muted);margin-top:2px}

.lesson-box{background:rgba(8,145,178,.06);border:1.5px solid rgba(8,145,178,.2);border-radius:12px;padding:14px;font-size:14px;color:var(--sub);line-height:1.7}
.lesson-box strong{color:var(--text)}
.lesson-box em{font-style:normal;color:var(--tips-accent);font-weight:700}

.pattern-list{display:flex;flex-direction:column;gap:6px}
.pattern-item{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--sub);line-height:1.5}
.pattern-icon{flex-shrink:0;width:20px;height:20px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;margin-top:1px}
.pattern-item strong{color:var(--text)}

@media (max-width:768px){
  .verify-layout{grid-template-columns:1fr}
}
</style>

<body>
<article class="lesson wide">
  <header class="lesson-header">
    <div class="kicker">Practical Tips</div>
    <h1>Can You Trust<em> What AI Says?</em></h1>
    <p class="subtitle">Identify AI-fabricated content. Click the items you think are problematic, then reveal the answers.</p>
  </header>

  <div class="sec-label">Challenge</div>
  <div class="ctrl-bar">
    <div class="round-tabs" id="roundTabs"></div>
    <button class="btn-reveal" id="revealBtn" onclick="revealAll()">Reveal Answers</button>
    <div class="score-badge" id="scoreBadge" style="background:rgba(8,145,178,.1);color:var(--tips-accent)">Click the items you think are fabricated</div>
  </div>

  <div class="verify-layout">
    <div class="claim-list" id="claimList"></div>
    <div class="right-panel" id="rightPanel"></div>
  </div>
</article>
<script>
const ROUNDS = [
  {
    question: 'The user asks AI: "Give me an overview of the history of quantum computing"',
    claims: [
      {text:'The theoretical foundations of quantum computing can be traced back to 1981, when physicist Richard Feynman proposed using quantum systems to simulate physical problems.', truth:true, explain:'✅ Correct. Feynman did propose this concept in 1981; it is widely recognized as one of the starting points of quantum computing.'},
      {text:'In 1994, Peter Shor invented Shor\'s algorithm, proving that a quantum computer can factor large integers in polynomial time, sending shockwaves through the cryptography community.', truth:true, explain:'✅ Correct. Shor\'s algorithm is a quantum computing milestone; the date, person, and content are all accurate.'},
      {text:'In 2001, an IBM team used a 7-qubit quantum computer to successfully factor the number 15 — the first experimental demonstration of Shor\'s algorithm.', truth:true, explain:'✅ Correct. IBM did complete this experiment in 2001, factoring 15 into 3×5.'},
      {text:'In 2019, Google\'s Sycamore quantum processor with 53 qubits completed in 200 seconds a computation that would take a classical supercomputer 10,000 years, claiming "quantum supremacy".', truth:true, explain:'✅ Correct. This is the result Google published in Nature in 2019; the data and timing are accurate.'},
      {text:'In 2023, a team led by Prof. Zhang Liming at MIT released the "QubitNet" framework, achieving for the first time stable entanglement of 1,000 logical qubits, named by Nature as one of its Top 10 Breakthroughs of the Year.', truth:false, explain:'❌ Completely fabricated. Neither "Prof. Zhang Liming" nor the "QubitNet" framework exists, and there was no stable-entanglement experiment with 1,000 logical qubits. The AI invented the name, project, and achievement — and made it convincingly realistic.'},
      {text:'As of the end of 2024, IBM\'s Condor processor reached 1,121 qubits, making it the largest publicly announced superconducting quantum processor.', truth:true, explain:'✅ Basically correct. IBM did release the Condor processor; the 1,121-qubit figure is accurate.'},
    ],
    lesson:'Of these 6 items, only <em>1 is fabricated</em> (item 5), but its formatting and citation style are identical to the other 5 genuine items. <strong>This is the danger of hallucinations: mixed among real information, you simply cannot tell them apart.</strong>',
    patterns:[
      {icon:'🎭',color:'var(--red)',bg:'rgba(220,38,38,.1)',text:'<strong>Fabricating names</strong> — AI invents non-existent researchers and pairs them with real institutions to boost credibility'},
      {icon:'📰',color:'var(--red)',bg:'rgba(220,38,38,.1)',text:'<strong>Fabricating projects</strong> — "QubitNet" sounds plausible, but is entirely fictional'},
      {icon:'🏆',color:'var(--red)',bg:'rgba(220,38,38,.1)',text:'<strong>Fabricating accolades</strong> — "Nature Top 10" is one of AI\'s favorite deceptive tactics'},
    ]
  },
  {
    question: 'The user asks AI: "Recommend some classic books on product management"',
    claims: [
      {text:'Inspired — by Marty Cagan; describes how to build products users love and is considered essential reading for product managers.', truth:true, explain:'✅ Correct. Inspired is indeed Marty Cagan\'s work and a classic in the product management field.'},
      {text:'User Story Mapping — by Jeff Patton; introduces the user story mapping methodology to help teams understand the full picture of a product.', truth:true, explain:'✅ Correct. Author, title, and content are all accurate.'},
      {text:'The Three Gates of Product Thinking — by Chen Mingyuan, published by CITIC Press in 2022; redefines product design methodology from a cognitive science perspective, rated 8.9 on Douban.', truth:false, explain:'❌ Completely fabricated. This book does not exist; "Chen Mingyuan" is a fictional name; the Douban 8.9 rating is also invented. The AI added a publisher, year, and rating to make it more convincing.'},
      {text:'The Lean Startup — by Eric Ries; introduces the MVP (Minimum Viable Product) concept and the Build-Measure-Learn loop.', truth:true, explain:'✅ Correct. A classic startup and product book; author and core concepts are accurate.'},
      {text:'Hacking Growth — by Sean Ellis & Morgan Brown; systematically introduces data-driven growth methodology.', truth:true, explain:'✅ Correct. Authors and content description are accurate.'},
    ],
    lesson:'Item 3 is fabricated, but it looks <em>even more "thoughtful" than the real recommendations</em> — it has a publisher, year, and Douban rating. <strong>The more "detailed citations" AI gives you, the more suspicious you should be</strong>: genuine references can be found with a search; ones that can\'t be found are made up.',
    patterns:[
      {icon:'📚',color:'var(--amber)',bg:'rgba(217,119,6,.1)',text:'<strong>Fabricating titles</strong> — perfect format, but the book simply does not exist'},
      {icon:'👤',color:'var(--amber)',bg:'rgba(217,119,6,.1)',text:'<strong>Fabricating authors</strong> — Chinese names are especially easy to fabricate'},
      {icon:'⭐',color:'var(--amber)',bg:'rgba(217,119,6,.1)',text:'<strong>Fabricating ratings</strong> — Douban/Goodreads scores are AI\'s favorite credibility-inflating tool'},
    ]
  },
  {
    question: 'The user asks AI: "What laws and regulations does China have regarding AI?"',
    claims: [
      {text:'The Interim Measures for the Management of Generative Artificial Intelligence Services, effective August 15, 2023, jointly issued by the Cyberspace Administration of China and six other departments.', truth:true, explain:'✅ Correct. This is a real regulation; the date and issuing authority are accurate.'},
      {text:'The Provisions on the Management of Algorithmic Recommendations for Internet Information Services, implemented March 1, 2022, standardizing algorithmic recommendation practices.', truth:true, explain:'✅ Correct. This regulation was issued by the Cyberspace Administration of China and three other departments; it came into force on March 1, 2022.'},
      {text:'The Regulations for Promoting the Development of the Artificial Intelligence Industry, effective January 2024, led by the Ministry of Science and Technology, China\'s first AI-specific legislation, comprising 8 chapters and 64 articles.', truth:false, explain:'❌ Fabricated. As of the training data cutoff, no such national regulation exists. The AI invented the issuing authority, chapter count, and "first" title — formatted identically to real regulations.'},
      {text:'The Provisions on the Management of Deep Synthesis Internet Information Services, effective January 10, 2023, requiring labeling of AI-generated content.', truth:true, explain:'✅ Correct. This is a real regulation, requiring labeling of deep-synthesis content.'},
    ],
    lesson:'Legal regulations are <em>a hotbed of hallucinations</em>. Item 3 fabricated a "first AI-specific legislation" with a format and chapter count that looks real. <strong>Legal texts must be verified on official websites (such as the National Laws and Regulations Database)</strong> — never copy AI output verbatim.',
    patterns:[
      {icon:'⚖️',color:'var(--red)',bg:'rgba(220,38,38,.1)',text:'<strong>Fabricating regulations</strong> — formal name, perfect format, but the regulation does not exist'},
      {icon:'📋',color:'var(--red)',bg:'rgba(220,38,38,.1)',text:'<strong>Fabricating details</strong> — "8 chapters, 64 articles" makes you think it actually read the original text'},
      {icon:'🏛️',color:'var(--red)',bg:'rgba(220,38,38,.1)',text:'<strong>Fabricating authority</strong> — "led by the Ministry of Science and Technology" and "first" are techniques to add credibility'},
    ]
  }
];

let curRound = 0;
let revealed = false;
let userSelections = new Set();

function renderRound(r) {
  curRound = r; revealed = false; userSelections.clear();
  document.querySelectorAll('.round-tab').forEach((t,i) => t.classList.toggle('active', i===r));
  document.getElementById('scoreBadge').textContent = 'Click the items you think are problematic';
  document.getElementById('scoreBadge').style.background = 'rgba(8,145,178,.1)';
  document.getElementById('scoreBadge').style.color = 'var(--accent)';
  document.getElementById('revealBtn').disabled = false;

  const rd = ROUNDS[r];
  const list = document.getElementById('claimList');
  list.innerHTML = `<div class="scenario-label">Question sent to AI</div><div class="scenario-q">${rd.question}</div>`;
  rd.claims.forEach((c,i) => {
    const div = document.createElement('div');
    div.className = 'claim';
    div.innerHTML = `<div class="claim-num">#${i+1}</div><div class="claim-text">${c.text}</div><div class="claim-verdict">${c.explain}</div>`;
    div.onclick = () => toggleClaim(div, i);
    list.appendChild(div);
  });

  const right = document.getElementById('rightPanel');
  right.innerHTML = `
    <div class="inst-box" style="background:rgba(220,38,38,.06);border:1.5px solid rgba(220,38,38,.2);color:#991b1b">
      <strong>Challenge:</strong> The following is the AI's response, which contains fabricated content. Click the items you think are <strong>problematic</strong>, then press "Reveal Answer".
    </div>
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-num" style="color:var(--accent)" id="totalStat">${rd.claims.length}</div><div class="stat-lbl">总条目</div></div>
      <div class="stat-card"><div class="stat-num" style="color:var(--red)" id="fakeStat">?</div><div class="stat-lbl">Fabricated</div></div>
      <div class="stat-card"><div class="stat-num" style="color:var(--green)" id="yourStat">0</div><div class="stat-lbl">You Flagged</div></div>
    </div>
    <div class="lesson-box" id="lessonBox" style="display:none"></div>
    <div class="pattern-list" id="patternList" style="display:none"></div>
    <div class="lesson-box" style="background:rgba(217,119,6,.06);border-color:rgba(217,119,6,.2)">
      <strong>Tip:</strong> Watch out for items that provide <em>unusually specific details</em> (names, numbers, ratings, chapter counts) — the more detail, the more suspicious.
    </div>
  `;
}

function toggleClaim(el, idx) {
  if (revealed) return;
  el.classList.toggle('selected');
  if (userSelections.has(idx)) userSelections.delete(idx); else userSelections.add(idx);
  document.getElementById('yourStat').textContent = userSelections.size;
}

function revealAll() {
  if (revealed) return;
  revealed = true;
  const rd = ROUNDS[curRound];
  const fakeCount = rd.claims.filter(c => !c.truth).length;
  let correct = 0;
  document.querySelectorAll('.claim').forEach((el,i) => {
    if (i < 2) return; // skip scenario label and question
  });
  const claims = document.querySelectorAll('.claim');
  claims.forEach((el,i) => {
    const c = rd.claims[i];
    el.classList.remove('selected');
    el.classList.add(c.truth ? 'revealed-true' : 'revealed-false');
    el.onclick = null;
    if (!c.truth && userSelections.has(i)) correct++;
  });

  const allFakes = rd.claims.reduce((acc,c,i) => !c.truth ? acc.concat(i) : acc, []);
  const falsePositives = [...userSelections].filter(i => rd.claims[i].truth).length;
  document.getElementById('fakeStat').textContent = fakeCount;

  let msg, bg, color;
  if (correct === fakeCount && falsePositives === 0) {
    msg = 'Perfect! You accurately identified all fabricated items';
    bg = 'rgba(22,163,74,.1)'; color = 'var(--green)';
  } else if (correct === fakeCount) {
    msg = `Found all fabrications, but falsely flagged ${falsePositives} real item(s)`;
    bg = 'rgba(217,119,6,.1)'; color = 'var(--amber)';
  } else if (correct > 0) {
    msg = `Found ${correct}/${fakeCount} fabrications, some missed`;
    bg = 'rgba(217,119,6,.1)'; color = 'var(--amber)';
  } else {
    msg = 'No fabrications found — hallucinations really are hard to spot';
    bg = 'rgba(220,38,38,.1)'; color = 'var(--red)';
  }
  const badge = document.getElementById('scoreBadge');
  badge.textContent = msg; badge.style.background = bg; badge.style.color = color;
  document.getElementById('revealBtn').disabled = true;

  document.getElementById('lessonBox').style.display = 'block';
  document.getElementById('lessonBox').innerHTML = rd.lesson;
  const pl = document.getElementById('patternList');
  pl.style.display = 'flex';
  pl.innerHTML = '<div style="font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.4px">Common AI Fabrication Patterns</div>' +
    rd.patterns.map(p => `<div class="pattern-item"><div class="pattern-icon" style="background:${p.bg};color:${p.color}">${p.icon}</div><span>${p.text}</span></div>`).join('');
}

const tabs = document.getElementById('roundTabs');
ROUNDS.forEach((r,i) => {
  const btn = document.createElement('button');
  btn.className = 'round-tab' + (i===0?' active':'');
  btn.textContent = 'Round ' + (i + 1);
  btn.onclick = () => renderRound(i);
  tabs.appendChild(btn);
});
renderRound(0);
</script>
