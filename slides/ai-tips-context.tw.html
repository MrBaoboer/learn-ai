<body>
<article class="lesson wide">
  <header class="lesson-header">
    <div class="kicker">實用技巧</div>
    <h1>好提問 vs 壞提問：<em>上下文決定一切</em></h1>
    <p class="subtitle">同一個 AI，提問方式不同，輸出天差地別。點選場景切換對比。</p>
  </header><!--seo:begin--><aside class="xa-tldr"><span class="xa-tldr-tag">一句話速覽</span><p>上下文決定輸出品質，同一個問題好壞對比演示</p></aside><!--seo:end-->  <div class="sec-label">選擇場景</div>
  <div class="scene-row" id="sceneRow"></div>

  <div class="sec-label">對比演示</div>
  <div class="compare">
    <div class="cmp-col cmp-bad" id="colBad"></div>
    <div class="cmp-col cmp-good" id="colGood"></div>
  </div>
  <div class="insight" id="insightBar"></div>
</article>
<script>
const SCENES = [
  {
    name: '寫週報',
    bad: {
      prompt: '幫我寫個週報',
      response: '本週完成了相關工作任務，參與了多個專案的推進，與團隊進行了有效溝通。下週將繼續推進各項工作，確保按時完成目標…',
      tags: ['沒有具體內容', '全是廢話模板', '誰都能套用'],
    },
    good: {
      prompt: '我是產品經理，本週：1）完成了使用者調研報告（訪談 8 人）；2）評審了 v2.3 需求，砍掉了 3 個低優先順序功能；3）和開發對齊了排期，延期 2 天。\n\n請幫我寫一份簡潔的週報，重點突出決策和進展，風格務實不吹牛，3 段以內。',
      response: '本週聚焦 v2.3 版本推進。<span class="highlight">完成 8 人使用者調研</span>，發現核心痛點集中在首次使用流程，報告已同步設計團隊。需求評審中<span class="highlight">主動砍掉 3 個低優先順序功能</span>，確保核心鏈路資源集中。開發排期對齊後<span class="highlight">預計延期 2 天</span>，已與 PMO 同步調整里程碑。',
      tags: ['內容具體', '有決策有資料', '風格匹配'],
    },
    insight: '差別在哪？好的提問給了 <em>角色 + 事實 + 風格要求</em>。AI 不是不會寫，是<strong>不知道該寫什麼</strong>— 你給的背景越充分，輸出越精準。'
  },
  {
    name: '分析資料',
    bad: {
      prompt: '幫我分析一下資料',
      response: '資料分析需要從多個維度展開。首先要明確分析目的，然後收集相關資料，接著選擇合適的分析方法…建議使用 Excel 或 Python 進行資料處理。',
      tags: ['在講廢話', '沒有任何分析', '教科書式敷衍'],
    },
    good: {
      prompt: '以下是我們 App 最近 7 天的資料：\n- DAU: 12k→15k→14k→13k→18k→16k→15k\n- 新增註冊: 800→1200→950→900→1500→1100→980\n- 次日留存: 35%→32%→33%→31%→28%→30%→29%\n\n請幫我找出異常點，分析可能原因，給出 3 條可執行建議。',
      response: '<strong>異常點：</strong>第 5 天 DAU 和註冊同步跳漲（<span class="highlight">DAU +38%，註冊 +67%</span>），推測有一波外部流量湧入（投放/推薦/熱點事件）。\n\n<strong>隱憂：</strong>次日留存從第 5 天開始<span class="highlight">持續下降到 28-29%</span>，說明新增使用者品質偏低，未被有效承接。\n\n<strong>建議：</strong>①查明第 5 天流量來源，評估 ROI；②優化新使用者首日引導流程；③對低留存渠道降低投放權重。',
      tags: ['定位異常', '歸因分析', '可執行建議'],
    },
    insight: '差別在哪？壞提問沒給資料，AI 只能講方法論。好提問<em>直接把資料貼進去</em>，AI 立刻變成了分析師。<strong>AI 需要原料才能幹活。</strong>'
  },
  {
    name: '起草郵件',
    bad: {
      prompt: '幫我寫封郵件給客戶',
      response: '尊敬的客戶：\n\n您好！感謝您一直以來的支援與信任。我寫信是為了與您溝通相關事宜…\n\n期待您的回覆。\n\n此致\n敬禮',
      tags: ['沒有主題', '空洞客套', '完全沒法用'],
    },
    good: {
      prompt: '場景：客戶（張總，製造業，合作 2 年）的系統上週出了 Bug，導致他們生產線停了 4 小時。我們已修復，但客戶很不滿。\n\n請寫一封道歉 + 覆盤郵件：態度誠懇但不卑微，說明根因和整改措施，語氣正式但不生硬，控制在 200 字以內。',
      response: '張總好：\n\n上週系統故障給貴司生產造成的影響，我們深表歉意。\n\n<span class="highlight">根因</span>：資料庫連線池在高併發時溢位，觸發服務中斷。<span class="highlight">整改</span>：已完成連線池擴容 + 熔斷機制部署，並新增 24h 監控告警。\n\n為避免再次發生，我們將在本週提供一次<span class="highlight">免費系統健康檢查</span>，由技術負責人直接對接。\n\n後續如有任何問題，隨時聯絡我。',
      tags: ['態度得體', '根因+措施', '有補償方案'],
    },
    insight: '差別在哪？好的提問給了 <em>完整場景（人物、事件、情緒、限制）</em>。寫郵件不是打字，是<strong>在特定場景下溝通</strong>— 場景越清晰，郵件越得體。'
  },
  {
    name: '學習概念',
    bad: {
      prompt: '什麼是 RAG？',
      response: 'RAG（Retrieval-Augmented Generation）即檢索增強生成，是一種結合檢索和生成的方法。它透過從外部知識庫中檢索相關資訊，並將其作為上下文提供給語言模型，從而提高生成品質和準確性…',
      tags: ['百科式回答', '看完還是不懂', '沒有直覺'],
    },
    good: {
      prompt: '我是產品經理，完全不懂技術。請用一個生活類比解釋 RAG 是什麼、解決什麼問題。\n\n要求：先用一句話說結論，然後用類比展開，最後告訴我作為產品經理需要關心 RAG 的哪一點。',
      response: '<strong>一句話：</strong>RAG 就是讓 AI 在回答之前先去查資料，告別全憑記憶。\n\n<span class="highlight">類比：</span>想像你問一個學霸「公司報銷流程是什麼」。學霸再聰明，沒看過你公司的制度就只能瞎猜。但如果你先把《報銷制度》遞給他，他邊看邊答，這就是 RAG。\n\n<strong>產品經理關心的：</strong>①遞資料的品質決定回答品質（檢索準不準）；②資料太多會超出視窗被截斷；③RAG 不是萬能的，資料裡沒有的知識它還是會編。',
      tags: ['類比直覺', '結構清晰', '角色化建議'],
    },
    insight: '差別在哪？好提問說清了<em>我是誰、我要什麼形式、我關心什麼角度</em>。學東西時，<strong>「用什麼方式教我」比「教我什麼」更重要</strong>。'
  },
  {
    name: '創意文案',
    bad: {
      prompt: '寫個廣告語',
      response: '讓生活更美好！\n品質之選，值得信賴。\n與您同行，共創未來。',
      tags: ['萬能廢話', '毫無特色', '套誰身上都行'],
    },
    good: {
      prompt: '產品：一款面向 25-35 歲獨居青年的智慧香薰機，主打「回家有儀式感」。\n\n品牌調性：溫暖但不矯情，有點小幽默。\n\n請給 5 條備選廣告語，每條不超過 15 字，避免「品質」「智慧」「科技」這些爛大街的詞。',
      response: '1. <span class="highlight">推門那一刻，家在等你。</span>\n2. 一個人住，也值得被香氣擁抱。\n3. <span class="highlight">別人加班到崩潰，你回家聞見薰衣草。</span>\n4. 儀式感不貴，插電就有。\n5. 房子是租的，味道是自己的。',
      tags: ['精準人群', '風格匹配', '直接能用'],
    },
    insight: '差別在哪？好提問給了<em>產品、人群、調性、禁用詞、格式約束</em>。創意不是天馬行空，是<strong>在明確框架內的發揮</strong>— 框架越清晰，創意越精準。'
  }
];

function renderScene(idx) {
  document.querySelectorAll('.scene-chip').forEach((c,i) => c.classList.toggle('active', i===idx));
  const s = SCENES[idx];

  document.getElementById('colBad').innerHTML = `
    <div class="cmp-label">❌ 壞提問</div>
    <div class="msg-bubble msg-user-bad"><div class="msg-lbl">你說</div>${s.bad.prompt.replace(/\n/g,'<br>')}</div>
    <div class="msg-bubble msg-ai"><div class="msg-lbl">AI 回答</div>${s.bad.response.replace(/\n/g,'<br>')}</div>
    <div style="display:flex;gap:5px;flex-wrap:wrap">${s.bad.tags.map(t=>`<span class="diff-tag diff-bad">${t}</span>`).join('')}</div>
  `;
  document.getElementById('colGood').innerHTML = `
    <div class="cmp-label">✅ 好提問</div>
    <div class="msg-bubble msg-user-good"><div class="msg-lbl">你說</div>${s.good.prompt.replace(/\n/g,'<br>')}</div>
    <div class="msg-bubble msg-ai"><div class="msg-lbl">AI 回答</div>${s.good.response.replace(/\n/g,'<br>')}</div>
    <div style="display:flex;gap:5px;flex-wrap:wrap">${s.good.tags.map(t=>`<span class="diff-tag diff-good">${t}</span>`).join('')}</div>
  `;
  document.getElementById('insightBar').innerHTML = `
    <div class="insight-icon">💡</div>
    <div class="insight-text">${s.insight}</div>
  `;
}

const row = document.getElementById('sceneRow');
SCENES.forEach((s,i) => {
  const btn = document.createElement('button');
  btn.className = 'scene-chip' + (i===0?' active':'');
  btn.textContent = s.name;
  btn.onclick = () => renderScene(i);
  row.appendChild(btn);
});
renderScene(0);
</script>
