<style>
:root { --accent2: var(--danger); --green: var(--success); --red: var(--danger); --amber: #d97706; --blue: #2563eb; --muted: var(--sub); --surface: var(--card); }

/* ── 筛选按钮 ── */
.filter-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.filter-row .fl-lbl { font-size: 13px; color: var(--sub); font-weight: 600; }
.filter-btn {
  padding: 9px 16px; border-radius: var(--radius-sm);
  border: 1.5px solid var(--border); background: var(--card);
  font-size: 13px; font-weight: 700; cursor: pointer;
  transition: all 0.15s; color: var(--sub); font-family: inherit; min-height: 40px;
}
.filter-btn.active { color: white; }
.filter-btn.f-all.active { background: var(--danger); border-color: var(--danger); }
.filter-btn.f-tier.active { background: var(--amber); border-color: var(--amber); }
.filter-btn.f-role.active { background: var(--blue); border-color: var(--blue); }

/* ── 主从布局 ── */
.gov-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
.card-list { display: flex; flex-direction: column; gap: 10px; }

.scene-card {
  background: var(--card); border: 2px solid var(--border);
  border-radius: var(--radius); padding: 14px 16px; cursor: pointer;
  transition: all 0.2s; display: flex; gap: 12px; align-items: flex-start;
  box-shadow: var(--shadow-card);
}
.scene-card:hover { transform: translateX(3px); box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
.scene-card.active { border-color: var(--danger); background: rgba(220,38,38,0.03); }
.scene-card.hidden { display: none; }
.sc-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 800; flex-shrink: 0; }
.sc-body { flex: 1; min-width: 0; }
.sc-title { font-size: 15px; font-weight: 800; color: var(--text); margin-bottom: 2px; }
.sc-desc { font-size: 13px; color: var(--sub); line-height: 1.45; }
.sc-risk { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 5px; font-size: 10px; font-weight: 800; margin-top: 6px; }

/* ── 详情面板 ── */
.detail-panel { display: flex; flex-direction: column; gap: 12px; position: sticky; top: 20px; }
.detail-hd { display: flex; align-items: center; gap: 12px; }
.detail-icon { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 800; flex-shrink: 0; }
.detail-title { font-size: 19px; font-weight: 800; color: var(--text); }
.detail-risk { font-size: 12px; font-weight: 700; margin-top: 2px; }

.info-card {
  background: var(--card); border: 1.5px solid var(--border);
  border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow-card);
}
.ic-label { font-size: 11px; font-weight: 800; letter-spacing: 0.4px; text-transform: uppercase; margin-bottom: 8px; }
.ic-body { font-size: 14px; color: var(--sub); line-height: 1.7; }
.ic-body strong { color: var(--text); }
.ic-body em { font-style: normal; font-weight: 700; }
.ic-list { display: flex; flex-direction: column; gap: 6px; }
.ic-item { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; line-height: 1.55; color: var(--sub); }
.ic-dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; margin-top: 7px; }

.do-dont { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.dd-col { border-radius: var(--radius-sm); padding: 12px 14px; font-size: 13px; line-height: 1.65; }
.dd-col strong { display: block; font-size: 11px; letter-spacing: 0.3px; margin-bottom: 5px; }
.dd-do { background: rgba(22,163,74,0.06); border: 1px solid rgba(22,163,74,0.15); color: #14532d; }
.dd-do strong { color: var(--success); }
.dd-dont { background: rgba(220,38,38,0.06); border: 1px solid rgba(220,38,38,0.15); color: #7c2d12; }
.dd-dont strong { color: var(--danger); }

.tip-strip { border-radius: var(--radius-sm); padding: 12px 16px; font-size: 13px; line-height: 1.65; }

@media (max-width: 768px) {
  .gov-cols { grid-template-columns: 1fr; }
  .detail-panel { position: static; }
  .do-dont { grid-template-columns: 1fr; }
}
</style>

<body>
<article class="lesson wide">

  <header class="lesson-header">
    <div class="kicker">Prompt Safety</div>
    <h1>Risk Tiers & Accountability</h1>
    <p class="subtitle">Using AI isn't just about whether it works. Match control intensity to risk tier (L1/L2/L3), and clarify who is accountable via the responsibility chain (User/Approver/Manager). Click any item on the left for details.</p>
  </header>

  <div class="sec-label">
    Filter View
  </div>

  <div class="filter-row">
    <span class="fl-lbl">Show:</span>
    <button class="filter-btn f-all active" onclick="filterBy('all',this)">All</button>
    <button class="filter-btn f-tier" onclick="filterBy('tier',this)">Risk Tiers</button>
    <button class="filter-btn f-role" onclick="filterBy('role',this)">Accountability Chain</button>
  </div>

  <div class="gov-cols" style="margin-top:16px">
    <div class="card-list" id="cardList"></div>
    <div class="detail-panel" id="detailPanel"></div>
  </div>

<script>
const ITEMS = [
  {
    cat:'tier', icon:'L1', iconBg:'rgba(22,163,74,.1)', iconColor:'var(--green)',
    title:'L1 · Low Risk — Daily Assistance', desc:'Writing emails, summarizing, translating, brainstorming',
    riskText:'Low Risk', riskBg:'rgba(22,163,74,.1)', riskColor:'var(--green)',
    detail:{
      titleColor:'var(--green)',
      desc:'AI output is for internal reference only and does not directly affect external customers or critical business decisions. <strong>Most everyday AI use falls under L1.</strong>',
      controls:[
        {color:'#16a34a',text:'Use enterprise-authorized AI tools'},
        {color:'#16a34a',text:'Do not input sensitive data (customer info, financial data, etc.)'},
        {color:'#16a34a',text:'Perform a basic sanity check on AI output'},
      ],
      doList:['Use AI to draft emails, summaries, translations','Use AI for brainstorming and ideation','Use AI to organize public information and study notes'],
      dontList:['Paste internal data into AI without anonymization','Send AI output directly without reviewing it','Assume L1 means no need to check output'],
      tip:{bg:'rgba(22,163,74,.06)',color:'#14532d',text:'<strong>Approval requirement:</strong> No additional approval needed; users exercise their own judgment. <strong>Remember:</strong> low risk does not mean zero risk — output still needs a review.'}
    }
  },
  {
    cat:'tier', icon:'L2', iconBg:'rgba(217,119,6,.1)', iconColor:'var(--amber)',
    title:'L2 · Medium Risk — Business Decision Support', desc:'Generating external content, assisting with analytical reports, deploying AI-generated code',
    riskText:'Medium Risk', riskBg:'rgba(217,119,6,.1)', riskColor:'var(--amber)',
    detail:{
      titleColor:'var(--amber)',
      desc:'AI output will affect external customers, business processes, or publicly published content. <strong>Key principle: human review — AI does the work, humans provide oversight.</strong>',
      controls:[
        {color:'#d97706',text:'AI output must be reviewed by a human before use'},
        {color:'#d97706',text:'Externally published content must be labeled "AI-assisted"'},
        {color:'#d97706',text:'AI-generated code must pass security scanning (SAST / SCA)'},
        {color:'#d97706',text:'Retain AI interaction logs for audit and traceability'},
      ],
      doList:['AI drafts → human review → then use','Label external content with an AI indicator','Run security scan on code before deploying to production'],
      dontList:['Post AI-written copy directly to external channels','Deploy AI-generated code without testing','Skip the review process to save time'],
      tip:{bg:'rgba(217,119,6,.06)',color:'#78350f',text:'<strong>Approval requirement:</strong> Must be approved by a supervisor. <strong>Data rules:</strong> Internal business data must be anonymized before input; customer data must use the internal AI platform.'}
    }
  },
  {
    cat:'tier', icon:'L3', iconBg:'rgba(220,38,38,.1)', iconColor:'var(--red)',
    title:'L3 · High Risk — Autonomous Execution & Critical Decisions', desc:'Agent operating production systems, automated approvals, financial transactions',
    riskText:'High Risk', riskBg:'rgba(220,38,38,.1)', riskColor:'var(--red)',
    detail:{
      titleColor:'var(--red)',
      desc:'AI output directly impacts critical business operations, financial flows, or legal compliance — <strong>the cost of errors is extremely high. Key principle: controllable and reversible — be able to stop immediately if something goes wrong.</strong>',
      controls:[
        {color:'#dc2626',text:'Must be run and tested in a sandbox environment'},
        {color:'#dc2626',text:'Set a maximum step count; exceed it and trigger human confirmation'},
        {color:'#dc2626',text:'Must have a kill switch capability'},
        {color:'#dc2626',text:'Audit logs retained for at least 180 days'},
        {color:'#dc2626',text:'Regular red team testing and security assessments'},
      ],
      doList:['Thoroughly test in sandbox before going to production','Insert human confirmation checkpoints at each critical step','Maintain complete audit logs'],
      dontList:['Allow an Agent to directly operate the production database','Let AI run without a step limit','Go live without a kill switch'],
      tip:{bg:'rgba(220,38,38,.06)',color:'#7c2d12',text:'<strong>Approval requirement:</strong> Must be approved by the security committee + pre-launch security assessment. <strong>Highest-tier principle:</strong> When multiple risk dimensions are involved, apply the highest-tier controls.'}
    }
  },
  {
    cat:'role', icon:'U', iconBg:'rgba(37,99,235,.1)', iconColor:'var(--blue)',
    title:'User — Accountable for Your Own Actions', desc:'Every person using AI is the first responsible party',
    riskText:'Direct Liability', riskBg:'rgba(37,99,235,.1)', riskColor:'var(--blue)',
    detail:{
      titleColor:'var(--blue)',
      desc:'<em style="color:var(--blue)">AI does not replace the responsible party.</em> If a report written with AI contains errors, responsibility lies with you — not the AI. If AI usage leads to a data breach, you bear the consequences.',
      controls:[
        {color:'#2563eb',text:'Confirm the risk tier for the scenario before using AI, and follow corresponding controls'},
        {color:'#2563eb',text:'Review AI output for reasonableness; do not accept it blindly'},
        {color:'#2563eb',text:'Anonymize data before inputting it (default anonymization principle)'},
        {color:'#2563eb',text:'Report anomalies promptly; do not conceal or avoid them'},
      ],
      doList:['Assess risk tier before using AI','Verify accuracy of AI output','Anonymize data before inputting'],
      dontList:['"AI wrote it, not me" — attempting to shift blame','"Everyone does it this way" as an excuse','Input sensitive data and pretend it didn\'t happen'],
      tip:{bg:'rgba(37,99,235,.06)',color:'#1e40af',text:'<strong>Core principle:</strong> "Default anonymization": all data entered into AI should be anonymized by default, unless the data owner has explicitly authorized otherwise. Not sure? Then anonymize it.'}
    }
  },
  {
    cat:'role', icon:'A', iconBg:'rgba(217,119,6,.1)', iconColor:'var(--amber)',
    title:'Approver — Your Signature Means Accountability', desc:'Approval officer for L2/L3 scenarios',
    riskText:'Joint Liability', riskBg:'rgba(217,119,6,.1)', riskColor:'var(--amber)',
    detail:{
      titleColor:'var(--amber)',
      desc:'Must conduct a <em style="color:var(--amber)">substantive review</em> of what is being approved. "I just signed as a formality" <strong style="color:var(--red)">does not exempt you from liability</strong>. Failure to fulfill review obligations incurs joint liability.',
      controls:[
        {color:'#d97706',text:'Verify that the risk tier assigned to the AI use case is accurate'},
        {color:'#d97706',text:'Confirm that the corresponding tier\'s controls have been implemented'},
        {color:'#d97706',text:'Review data security and compliance'},
        {color:'#d97706',text:'Understand the substance of what you are approving; don\'t be a rubber stamp'},
      ],
      doList:['Understand the specific content of what you are approving','Confirm that controls are in place','Ask clarifying questions on anything uncertain'],
      dontList:['Sign without reading the content','Assume "the people below must have handled it"','Stop paying attention after approving'],
      tip:{bg:'rgba(217,119,6,.06)',color:'#78350f',text:'<strong>Remember:</strong> An approver\'s liability is not waived by "not knowing at the time." The moment you sign, you bear joint responsibility for that decision.'}
    }
  },
  {
    cat:'role', icon:'M', iconBg:'rgba(220,38,38,.1)', iconColor:'var(--red)',
    title:'Manager — Ensure Team-Wide Compliance', desc:'Management responsibility of department/team leads',
    riskText:'Management Liability', riskBg:'rgba(220,38,38,.1)', riskColor:'var(--red)',
    detail:{
      titleColor:'var(--red)',
      desc:'"I didn\'t know what my team was doing with AI" <strong style="color:var(--red)">is not a valid defense</strong>. Managers have an obligation to ensure their teams understand and follow the rules.',
      controls:[
        {color:'#dc2626',text:'Ensure team members understand and follow AI safety guidelines'},
        {color:'#dc2626',text:'Establish department-level AI usage management policies'},
        {color:'#dc2626',text:'Regularly organize AI safety training (such as this course)'},
        {color:'#dc2626',text:'Take management responsibility for AI safety incidents within the department'},
      ],
      doList:['Organize team learning of AI safety guidelines','Establish department AI usage registration policies','Proactively understand how your team is using AI'],
      dontList:['Turn a blind eye to team AI usage','Push all safety responsibility onto the security department','Only start paying attention after an incident occurs'],
      tip:{bg:'rgba(220,38,38,.06)',color:'#7c2d12',text:'<strong>Consequences of violations (all roles):</strong> Depending on severity: revocation of AI usage privileges, disciplinary action, joint compensation liability, and in serious cases, legal prosecution.'}
    }
  }
];

function renderCards(filter) {
  const list = document.getElementById('cardList');
  list.innerHTML = '';
  ITEMS.forEach((s,i) => {
    const card = document.createElement('div');
    card.className = 'scene-card' + (i===0?' active':'');
    card.dataset.cat = s.cat;
    if (filter !== 'all' && s.cat !== filter) card.classList.add('hidden');
    card.innerHTML = `
      <div class="sc-icon" style="background:${s.iconBg};color:${s.iconColor};font-weight:800">${s.icon}</div>
      <div class="sc-body">
        <div class="sc-title">${s.title}</div>
        <div class="sc-desc">${s.desc}</div>
        <span class="sc-risk" style="background:${s.riskBg};color:${s.riskColor}">${s.riskText}</span>
      </div>
    `;
    card.onclick = () => {
      document.querySelectorAll('.scene-card').forEach(c => c.classList.remove('active'));
      card.classList.add('active');
      showDetail(i);
    };
    list.appendChild(card);
  });
}

function showDetail(idx) {
  const s = ITEMS[idx];
  const d = s.detail;
  const panel = document.getElementById('detailPanel');
  panel.innerHTML = `
    <div class="detail-hd">
      <div class="detail-icon" style="background:${s.iconBg};color:${s.iconColor};font-weight:800;font-size:18px">${s.icon}</div>
      <div>
        <div class="detail-title">${s.title.split(' — ')[0]}</div>
        <div class="detail-risk" style="color:${d.titleColor}">${s.riskText}</div>
      </div>
    </div>
    <div class="info-card">
      <div class="ic-label" style="color:${d.titleColor}">Overview</div>
      <div class="ic-body">${d.desc}</div>
    </div>
    <div class="info-card">
      <div class="ic-label" style="color:${d.titleColor}">${s.cat==='tier'?'Control Requirements':'Core Responsibilities'}</div>
      <div class="ic-list">${d.controls.map(c=>`<div class="ic-item"><div class="ic-dot" style="background:${c.color}"></div><span>${c.text}</span></div>`).join('')}</div>
    </div>
    <div class="do-dont">
      <div class="dd-col dd-do">
        <strong>DO</strong>
        ${d.doList.map(x => '· ' + x).join('<br>')}
      </div>
      <div class="dd-col dd-dont">
        <strong>DON'T</strong>
        ${d.dontList.map(x => '· ' + x).join('<br>')}
      </div>
    </div>
    <div class="tip-strip" style="background:${d.tip.bg};border:1px solid ${d.tip.bg.replace('.06','.15')};color:${d.tip.color}">
      ${d.tip.text}
    </div>
  `;
}

function filterBy(cat, btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.scene-card').forEach(card => {
    if (cat === 'all' || card.dataset.cat === cat) {
      card.classList.remove('hidden');
    } else {
      card.classList.add('hidden');
    }
  });
  const firstVisible = document.querySelector('.scene-card:not(.hidden)');
  if (firstVisible) firstVisible.click();
}

renderCards('all');
showDetail(0);
</script>
