.panel-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:8px}
@media(max-width:768px){.panel-grid{grid-template-columns:1fr}}
.panel{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow-card);cursor:pointer;transition:border-color .25s,box-shadow .25s}
.panel:hover{border-color:var(--accent);box-shadow:var(--shadow-pop)}
.panel.active{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,102,255,.12)}
.panel-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:12px}
.panel h3{font-size:16px;font-weight:800;color:var(--text);margin-bottom:6px}
.panel p{font-size:13px;color:var(--sub);line-height:1.6}

.viz-area{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow-card);margin-top:16px;min-height:260px;position:relative}
.viz-title{font-size:14px;font-weight:700;color:var(--text);margin-bottom:16px}

.bar-chart{display:flex;align-items:flex-end;gap:8px;height:180px;padding-top:10px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.bar-fill{width:100%;border-radius:6px 6px 0 0;transition:height .6s ease;position:relative}
.bar-fill .cost-label{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:700;white-space:nowrap}
.bar-label{font-size:11px;color:var(--sub);font-weight:600}

.heat-row{display:flex;gap:4px;margin-bottom:8px;align-items:center}
.heat-cell{flex:1;height:38px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;transition:all .5s}
.heat-legend{display:flex;gap:12px;margin-top:12px;font-size:12px;color:var(--sub);align-items:center}
.heat-legend span{display:flex;align-items:center;gap:4px}
.heat-legend .dot{width:12px;height:12px;border-radius:3px}

.progress-wrap{margin-top:8px}
.progress-bar-outer{height:28px;background:rgba(0,0,0,.06);border-radius:14px;overflow:hidden;position:relative}
.progress-bar-inner{height:100%;border-radius:14px;transition:width .8s ease;display:flex;align-items:center;justify-content:flex-end;padding-right:10px;font-size:12px;font-weight:800;color:#fff}
.progress-step{display:flex;justify-content:space-between;margin-top:8px}
.progress-step span{font-size:11px;color:var(--sub);font-weight:600}
.progress-info{font-size:13px;color:var(--sub);margin-top:12px;line-height:1.7}

.play-btn{background:var(--accent);color:#fff;border:none;padding:9px 22px;border-radius:999px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:transform .15s,box-shadow .15s;box-shadow:0 3px 10px rgba(0,102,255,.2);margin-top:14px}
.play-btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(0,102,255,.3)}
.play-btn:active{transform:translateY(0)}
.play-btn:disabled{background:#c4c8cf;cursor:not-allowed;box-shadow:none;transform:none}

.takeaway{background:rgba(0,102,255,.04);border:1.5px solid rgba(0,102,255,.18);border-radius:var(--radius);padding:16px 20px;font-size:15px;color:var(--text);display:flex;gap:10px;line-height:1.7;margin-top:24px}
.takeaway b{color:var(--accent)}
</style>

    <h1>對話越長越貴、越長越笨</h1>

  </header><!--seo:begin--><aside class="xa-tldr"><span class="xa-tldr-tag">一句話速覽</span><p>費用遞增 + 注意力衰減 + 窗口有限，三個必須管理上下文的理由</p></aside><!--seo:end-->  <div class="sec-label">三個必須管理上下文的理由</div>

    <div class="panel active reveal" onclick="showViz(0)" id="panel0">
      <div class="panel-icon" style="background:rgba(0,102,255,.08);color:var(--accent)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></div>

    </div>
    <div class="panel reveal" onclick="showViz(1)" id="panel1">
      <div class="panel-icon" style="background:rgba(217,119,6,.08);color:var(--amber)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/><path d="M9 18h6"/><path d="M10 22h4"/></svg></div>
      <h3>越長越笨</h3>
      <p>注意力兩頭熱、中間冷，中間的資訊最容易被忽略</p>

    <div class="panel reveal" onclick="showViz(2)" id="panel2">
      <div class="panel-icon" style="background:rgba(220,38,38,.08);color:var(--danger)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg></div>

  <div class="viz-area reveal paywall-locked" id="vizArea"></div>

  <div class="takeaway reveal paywall-locked">
    <span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg></span>

<script>
var currentViz = 0;

function showViz(idx) {
  currentViz = idx;
  document.querySelectorAll('.panel').forEach(function(p, i) {
    p.classList.toggle('active', i === idx);
  });
  if (idx === 0) renderCost();
  else if (idx === 1) renderAttention();
  else renderWindow();
}

function renderCost() {
  var area = document.getElementById('vizArea');
  var rounds = [
    { label: '第1輪', tokens: 500, cost: 0.01 },
    { label: '第2輪', tokens: 1200, cost: 0.024 },
    { label: '第3輪', tokens: 2100, cost: 0.042 },
    { label: '第4輪', tokens: 3200, cost: 0.064 },
    { label: '第5輪', tokens: 4500, cost: 0.09 },
    { label: '第6輪', tokens: 6000, cost: 0.12 },
    { label: '第7輪', tokens: 7800, cost: 0.156 },
    { label: '第8輪', tokens: 9800, cost: 0.196 }
  ];
  var maxT = 9800;
  var html = '<div class="viz-title"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:4px"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg> 每輪對話的 token 消耗（逐輪遞增）</div>';
  html += '<div class="bar-chart" id="barChart">';
  rounds.forEach(function(r, i) {
    var h = Math.round((r.tokens / maxT) * 160);
    var intensity = Math.round(100 + (i / 7) * 155);
    html += '<div class="bar-col">'
      + '<div class="bar-fill" id="bar' + i + '" style="height:0;background:rgb(0,' + (150 - i * 15) + ',' + intensity + ')">'
      + '<span class="cost-label" style="color:rgb(0,' + (150 - i * 15) + ',' + intensity + ')">$' + r.cost.toFixed(3) + '</span>'
      + '</div>'
      + '<span class="bar-label">' + r.label + '</span>'
      + '</div>';
  });
  html += '</div>';
  html += '<div style="margin-top:14px;font-size:13px;color:var(--sub);line-height:1.7">'
    + '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:4px"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg> 第 8 輪的單次調用成本是第 1 輪的 <b style="color:var(--accent)">20 倍</b>，因為每一輪都要把前面所有對話重新發送給模型。'
    + '</div>';
  html += '<button class="play-btn" onclick="animateBars()"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" stroke="none" style="vertical-align:-1px;margin-right:3px"><polygon points="5 3 19 12 5 21 5 3"/></svg> 播放動畫</button>';
  area.innerHTML = html;
  setTimeout(function() {
    rounds.forEach(function(r, i) {
      var h = Math.round((r.tokens / maxT) * 160);
      document.getElementById('bar' + i).style.height = h + 'px';
    });
  }, 100);
}

function animateBars() {
  var bars = document.querySelectorAll('.bar-fill');
  bars.forEach(function(b) { b.style.height = '0'; });
  var heights = [8, 20, 34, 52, 74, 98, 128, 160];
  bars.forEach(function(b, i) {
    setTimeout(function() { b.style.height = heights[i] + 'px'; }, i * 200);
  });
}

function renderAttention() {
  var area = document.getElementById('vizArea');
  var msgs = [
    { role: 'system', text: 'System Prompt', attn: 0.9 },
    { role: 'user', text: '用戶第1條消息', attn: 0.75 },
    { role: 'ai', text: 'AI 回覆 1', attn: 0.35 },
    { role: 'user', text: '用戶第2條消息', attn: 0.25 },
    { role: 'ai', text: 'AI 回覆 2', attn: 0.15 },
    { role: 'user', text: '用戶第3條消息', attn: 0.12 },
    { role: 'ai', text: 'AI 回覆 3', attn: 0.10 },
    { role: 'user', text: '用戶第4條消息', attn: 0.18 },
    { role: 'ai', text: 'AI 回覆 4', attn: 0.30 },
    { role: 'user', text: '最新一條消息', attn: 0.95 }
  ];
  var html = '<div class="viz-title"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:4px"><path d="M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/><path d="M9 18h6"/><path d="M10 22h4"/></svg> 注意力分佈熱力圖（兩頭熱、中間冷）</div>';
  html += '<div style="margin-bottom:12px">';
  msgs.forEach(function(m) {
    var r, g, b;
    if (m.attn > 0.6) { r = 0; g = Math.round(102 + m.attn * 50); b = 255; }
    else if (m.attn > 0.3) { r = Math.round(217); g = Math.round(119 + (1 - m.attn) * 60); b = 6; }
    else { r = 220; g = Math.round(38 + (1 - m.attn) * 100); b = 38; }
    var bg = 'rgba(' + r + ',' + g + ',' + b + ',' + (0.15 + m.attn * 0.7) + ')';
    var textColor = m.attn > 0.5 ? '#fff' : 'var(--text)';
    html += '<div class="heat-row">';
    html += '<div class="heat-cell" style="background:' + bg + ';color:' + textColor + '">' + m.text + '</div>';
    html += '<span style="font-size:12px;font-weight:700;color:var(--sub);width:40px;text-align:right;flex-shrink:0">' + Math.round(m.attn * 100) + '%</span>';
    html += '</div>';
  });
  html += '</div>';
  html += '<div class="heat-legend">';
  html += '<span><span class="dot" style="background:rgba(0,102,255,.75)"></span>高注意力</span>';
  html += '<span><span class="dot" style="background:rgba(217,150,6,.5)"></span>中等</span>';
  html += '<span><span class="dot" style="background:rgba(220,100,38,.25)"></span>低注意力</span>';
  html += '</div>';
  html += '<div style="margin-top:12px;font-size:13px;color:var(--sub);line-height:1.7">'
    + '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:4px"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg> 中間的資訊注意力最低：如果用戶在第3輪提過一個重要需求，到第8輪時 AI 很可能已經忘了。'
    + '</div>';
  area.innerHTML = html;
}

function renderWindow() {
  var area = document.getElementById('vizArea');
  var html = '<div class="viz-title"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:4px"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg> 上下文窗口填充進度</div>';
  html += '<div id="windowDemo">';
  html += '<div class="progress-wrap">';
  html += '<div class="progress-bar-outer"><div class="progress-bar-inner" id="progBar" style="width:0%;background:var(--success)"></div></div>';
  html += '<div class="progress-step"><span>0 tokens</span><span>128K 上限</span></div>';
  html += '</div>';
  html += '<div class="progress-info" id="progInfo">點擊下方按鈕，模擬對話不斷增長的過程</div>';
  html += '<button class="play-btn" onclick="animateWindow()"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" stroke="none" style="vertical-align:-1px;margin-right:3px"><polygon points="5 3 19 12 5 21 5 3"/></svg> 模擬對話增長</button>';
  html += '</div>';
  area.innerHTML = html;
}

var windowTimer;
function animateWindow() {
  if (windowTimer) clearInterval(windowTimer);
  var bar = document.getElementById('progBar');
  var info = document.getElementById('progInfo');
  var pct = 0;
  var round = 0;
  bar.style.width = '0%';
  bar.style.background = 'var(--success)';

  windowTimer = setInterval(function() {
    round++;
    pct += 5 + Math.round(Math.random() * 8);
    if (pct > 100) pct = 100;
    bar.style.width = pct + '%';

    if (pct < 50) {
      bar.style.background = 'var(--success)';
      bar.textContent = pct + '%';
      info.innerHTML = '第 ' + round + ' 輪 · 已使用 ' + pct + '% · <span style="color:var(--success)">安全</span>';
    } else if (pct < 80) {
      bar.style.background = 'var(--amber)';
      bar.textContent = pct + '%';
      info.innerHTML = '第 ' + round + ' 輪 · 已使用 ' + pct + '% · <span style="color:var(--amber)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg> 注意</span>，該考慮壓縮了';
    } else if (pct < 100) {
      bar.style.background = 'var(--danger)';
      bar.textContent = pct + '%';
      info.innerHTML = '第 ' + round + ' 輪 · 已使用 ' + pct + '% · <b><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg> 危險！即將溢出</b>';
    } else {
      bar.style.background = 'var(--danger)';
      bar.textContent = '溢出!';
