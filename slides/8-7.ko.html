<style>
@keyframes _si{to{opacity:1}}
body{opacity:0;animation:_si .15s ease .08s forwards}

:root{
  --red:var(--danger);
  --green:var(--success);
  --orange:var(--amber);
  --purple:#5b4fcf;
  --surface:var(--card);
  --surface2:#f0ede6;
  --muted:var(--sub);
}

.lesson-header h1 em{font-style:normal;color:var(--purple)}

.problem-box{background:rgba(91,79,207,.06);border:1px solid rgba(91,79,207,.2);border-radius:10px;padding:14px 16px}
.problem-box .pb-title{font-size:15px;font-weight:800;color:var(--purple);margin-bottom:6px}
.problem-row{display:flex;align-items:flex-start;gap:8px;font-size:15px;color:var(--sub);line-height:1.6;margin-bottom:4px}
.problem-row b{color:var(--text)}

.strat-list{display:flex;flex-direction:column;gap:8px}
.strat-btn{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:10px;background:var(--surface);border:1.5px solid var(--border);cursor:pointer;font-family:inherit;text-align:left;transition:all .18s;width:100%}
.strat-btn:hover{border-color:rgba(91,79,207,.3)}
.strat-btn.active{border-color:var(--purple);background:rgba(91,79,207,.04);box-shadow:0 2px 10px rgba(91,79,207,.1)}
.sn{width:32px;height:32px;border-radius:8px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;color:var(--muted);flex-shrink:0;transition:all .18s}
.strat-btn.active .sn{background:var(--purple);color:white}
.si h5{font-size:16px;font-weight:800;color:var(--text);margin-bottom:2px}
.si p{font-size:14px;color:var(--sub)}
.saving{margin-left:auto;font-size:15px;font-weight:900;flex-shrink:0}

.demo-title{font-size:18px;font-weight:800;color:var(--text);margin-bottom:12px}
.demo-area{display:flex;flex-direction:column;gap:10px}

/* === Strategy 1: Dynamic Few-Shot Retrieval === */
.fewshot-wrap{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fs-col{display:flex;flex-direction:column;gap:6px}
.fs-col-title{font-size:14px;font-weight:700;padding:6px 10px;border-radius:6px;text-align:center;flex-shrink:0}
.fs-col-title.bad{background:rgba(220,38,38,.1);color:var(--red)}
.fs-col-title.good{background:rgba(22,163,74,.1);color:var(--green)}
.case-pool{flex:1;display:flex;flex-direction:column;gap:4px;overflow-y:auto;max-height:340px}
.case-item{padding:8px 10px;border-radius:7px;border:1.5px solid var(--border);background:var(--surface);font-size:13px;color:var(--sub);line-height:1.4;cursor:default;transition:all .3s;flex-shrink:0}
.case-item .ci-q{font-weight:700;color:var(--text);font-size:13px}
.case-item.selected{border-color:var(--green);background:rgba(22,163,74,.06);color:var(--green)}
.case-item.greyed{opacity:.3}
.prompt-box{flex:1;background:#1e1e2e;border-radius:8px;padding:12px 14px;font-family:monospace;font-size:12.5px;color:#cdd6f4;overflow-y:auto;line-height:1.6;white-space:pre-wrap;min-height:200px;max-height:340px}
.prompt-box .p-sys{color:#cba6f7}
.prompt-box .p-case{color:#a6e3a1}
.prompt-box .p-user{color:#89b4fa}
.tok-bar{display:flex;align-items:center;gap:8px;flex-shrink:0}
.tok-track{flex:1;height:10px;border-radius:5px;background:var(--surface2);overflow:hidden}
.tok-fill{height:100%;border-radius:5px;transition:width .6s ease}
.tok-num{font-size:14px;font-weight:800;min-width:70px;text-align:right}
.btn-sim{padding:10px 18px;border-radius:8px;font-size:15px;font-weight:700;border:none;cursor:pointer;font-family:inherit;transition:all .2s}
.btn-primary{background:var(--purple);color:white}
.btn-reset{background:var(--surface2);color:var(--sub);border:1px solid var(--border)}

/* === Strategy 2: Document Compression === */
.compress-wrap{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.doc-box{flex:1;border:1.5px solid var(--border);border-radius:8px;padding:12px 14px;font-size:13px;line-height:1.75;color:var(--sub);overflow-y:auto;background:var(--surface);max-height:380px}
.doc-box .keep{color:var(--text);font-weight:500}
.doc-box .drop{color:rgba(220,38,38,.35);text-decoration:line-through;transition:all .4s}
.doc-box .drop.hidden{display:none}
.compress-ctrl{display:flex;flex-direction:column;gap:8px}
.slider-row{display:flex;align-items:center;gap:10px}
.slider-label{font-size:14px;font-weight:700;color:var(--muted);white-space:nowrap}
input[type=range]{flex:1;-webkit-appearance:none;height:6px;border-radius:3px;outline:none;cursor:pointer;background:linear-gradient(to right,var(--purple) 0%,var(--purple) var(--pct,30%),var(--surface2) var(--pct,30%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--purple);box-shadow:0 2px 6px rgba(91,79,207,.35);cursor:pointer}

/* === Strategy 3: Attention Heatmap === */
.attn-wrap{display:flex;flex-direction:column;gap:8px}
.attn-prompt{display:flex;flex-direction:column;gap:6px}
.attn-seg{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:9px;border:2px solid transparent;cursor:grab;transition:all .3s;user-select:none}
.attn-seg:active{cursor:grabbing;transform:scale(0.98)}
.attn-label{font-size:14px;font-weight:800;min-width:90px;flex-shrink:0}
.attn-content{font-size:14px;color:var(--sub);flex:1;line-height:1.4}
.attn-heat{width:70px;height:26px;border-radius:5px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:white;transition:all .4s}
.attn-note{font-size:13px;padding:9px 12px;border-radius:8px;text-align:center;font-weight:600}

/* General */
.stat-row{display:flex;gap:8px;flex-wrap:wrap}
.stat-box{flex:1;min-width:120px;border-radius:8px;padding:10px;text-align:center}
.stat-box .sv{font-size:24px;font-weight:900;transition:all .4s}
.stat-box .sl{font-size:12px;font-weight:700;margin-top:1px}
.stat-box.good{background:rgba(22,163,74,.07);border:1px solid rgba(22,163,74,.2)}
.stat-box.good .sv{color:var(--green)}
.stat-box.bad{background:rgba(220,38,38,.07);border:1px solid rgba(220,38,38,.2)}
.stat-box.bad .sv{color:var(--red)}
.stat-box.neutral{background:var(--surface);border:1px solid var(--border)}
.stat-box.neutral .sv{color:var(--purple)}
.sl{color:var(--muted)}

@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.06)}100%{transform:scale(1)}}
.pop{animation:pop .3s ease}

@media (max-width:768px){
  .fewshot-wrap,.compress-wrap{grid-template-columns:1fr}
  .case-pool,.prompt-box,.doc-box{max-height:280px}
  .attn-label{min-width:76px;font-size:13px}
  .attn-content{font-size:13px}
  .stat-box .sv{font-size:20px}
}

<script>
// ── Strategy 1: Dynamic Few-Shot ──
const ALL_CASES = [
  { q: 'Q: 2024년 매출 상위 5개 제품 조회', sim: 0.95, sql: 'SELECT p.name, SUM(o.amount) AS sales\nFROM orders o JOIN products p ON...\nORDER BY sales DESC LIMIT 5' },
  { q: 'Q: 지역별 이번 달 주문 총량 집계', sim: 0.78, sql: 'SELECT region, COUNT(*) AS cnt\nFROM orders WHERE MONTH(...)' },
  { q: 'Q: 환불률 5% 초과 상품 찾기', sim: 0.62, sql: 'SELECT product_id, refund_rate\nFROM (...) WHERE refund_rate > 0.05' },
  { q: 'Q: 활성 사용자 평균 소비 금액 조회', sim: 0.51, sql: 'SELECT AVG(total) FROM orders\nWHERE user_id IN (SELECT ...)' },
  { q: 'Q: 카테고리별 재고 수량 집계', sim: 0.38, sql: 'SELECT category, SUM(stock) FROM products GROUP BY category' },
  { q: 'Q: 최근 7일 신규 가입 사용자 수 조회', sim: 0.29, sql: 'SELECT COUNT(*) FROM users WHERE created_at > NOW()-7' },
];

function renderFewShot() {
  return `
  <div class="fewshot-wrap">
    <div class="fs-col">
      <div class="fs-col-title bad">케이스 풀 (20개 고정 케이스)</div>
      <div class="case-pool" id="casePool">
        ${ALL_CASES.map((c,i)=>`
          <div class="case-item" id="ci${i}">
            <div class="ci-q">${c.q}</div>
            <div style="font-size:11px;color:var(--muted);margin-top:2px">관련도 ${Math.round(c.sim*100)}%</div>
          </div>`).join('')}
      </div>
      <div class="tok-bar">
        <span style="font-size:13px;font-weight:700;color:var(--muted)">기존 방식</span>
        <div class="tok-track"><div class="tok-fill" style="width:100%;background:var(--red)"></div></div>
        <span class="tok-num" style="color:var(--red)">4,000 T</span>
      </div>
    </div>
    <div class="fs-col">
      <div class="fs-col-title good">Prompt 주입 (동적 검색 Top-3)</div>
      <pre class="prompt-box" id="promptBox"><span class="p-sys">System: 당신은 SQL 전문가입니다.</span>

<span style="color:var(--muted)">← "검색 시작"을 클릭하여
   벡터 매칭 과정을 시뮬레이션하세요</span></pre>
      <div class="tok-bar">
        <span style="font-size:13px;font-weight:700;color:var(--muted)">새 방식</span>
        <div class="tok-track"><div class="tok-fill" id="newTokBar" style="width:0%;background:var(--green)"></div></div>
        <span class="tok-num" id="newTokNum" style="color:var(--green)">0 T</span>
      </div>
    </div>
  </div>
  <div class="stat-row">
    <div class="stat-box bad"><div class="sv">4,000</div><div class="sl">기존 방식 Token</div></div>
    <div class="stat-box neutral"><div class="sv" id="fsSave">—</div><div class="sl">절약 비율</div></div>
    <div class="stat-box good"><div class="sv" id="fsSpeed">—</div><div class="sl">응답 속도</div></div>
    <div class="stat-box neutral" style="background:rgba(22,163,74,.04);border-color:rgba(22,163,74,.2)">
      <div class="sv" style="color:var(--green)" id="fsAcc">—</div><div class="sl">정확도 변화</div></div>
  </div>
  <div style="display:flex;gap:8px;flex-shrink:0">
    <button class="btn-sim btn-primary" id="btnSim" onclick="runFewShot()">▶ 검색 시작</button>
    <button class="btn-sim btn-reset" onclick="resetFewShot()">초기화</button>
    <span style="font-size:13px;color:var(--muted);align-self:center">사용자 질문: 이번 달 지역별 매출 Top-5 제품 조회</span>
  </div>`;
}

let fsStep = 0, fsTimer = null;
function runFewShot() {
  const btn = document.getElementById('btnSim');
  if (fsStep >= 3) return;
  btn.disabled = true;

  const sorted = [...ALL_CASES].sort((a,b)=>b.sim-a.sim);
  let delay = 0;
  const selected = [];

  sorted.forEach((c, rank) => {
    const origIdx = ALL_CASES.indexOf(c);
    setTimeout(() => {
      const el = document.getElementById('ci'+origIdx);
      if (rank < 3) {
        el.classList.add('selected');
        selected.push(c);
        updatePromptBox(selected);
        const tok = 120 + selected.length * 130;
        const pct = Math.round(tok / 4000 * 100);
        document.getElementById('newTokBar').style.width = pct + '%';
        document.getElementById('newTokNum').textContent = tok + ' T';
        if (selected.length === 3) {
          document.getElementById('fsSave').textContent = '87.5%';
          document.getElementById('fsSave').classList.add('pop');
          document.getElementById('fsSpeed').textContent = '3x↑';
          document.getElementById('fsAcc').textContent = '↑더 높음';
          btn.disabled = false;
          btn.textContent = '✓ 완료';
        }
      } else {
        el.classList.add('greyed');
      }
    }, delay);
    delay += rank < 3 ? 600 : 200;
  });
}

function updatePromptBox(cases) {
  const box = document.getElementById('promptBox');
  let html = `<span class="p-sys">System: 당신은 SQL 전문가입니다.</span>\n\n`;
  cases.forEach((c,i) => {
    html += `<span class="p-case">/* 케이스 ${i+1} (관련도 ${Math.round(c.sim*100)}%) */\n${c.q}\nSQL: ${c.sql}</span>\n\n`;
  });
  html += `<span class="p-user">User: 이번 달 지역별 매출 Top-5 제품 조회</span>`;
  box.innerHTML = html;
  box.scrollTop = box.scrollHeight;
}

function onCompress(slider) {
  const val = +slider.value; // 0/1/2/3
  const pct = (val / 3 * 100).toFixed(0);
  slider.style.setProperty('--pct', pct + '%');

  const lv = COMPRESS_LEVELS[val];

  // Right panel: switch content
  const compBox = document.getElementById('docCompressed');
  compBox.style.opacity = '0';
  setTimeout(() => {
    compBox.innerHTML = lv.html;
    compBox.style.opacity = '1';
  }, 150);

  // Right panel: update title
  document.getElementById('compTitle').textContent = `압축 후 (LLMLingua-2): ${lv.label}`;
  document.getElementById('compTitle').style.color = lv.titleColor;

  // Left panel: highlight sentences to be deleted based on level
  ORIG_PARAS.forEach((p, i) => {
    const el = document.getElementById('orig' + i);
    if (!el) return;
    if (val >= p.delAt) {
      el.style.opacity = '0.35';
      el.style.textDecoration = 'line-through';
      el.style.color = 'rgba(220,38,38,0.5)';
    } else {
      el.style.opacity = '1';
      el.style.textDecoration = 'none';
      el.style.color = 'var(--text)';
    }
  });

  // Stats
  const barPct = Math.round(lv.tok / 10000 * 100);
  const barColor = lv.savePct > 80 ? 'var(--green)' : lv.savePct > 50 ? 'var(--amber)' : 'var(--sub)';
  document.getElementById('compBar').style.width = barPct + '%';
  document.getElementById('compBar').style.background = barColor;
  document.getElementById('compTok').textContent = lv.tok.toLocaleString() + ' T';
  document.getElementById('compTok').style.color = barColor;
  document.getElementById('compRemain').textContent = lv.tok.toLocaleString();
  document.getElementById('compRemain').style.color = lv.savePct > 80 ? 'var(--green)' : lv.savePct > 50 ? 'var(--amber)' : 'var(--sub)';
  document.getElementById('compSave').textContent = lv.savePct + '%';
  document.getElementById('compSave').style.color = lv.savePct > 80 ? 'var(--green)' : lv.savePct > 50 ? 'var(--amber)' : 'var(--sub)';
  document.getElementById('compRatio').textContent = lv.label;
}

    div.dataset.pos = pos;

      div.innerHTML = `
      <div style="font-size:18px;color:${s.color}55;flex-shrink:0;cursor:grab" title="드래그하여 정렬">⠿</div>
      <div class="attn-label" style="color:${s.color}">${s.label}</div>
      <div class="attn-content">${s.text}</div>
      <div class="attn-heat" style="background:${heatColor}">${attnPct}% ${heatLabel}</div>
    `;

    div.addEventListener('dragstart', e => {
      dragSrc = div;
      dragSrcIdx = pos;
      setTimeout(() => div.style.opacity = '0.4', 0);
      e.dataTransfer.effectAllowed = 'move';
    });
    div.addEventListener('dragend', () => {
      div.style.opacity = '1';
      container.querySelectorAll('.attn-seg').forEach(el => el.classList.remove('drag-over'));
    });
    div.addEventListener('dragover', e => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      container.querySelectorAll('.attn-seg').forEach(el => el.classList.remove('drag-over'));
      div.classList.add('drag-over');
    });
    div.addEventListener('dragleave', () => div.classList.remove('drag-over'));
    div.addEventListener('drop', e => {
      e.preventDefault();
      const targetPos = +div.dataset.pos;
      if (dragSrcIdx !== null && dragSrcIdx !== targetPos) {
        // Swap two segments
        [attnOrder[dragSrcIdx], attnOrder[targetPos]] = [attnOrder[targetPos], attnOrder[dragSrcIdx]];
        buildAttnUI();
      }
    });

    container.appendChild(div);
  });

  // Add drag-over style
  if (!document.getElementById('drag-style')) {
    const st = document.createElement('style');
    st.id = 'drag-style';
    st.textContent = '.attn-seg.drag-over{outline:2.5px dashed var(--purple);background:rgba(91,79,207,.07)!important;transform:scale(1.01)}';
    document.head.appendChild(st);
  }

  updateAttnStats();
}

function updateAttnStats() {
  const sysPos  = attnOrder.indexOf(0); // System Prompt
  const userPos = attnOrder.indexOf(3); // User question
  const n = attnOrder.length;
  const posAttnPct = [92, 45, 32, 88];

  const sysA  = posAttnPct[sysPos]  || 32;
  const userA = posAttnPct[userPos] || 32;
  const overall = Math.round((sysA + userA) / 2);

  document.getElementById('attnSysScore').textContent = sysA + '%';
  document.getElementById('attnSysScore').style.color = sysA > 70 ? 'var(--green)' : sysA > 50 ? 'var(--orange)' : 'var(--red)';
  document.getElementById('attnUserScore').textContent = userA + '%';
  document.getElementById('attnUserScore').style.color = userA > 70 ? 'var(--green)' : userA > 50 ? 'var(--orange)' : 'var(--red)';
  document.getElementById('attnOverall').textContent = overall > 70 ? '우수' : overall > 50 ? '보통' : '미흡';
  document.getElementById('attnOverall').style.color = overall > 70 ? 'var(--green)' : overall > 50 ? 'var(--orange)' : 'var(--red)';

  const note = document.getElementById('attnNote');
  if (overall > 70) {
    note.style.background = 'rgba(22,163,74,.08)';
    note.style.color = 'var(--green)';
    note.textContent = '✓ 핵심 정보가 처음과 끝에 위치, 모델 어텐션 집중, 최적 성능!';
  } else if (sysPos >= 1 && sysPos <= 2) {
    note.style.background = 'rgba(220,38,38,.06)';
    note.style.color = 'var(--red)';
    note.textContent = '✗ 핵심 제약이 중간에 묻혔습니다, 모델이 무시할 수 있습니다! 처음으로 드래그해보세요.';
  } else {
    note.style.background = 'rgba(234,88,12,.06)';
    note.style.color = 'var(--orange)';
    note.textContent = '△ 더 최적화할 수 있습니다, 사용자 질문을 마지막으로 드래그해보세요.';
  }
}

// ── Main control ──
let curStrat = 0;
function pickStrat(btn, idx) {
  document.querySelectorAll('.strat-btn').forEach((b,i)=>b.classList.toggle('active',i===idx));
  curStrat = idx;
  const titles = ['동적 Few-Shot: Text-to-SQL 데모','긴 문서 압축: LLMLingua-2 실전 데모','핵심 정보 위치: 드래그하여 순서 조정'];
  document.getElementById('demoTitle').textContent = titles[idx];
  const area = document.getElementById('demoArea');
  if (idx === 0) {
    area.innerHTML = renderFewShot();
  } else if (idx === 1) {
    area.innerHTML = renderCompress();
    setTimeout(() => {
      // Initialize right panel content (level 0)
      document.getElementById('docCompressed').innerHTML = COMPRESS_LEVELS[0].html;
    }, 50);
  } else {
    attnOrder = [0,1,2,3];
    area.innerHTML = renderAttn();
    setTimeout(buildAttnUI, 50);
  }
}

pickStrat(document.querySelector('.strat-btn'), 0);
</script>
