<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<title>跳转中…</title>
<script>
/* 与根目录 index.html 同一套口径：先认用户选过的语言，没有再猜浏览器语言。
   meta refresh 留作脚本被禁时的兜底，所以这段要跑在它前面。 */
(function(){
  var lang = '';
  try { lang = localStorage.getItem('xueai_lang') || ''; } catch(e) {}
  if (!lang) {
    var nav = (navigator.language || '').toLowerCase();
    if (nav.indexOf('ko') === 0) lang = 'ko';
    else if (nav.indexOf('zh') === 0) lang = 'zh';
    else lang = 'en';
  }
  window.location.replace(lang === 'zh' ? 'home.html' : 'home.' + lang + '.html');
})();
</script>
<meta http-equiv="refresh" content="0;url=home.html">
</head>
<body>
<p>正在跳转到课程首页，如未自动跳转，<a href="home.html">请点击这里</a>。</p>
</body>
</html>
