<body>
<article class="lesson wide">
  <header class="lesson-header">

    <h1>좋은 질문 vs 나쁜 질문: <em>컨텍스트가 모든 것을 결정합니다</em></h1>
    <p class="subtitle">같은 AI라도 질문 방식에 따라 결과물이 완전히 달라집니다. 시나리오를 클릭해서 비교해 보세요.</p>
  </header>

  <div class="sec-label">시나리오 선택</div>

  <div class="sec-label">비교 시연</div>

    <div class="cmp-col cmp-bad" id="colBad"></div>
    <div class="cmp-col cmp-good" id="colGood"></div>
  </div>
  <div class="insight" id="insightBar"></div>
</article>
<script>
const SCENES = [
  {
    name: '주간 보고서',
    bad: {
      prompt: '주간 보고서 작성해줘',
      response: '이번 주에는 관련 업무를 완료하고, 여러 프로젝트 추진에 참여하며, 팀과 효과적으로 소통했습니다. 다음 주에는 계속해서 업무를 추진하고 목표를 제때 완료하겠습니다…',
      tags: ['구체적 내용 없음', '전부 템플릿 허언', '누구에게나 적용 가능'],
    },
    good: {
      prompt: '나는 프로덕트 매니저입니다. 이번 주: 1) 사용자 리서치 보고서 완료(8명 인터뷰); 2) v2.3 요구사항 검토, 우선순위 낮은 기능 3개 삭제; 3) 개발팀과 일정 조율, 2일 지연.\n\n결정 사항과 진행 상황을 강조한 간결한 주간 보고서를 작성해줘. 실용적인 톤으로, 과장 없이, 3단락 이내.',
      response: '이번 주는 v2.3 버전 추진에 집중했습니다. <span class="highlight">8명 사용자 리서치 완료</span>—핵심 불편 사항이 온보딩 플로우에 집중되어 있으며, 리포트는 디자인팀에 공유했습니다. 요구사항 검토에서 <span class="highlight">우선순위 낮은 기능 3개를 능동적으로 삭제</span>하여 핵심 경로에 리소스를 집중시켰습니다. 개발 일정 조율 후 <span class="highlight">2일 지연 예상</span>되며, PMO에 통보하고 마일스톤을 조정했습니다.',
      tags: ['구체적 내용', '결정 + 데이터', '톤 정확'],
    },
    insight: '차이가 뭔가요? 좋은 질문은 <em>역할 + 사실 + 스타일 요구사항</em>을 제공했습니다. AI가 못 쓰는 게 아니라 <strong>무엇을 써야 할지 몰랐던 것</strong>입니다. 배경 정보를 더 많이 제공할수록 출력이 더 정확해집니다.'
  },
  {
    name: '데이터 분석',
    bad: {
      prompt: '데이터 분석 좀 해줘',
      response: '데이터 분석은 여러 차원에서 접근해야 합니다. 먼저 분석 목적을 명확히 하고, 관련 데이터를 수집한 다음, 적절한 분석 방법을 선택하세요… Excel 또는 Python 사용을 권장합니다.',
      tags: ['허언만 늘어놓음', '실제 분석 없음', '교과서식 회피'],
    },
    good: {
      prompt: '다음은 우리 앱의 최근 7일 데이터입니다:\n- DAU: 12k→15k→14k→13k→18k→16k→15k\n- 신규 가입: 800→1200→950→900→1500→1100→980\n- 익일 리텐션: 35%→32%→33%→31%→28%→30%→29%\n\n이상 징후를 찾아내고, 가능한 원인을 분석하고, 실행 가능한 제안 3가지를 주세요.',
      response: '<strong>이상 징후:</strong> 5일차에 DAU와 신규 가입이 동시에 급등(<span class="highlight">DAU +38%, 가입 +67%</span>). 외부 트래픽 유입 추정(광고/추천/화제 이벤트).\n\n<strong>우려 사항:</strong> 익일 리텐션이 5일차부터 <span class="highlight">28-29%로 지속 하락</span>—신규 사용자 품질이 낮고 온보딩이 제대로 되지 않음을 시사합니다.\n\n<strong>제안:</strong> ① 5일차 트래픽 출처 확인 및 ROI 평가; ② 신규 사용자 첫날 온보딩 플로우 최적화; ③ 리텐션 낮은 채널의 광고 비중 축소.',
      tags: ['이상 징후 포착', '원인 분석', '실행 가능한 제안'],
    },
    insight: '차이가 뭔가요? 나쁜 질문은 데이터를 제공하지 않아 AI가 방법론만 말할 수 있었습니다. 좋은 질문은 <em>데이터를 직접 붙여넣어</em> AI가 즉시 분석가로 변했습니다. <strong>AI가 실제로 일하려면 원재료가 필요합니다.</strong>'
  },
  {
    name: '이메일 초안',
    bad: {
      prompt: '고객에게 이메일 써줘',
      response: '존경하는 고객님:\n\n안녕하세요! 지속적인 지원과 신뢰에 감사드립니다. 관련 사항에 대해 소통하고자 이 이메일을 작성합니다…\n\n답변 기다리겠습니다.\n\n감사합니다.',
      tags: ['주제 없음', '공허한 인사치레', '전혀 쓸 수 없음'],
    },
    good: {
      prompt: '상황: 고객(박 이사님, 제조업, 2년 파트너십)의 시스템에 지난주 버그가 발생해 생산 라인이 4시간 중단됐습니다. 수정했지만 고객이 매우 불만족스러워합니다.\n\n사과 + 사후 검토 이메일 작성: 진심 어리지만 비굴하지 않게, 근본 원인과 시정 조치를 설명, 공식적이지만 딱딱하지 않은 어조, 200자 이내.',
      response: '박 이사님께:\n\n지난주 시스템 장애로 인해 귀사 생산에 발생한 지장에 대해 진심으로 사과드립니다.\n\n<span class="highlight">근본 원인</span>: 높은 동시성 환경에서 DB 연결 풀 오버플로우가 발생해 서비스 중단이 일어났습니다. <span class="highlight">시정 조치</span>: 연결 풀 확장 + 서킷 브레이커 배포를 완료했으며, 24시간 모니터링 알림을 추가했습니다.\n\n재발 방지를 위해 이번 주에 <span class="highlight">무료 시스템 건강 점검</span>을 제공하며, 기술 책임자가 직접 대응하겠습니다.\n\n이후 문의 사항이 있으시면 언제든지 연락해 주세요.',
      tags: ['적절한 어조', '원인 + 조치', '보상 방안 포함'],
    },
    insight: '차이가 뭔가요? 좋은 질문은 <em>완전한 상황(등장인물, 사건, 감정, 제약)</em>을 제공했습니다. 이메일 작성은 타이핑이 아니라 <strong>특정 상황에서의 소통</strong>입니다. 상황이 명확할수록 이메일이 더 적절해집니다.'
  },
  {
    name: '개념 학습',
    bad: {
      prompt: 'RAG가 뭔가요?',
      response: 'RAG(Retrieval-Augmented Generation)는 검색과 생성을 결합한 방법입니다. 외부 지식 베이스에서 관련 정보를 검색하여 언어 모델에 컨텍스트로 제공함으로써 생성 품질과 정확성을 향상시킵니다…',
      tags: ['백과사전식 답변', '읽어도 여전히 불명확', '직관 없음'],
    },
    good: {
      prompt: '저는 기술을 전혀 모르는 프로덕트 매니저입니다. RAG가 무엇이고 어떤 문제를 해결하는지 일상적인 비유로 설명해 주세요.\n\n요구사항: 먼저 한 문장으로 결론, 그 다음 비유로 확장, 마지막으로 PM으로서 RAG에서 신경 써야 할 한 가지를 알려주세요.',
      response: '<strong>한 문장으로:</strong> RAG는 AI가 답하기 전에 자료를 찾아보게 해서 순전히 기억에만 의존하지 않게 합니다.\n\n<span class="highlight">비유:</span> 최우등생에게 "우리 회사 경비 처리 절차가 뭐야?"라고 물어본다고 상상해 보세요. 아무리 똑똑해도 회사 규정을 본 적 없으면 추측할 수밖에 없습니다. 하지만 먼저 《경비 처리 규정》 문서를 건네주면 읽으면서 답합니다—이것이 RAG입니다.\n\n<strong>PM이 신경 써야 할 것:</strong> ① 가져오는 자료의 품질이 답변 품질을 결정합니다(검색 정확도); ② 자료가 너무 많으면 컨텍스트 창을 초과해 잘립니다; ③ RAG는 만능이 아닙니다—자료에 없는 지식은 여전히 할루시네이션이 발생합니다.',
      tags: ['비유적 직관', '명확한 구조', '역할별 조언'],
    },
    insight: '차이가 뭔가요? 좋은 질문은 <em>나는 누구인지, 어떤 형식을 원하는지, 어떤 관점이 중요한지</em>를 명확히 했습니다. 배울 때는 <strong>"무엇을 가르쳐 줄지"보다 "어떻게 가르쳐 줄지"가 더 중요합니다.</strong>'
  },
  {
    name: '광고 카피',
    bad: {
      prompt: '광고 문구 써줘',
      response: '더 나은 삶을 만들어드립니다!\n품질의 선택, 신뢰의 가치.\n함께 걷는 길, 미래를 함께.',
      tags: ['만능 허언', '특색 없음', '어디에나 사용 가능'],
    },
    good: {
      prompt: '제품: 25-35세 1인 가구 청년을 위한 스마트 아로마 디퓨저, "집에 돌아오는 것이 특별하게"를 컨셉으로.\n\n브랜드 톤: 따뜻하지만 과하지 않게, 약간의 유머.\n\n대안 광고 문구 5개 제시. 각 15자 이내. "품질", "스마트", "테크" 같은 흔한 단어 제외.',
      response: '1. <span class="highlight">문을 여는 순간, 집이 기다리고 있습니다.</span>\n2. 혼자 살아도 향기에 안길 자격이 있습니다.\n3. <span class="highlight">남들은 야근에 지쳐 귀가하지만, 당신은 라벤더 향으로 맞이합니다.</span>\n4. 의식은 비싸지 않습니다. 그냥 플러그만 꽂으면 됩니다.\n5. 집은 전세이지만, 향기는 내 것입니다.',
      tags: ['정확한 타겟', '톤 매칭', '바로 사용 가능'],
    },
    insight: '차이가 뭔가요? 좋은 질문은 <em>제품, 타겟, 톤, 금지어, 형식 제약</em>을 제공했습니다. 창의성은 제멋대로가 아니라 <strong>명확한 프레임 안에서의 발휘</strong>입니다. 프레임이 명확할수록 창의적 결과물이 더 정확해집니다.'
  }
];

function renderScene(idx) {
  document.querySelectorAll('.scene-chip').forEach((c,i) => c.classList.toggle('active', i===idx));
  const s = SCENES[idx];

  document.getElementById('colBad').innerHTML = `
    <div class="cmp-label">❌ 나쁜 질문</div>
    <div class="msg-bubble msg-user-bad"><div class="msg-lbl">당신의 말</div>${s.bad.prompt.replace(/\n/g,'<br>')}</div>
    <div class="msg-bubble msg-ai"><div class="msg-lbl">AI 응답</div>${s.bad.response.replace(/\n/g,'<br>')}</div>
    <div style="display:flex;gap:5px;flex-wrap:wrap">${s.bad.tags.map(t=>`<span class="diff-tag diff-bad">${t}</span>`).join('')}</div>
  `;
  document.getElementById('colGood').innerHTML = `
    <div class="cmp-label">✅ 좋은 질문</div>
    <div class="msg-bubble msg-user-good"><div class="msg-lbl">당신의 말</div>${s.good.prompt.replace(/\n/g,'<br>')}</div>
    <div class="msg-bubble msg-ai"><div class="msg-lbl">AI 응답</div>${s.good.response.replace(/\n/g,'<br>')}</div>
    <div style="display:flex;gap:5px;flex-wrap:wrap">${s.good.tags.map(t=>`<span class="diff-tag diff-good">${t}</span>`).join('')}</div>
  `;
  document.getElementById('insightBar').innerHTML = `
    <div class="insight-icon">💡</div>
    <div class="insight-text">${s.insight}</div>
  `;
}

const row = document.getElementById('sceneRow');
SCENES.forEach((s,i) => {
  const btn = document.createElement('button');
  btn.className = 'scene-chip' + (i===0?' active':'');
  btn.textContent = s.name;
  btn.onclick = () => renderScene(i);
  row.appendChild(btn);
});
